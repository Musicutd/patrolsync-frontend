<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing & Invoices</title><style>body{font-family:Arial;max-width:1250px;margin:24px auto;padding:0 15px;background:#f8fafc;color:#172033}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:8px}input,select,button{padding:9px;box-sizing:border-box}button{border:0;border-radius:5px;background:#2563eb;color:#fff;cursor:pointer}.issue{background:#16a34a}.cancel{background:#dc2626}.pay{background:#7c3aed}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px;background:#e2e8f0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eff6ff;padding:13px;border-radius:7px}.error{color:#dc2626}@media(max-width:850px){.grid,.summary{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head><body>
<p><a href="dashboard.html">← Dashboard</a></p><h2>Billing & Invoicing</h2><p>Generate charges from contract rates, approved attendance hours, or completed patrols.</p>
<div class="card"><h3>Generate Draft Invoice</h3><div class="grid"><select id="contract"><option value="">Select active contract</option></select><input id="start" type="date" title="Period start"><input id="end" type="date" title="Period end"><input id="tax" type="number" min="0" max="100" step="0.01" value="0" placeholder="Tax %"><input id="due" type="number" min="0" value="30" placeholder="Due days"><button id="generate">Generate</button></div><input id="notes" placeholder="Invoice notes (optional)" style="width:100%;margin-top:8px"><p id="message" class="error"></p></div>
<div class="card"><div class="summary"><div class="stat">Draft<br><b id="draft">0</b></div><div class="stat">Outstanding<br><b id="outstanding">0.00</b></div><div class="stat">Overdue<br><b id="overdue">0</b></div><div class="stat">Paid<br><b id="paid">0.00</b></div></div></div>
<div class="card"><h3>Invoices</h3><select id="status"><option value="all">All statuses</option><option>draft</option><option>issued</option><option>overdue</option><option>paid</option><option>cancelled</option></select> <button id="refresh">Refresh</button><table><thead><tr><th>Invoice</th><th>Client / Site</th><th>Period</th><th>Total</th><th>Balance</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody id="body"></tbody></table></div>
<script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'}),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');async function api(path,o={}){const r=await fetch(API+path,{...o,headers:H()}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:`HTTP ${r.status} from ${path}`};if(!r.ok)throw Error(d.error||'Request failed');return d}const day=d=>d.toISOString().slice(0,10),money=(c,n)=>`${c} ${Number(n).toFixed(2)}`;let rows=[];
async function init(){const contracts=await api('/api/service-contracts?tenant_id='+tenant+'&status=active');$('contract').innerHTML='<option value="">Select active contract</option>'+contracts.map(c=>`<option value="${c.id}">${esc(c.reference_code)} — ${esc(c.client_name)} / ${esc(c.site_name)} (${esc(c.billing_model)} ${esc(c.currency)} ${Number(c.rate||0).toFixed(2)})</option>`).join('');const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1);$('start').value=day(start);$('end').value=day(now);load()}
async function generate(){try{if(!$('contract').value)throw Error('Select an active contract');await api('/api/invoices/generate',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),contract_id:Number($('contract').value),period_start:$('start').value,period_end:$('end').value,tax_rate:Number($('tax').value),due_days:Number($('due').value),notes:$('notes').value})});$('message').textContent='Draft invoice generated.';load()}catch(e){$('message').textContent=e.message}}
async function load(){try{rows=await api('/api/invoices?tenant_id='+tenant+'&status='+$('status').value);$('body').innerHTML=rows.length?rows.map(i=>{const balance=Number(i.total)-Number(i.amount_paid);return`<tr><td>${esc(i.invoice_number)}</td><td>${esc(i.client_name)}<br>${esc(i.site_name)}</td><td>${String(i.period_start).slice(0,10)} – ${String(i.period_end).slice(0,10)}</td><td>${money(i.currency,i.total)}</td><td>${money(i.currency,balance)}</td><td>${String(i.due_date).slice(0,10)}</td><td><span class="badge">${esc(i.status)}</span></td><td><button onclick="pdf(${i.id})">PDF</button> ${i.status==='draft'?`<button class="issue" onclick="state(${i.id},'issued')">Issue</button> <button class="cancel" onclick="state(${i.id},'cancelled')">Cancel</button>`:''}${['issued','overdue'].includes(i.status)?` <button class="pay" onclick="pay(${i.id},${balance},'${i.currency}')">Payment</button> <button class="cancel" onclick="state(${i.id},'cancelled')">Cancel</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="8">No invoices.</td></tr>';const all=await api('/api/invoices?tenant_id='+tenant+'&status=all');$('draft').textContent=all.filter(x=>x.status==='draft').length;$('overdue').textContent=all.filter(x=>x.status==='overdue').length;$('outstanding').textContent=all.filter(x=>['issued','overdue'].includes(x.status)).reduce((a,x)=>a+Number(x.total)-Number(x.amount_paid),0).toFixed(2);$('paid').textContent=all.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount_paid),0).toFixed(2)}catch(e){$('message').textContent=e.message}}
async function state(id,status){if(!confirm(`${status} this invoice?`))return;try{await api('/api/invoices/'+id+'/status',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),status})});load()}catch(e){alert(e.message)}}async function pay(id,balance,currency){const amount=prompt(`Payment amount (maximum ${currency} ${balance.toFixed(2)}):`,balance.toFixed(2));if(amount===null)return;const method=prompt('Payment method (bank transfer, card, cash):','bank transfer')||'',reference=prompt('Payment reference (optional):','')||'';try{await api('/api/invoices/'+id+'/payments',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),amount:Number(amount),payment_date:day(new Date()),method,reference})});load()}catch(e){alert(e.message)}}async function pdf(id){try{const r=await fetch(API+'/api/invoices/'+id+'/pdf?tenant_id='+tenant,{headers:H()});if(!r.ok){const d=await r.json();throw Error(d.error||'Download failed')}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='invoice-'+id+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert(e.message)}}$('generate').onclick=generate;$('refresh').onclick=load;$('status').onchange=load;init().catch(e=>$('message').textContent=e.message);</script></body></html>
