<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheduled Patrol Runs</title><style>body{font-family:Arial;max-width:1200px;margin:24px auto;padding:0 15px;background:#f8fafc}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:14px 0}.form{display:grid;grid-template-columns:1.3fr 1.3fr 1fr 1fr 100px;gap:8px}input,select,button{padding:9px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;border-radius:5px}.danger{background:#dc2626}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px;background:#dbeafe}.late,.missed,.incomplete{background:#fee2e2;color:#991b1b}.completed{background:#dcfce7;color:#166534}@media(max-width:800px){.form{grid-template-columns:1fr}table{display:block;overflow:auto}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Scheduled Patrol Runs</h2><div class="card"><h3>Assign a Patrol</h3><div class="form"><select id="route"><option value="">Select route</option></select><select id="guard"><option value="">Select guard</option></select><input id="start" type="datetime-local"><input id="end" type="datetime-local"><input id="grace" type="number" min="0" max="120" value="15" title="Grace minutes"></div><input id="notes" placeholder="Instructions (optional)" style="width:100%;margin-top:8px"><button id="create" style="margin-top:8px">Schedule Patrol</button><div id="message"></div></div><div class="card"><h3>Patrol Monitor</h3><div><input id="from" type="date"> <input id="to" type="date"> <button id="refresh">Refresh</button></div><table><thead><tr><th>Start</th><th>Guard</th><th>Route/Site</th><th>Progress</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),$=x=>document.getElementById(x);if(!token||!tenant)location.replace('login.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){const r=await fetch(API+u,{...o,headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){const [routes,users]=await Promise.all([api('/api/patrol-routes?tenant_id='+tenant),api('/api/users?tenant_id='+tenant+'&role=guard')]);$('route').innerHTML='<option value="">Select route</option>'+routes.filter(x=>x.active).map(x=>'<option value="'+x.id+'">'+esc(x.name)+' — '+esc(x.site_name)+'</option>').join('');$('guard').innerHTML='<option value="">Select guard</option>'+users.map(x=>'<option value="'+x.id+'">'+esc(x.email)+'</option>').join('');const now=new Date(),later=new Date(now.getTime()+60*60000);$('start').value=local(now);$('end').value=local(later);load()}
const local=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};async function create(){try{await api('/api/patrol-runs',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),route_id:Number($('route').value),user_id:Number($('guard').value),scheduled_start:new Date($('start').value).toISOString(),scheduled_end:new Date($('end').value).toISOString(),grace_minutes:Number($('grace').value),notes:$('notes').value})});$('message').textContent='Patrol scheduled.';load()}catch(e){$('message').textContent=e.message}}
async function load(){let q='?tenant_id='+tenant;if($('from').value)q+='&from_date='+$('from').value;if($('to').value)q+='&to_date='+$('to').value;try{const rows=await api('/api/patrol-runs'+q);$('body').innerHTML=rows.length?rows.map(x=>'<tr><td>'+esc(new Date(x.scheduled_start).toLocaleString())+'</td><td>'+esc(x.guard_email)+'</td><td>'+esc(x.route_name)+'<br><small>'+esc(x.site_name)+'</small></td><td>'+x.scanned_count+'/'+x.checkpoint_count+'</td><td><span class="badge '+esc(x.display_status)+'">'+esc(x.display_status)+'</span></td><td>'+(['scheduled','in_progress'].includes(x.status)?'<button class="danger" onclick="cancelRun('+x.id+')">Cancel</button>':'—')+'</td></tr>').join(''):'<tr><td colspan="6">No scheduled patrols.</td></tr>'}catch(e){$('message').textContent=e.message}}
async function cancelRun(id){if(!confirm('Cancel this patrol?'))return;try{await api('/api/patrol-runs/'+id+'/cancel',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant)})});load()}catch(e){alert(e.message)}}$('create').onclick=create;$('refresh').onclick=load;init().catch(e=>$('message').textContent=e.message);
</script></body></html>
