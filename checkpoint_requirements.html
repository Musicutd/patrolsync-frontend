<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkpoint Instructions</title><style>body{font-family:Arial;max-width:900px;margin:24px auto;padding:0 15px;background:#f8fafc}.card{background:white;border:1px solid #dbe2ea;border-radius:9px;padding:15px;margin:12px 0}select,textarea,button{padding:9px;box-sizing:border-box}select{width:100%}textarea{width:100%;min-height:75px;margin:8px 0}button{border:0;border-radius:5px;background:#2563eb;color:white}.number{display:inline-block;border-radius:50%;background:#2563eb;color:white;width:28px;height:28px;line-height:28px;text-align:center;margin-right:7px}.option{margin-right:18px}.success{color:#15803d}.error{color:#dc2626}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Checkpoint Instructions & Responses</h2><p>Set instructions and evidence requirements for each checkpoint in a patrol route.</p><div class="card"><label><b>Patrol route</b></label><select id="route"><option value="">Select a route</option></select><div id="message"></div></div><div id="checkpoints"></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),$=x=>document.getElementById(x);if(!token||!tenant)location.replace('login.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let routes=[];async function api(u,o={}){const r=await fetch(API+u,{...o,headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){routes=await api('/api/patrol-routes?tenant_id='+tenant);$('route').innerHTML='<option value="">Select a route</option>'+routes.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' — '+esc(x.site_name)+'</option>').join('')}
function render(){const r=routes.find(x=>x.id===Number($('route').value));$('checkpoints').innerHTML=r?r.checkpoints.map(c=>'<div class="card"><h3><span class="number">'+c.position+'</span>'+esc(c.name)+'</h3><label>Guard instructions</label><textarea id="instructions_'+c.checkpoint_id+'" placeholder="e.g. Check the fire exit is unobstructed">'+esc(c.instructions||'')+'</textarea><label class="option"><input id="confirm_'+c.checkpoint_id+'" type="checkbox" '+(c.requires_confirmation?'checked':'')+'> Require acknowledgement</label><label class="option"><input id="note_'+c.checkpoint_id+'" type="checkbox" '+(c.requires_note?'checked':'')+'> Require written observation</label><button onclick="save('+r.id+','+c.checkpoint_id+')">Save Requirements</button><span id="status_'+c.checkpoint_id+'"></span></div>').join(''):''}
async function save(routeId,checkpointId){const status=$('status_'+checkpointId);try{await api('/api/patrol-routes/'+routeId+'/checkpoints/'+checkpointId,{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),instructions:$('instructions_'+checkpointId).value,requires_confirmation:$('confirm_'+checkpointId).checked,requires_note:$('note_'+checkpointId).checked})});status.textContent=' Saved';status.className='success';await refreshRoute(routeId)}catch(e){status.textContent=' '+e.message;status.className='error'}}async function refreshRoute(id){const fresh=await api('/api/patrol-routes?tenant_id='+tenant);routes=fresh;$('route').value=id}$('route').onchange=render;init().catch(e=>$('message').textContent=e.message);
</script></body></html>
