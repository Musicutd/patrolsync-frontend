<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contract Renewals</title><style>body{font-family:Arial;max-width:1250px;margin:24px auto;padding:0 15px;background:#f8fafc;color:#172033}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:12px 0}.filters,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.renewal{border-left:5px solid #2563eb}.urgent{border-color:#dc2626}.warning{border-color:#f59e0b}input,select,textarea,button{padding:9px;box-sizing:border-box}button{border:0;border-radius:5px;background:#2563eb;color:white;cursor:pointer}.complete{background:#16a34a}.meta{color:#64748b;font-size:13px}.history{background:#f8fafc;padding:9px;margin-top:8px}.error{color:#dc2626}@media(max-width:850px){.filters,.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Contract Renewal Management</h2><p>Track expiring contracts, client discussions, proposed terms, follow-ups, and completed renewals.</p><div class="card filters"><select id="contract"><option value="">Add a contract to renewal pipeline</option></select><button id="add">Track Contract</button><select id="filter"><option value="all">All pipeline statuses</option><option>not_started</option><option>contacted</option><option>negotiating</option><option>awaiting_client</option><option>approved</option><option>renewed</option><option>lost</option></select><button id="refresh">Refresh</button></div><p id="message" class="error"></p><div id="summary" class="grid"></div><div id="renewals"></div>
<script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'}),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');let users=[];async function api(path,o={}){const r=await fetch(API+path,{...o,headers:H()}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:`HTTP ${r.status}`};if(!r.ok)throw Error(d.error||'Request failed');return d}async function init(){const [contracts,allUsers]=await Promise.all([api('/api/service-contracts?tenant_id='+tenant+'&status=all'),api('/api/users?tenant_id='+tenant)]);$('contract').innerHTML='<option value="">Add a contract to renewal pipeline</option>'+contracts.map(c=>`<option value="${c.id}">${esc(c.reference_code)} — ${esc(c.client_name)} / ${esc(c.site_name)}</option>`).join('');users=allUsers.filter(u=>u.role==='admin');load()}
async function add(){try{if(!$('contract').value)throw Error('Select a contract');await api('/api/contract-renewals',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),contract_id:Number($('contract').value)})});load()}catch(e){$('message').textContent=e.message}}async function load(){try{const rows=await api(`/api/contract-renewals?tenant_id=${tenant}&status=${$('filter').value}`);$('summary').innerHTML=[['Due ≤30 days',rows.filter(x=>x.days_remaining>=0&&x.days_remaining<=30).length],['Expired',rows.filter(x=>x.days_remaining<0&&x.status!=='renewed').length],['Negotiating',rows.filter(x=>x.status==='negotiating').length],['Renewed',rows.filter(x=>x.status==='renewed').length]].map(x=>`<div class="card"><b>${esc(x[0])}</b><h2>${x[1]}</h2></div>`).join('');$('renewals').innerHTML=rows.length?rows.map(card).join(''):'<div class="card">No renewals in this view.</div>';$('message').textContent=''}catch(e){$('message').textContent=e.message}}
function card(r){const cls=r.days_remaining<0?'urgent':r.days_remaining<=30?'urgent':r.days_remaining<=90?'warning':'',owners='<option value="">Unassigned</option>'+users.map(u=>`<option value="${u.id}" ${Number(r.owner_user_id)===Number(u.id)?'selected':''}>${esc(u.email)}</option>`).join(''),field=(label,control)=>`<label><small><b>${label}</b></small><br>${control}</label>`;return`<div class="card renewal ${cls}"><h3>${esc(r.reference_code)} — ${esc(r.client_name)}</h3><p class="meta">${esc(r.site_name)} · Contract ends ${String(r.end_date).slice(0,10)} · ${r.days_remaining<0?Math.abs(r.days_remaining)+' days expired':r.days_remaining+' days remaining'} · Current ${esc(r.current_currency)} ${Number(r.current_rate||0).toFixed(2)}</p><div class="grid">${field('Pipeline Status',`<select id="status-${r.id}">${['not_started','contacted','negotiating','awaiting_client','approved','renewed','lost'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select>`)}${field('Renewal Owner',`<select id="owner-${r.id}">${owners}</select>`)}${field('Proposed Start',`<input id="start-${r.id}" type="date" value="${r.proposed_start_date?String(r.proposed_start_date).slice(0,10):''}">`)}${field('Proposed End',`<input id="end-${r.id}" type="date" value="${r.proposed_end_date?String(r.proposed_end_date).slice(0,10):''}">`)}${field('Proposed Rate',`<input id="rate-${r.id}" type="number" step="0.01" value="${r.proposed_rate??r.current_rate??''}">`)}${field('Currency',`<input id="currency-${r.id}" value="${esc(r.proposed_currency||r.current_currency)}" maxlength="3">`)}${field('Next Follow-up',`<input id="follow-${r.id}" type="date" value="${r.next_follow_up_date?String(r.next_follow_up_date).slice(0,10):''}">`)}<button onclick="save(${r.id})">Save</button></div><label><small><b>Renewal Notes / History Note</b></small><br><textarea id="note-${r.id}" placeholder="Add renewal history note" style="width:100%;margin-top:5px">${esc(r.notes||'')}</textarea></label><p><button onclick="history(${r.id})">History (${r.history_count})</button> ${r.status==='approved'?`<button class="complete" onclick="completeRenewal(${r.id})">Create Renewed Contract</button>`:''}</p><div id="history-${r.id}" class="history" hidden></div></div>`}
async function save(id){try{await api('/api/contract-renewals/'+id,{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),status:$('status-'+id).value,owner_user_id:$('owner-'+id).value?Number($('owner-'+id).value):null,proposed_start_date:$('start-'+id).value,proposed_end_date:$('end-'+id).value||null,proposed_rate:$('rate-'+id).value,proposed_currency:$('currency-'+id).value,next_follow_up_date:$('follow-'+id).value||null,notes:$('note-'+id).value,history_note:$('note-'+id).value})});load()}catch(e){alert(e.message)}}async function history(id){const box=$('history-'+id);if(!box.hidden){box.hidden=true;return}try{const rows=await api(`/api/contract-renewals/${id}/history?tenant_id=${tenant}`);box.innerHTML=rows.length?rows.map(h=>`<p><b>${esc(h.action)}</b> — ${esc(h.note||'')}<br><small>${esc(h.email||'System')} · ${new Date(h.created_at).toLocaleString()}</small></p>`).join(''):'No history yet.';box.hidden=false}catch(e){alert(e.message)}}async function completeRenewal(id){if(!confirm('Create the renewed active contract and expire the previous contract?'))return;try{const c=await api('/api/contract-renewals/'+id+'/complete',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant)})});alert('Renewed contract created: '+c.reference_code);load()}catch(e){alert(e.message)}}$('add').onclick=add;$('refresh').onclick=load;$('filter').onchange=load;init().catch(e=>$('message').textContent=e.message);</script></body></html>
