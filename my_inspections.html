<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Inspections</title><style>body{font-family:Arial;max-width:800px;margin:20px auto;padding:0 14px;background:#f8fafc}.run{background:#fff;border:1px solid #ddd;border-radius:9px;padding:15px;margin:12px 0}.q{padding:11px;background:#f8fafc;margin:7px 0;border-radius:6px}select,textarea,button{width:100%;padding:9px;box-sizing:border-box;margin:4px 0}button{background:#16a34a;color:#fff;border:0;border-radius:5px}.badge{padding:3px 8px;border-radius:10px;background:#e2e8f0}.error{color:#dc2626}</style></head><body><p><a href="guard.html">← Guard Dashboard</a></p><h2>My Site Inspections</h2><p id="error" class="error"></p><div id="list"></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];if(!token||!tenant)location.replace('guard.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function submit(id){const box=document.querySelector(`[data-run="${id}"]`),responses=[...box.querySelectorAll('.q')].map(q=>({answer:q.querySelector('select').value,note:q.querySelector('textarea').value.trim()}));if(responses.some(x=>!x.answer))return alert('Answer every question.');if(!confirm('Submit this inspection? It cannot be edited afterwards.'))return;try{const r=await api('/api/inspection-runs/'+id+'/submit',{method:'POST',body:JSON.stringify({tenant_id:+tenant,responses,overall_note:box.querySelector('.overall').value})});alert('Inspection submitted. Score: '+r.score+'%');load()}catch(e){alert(e.message)}}async function load(){try{rows=await api('/api/inspection-runs?tenant_id='+tenant);$('list').innerHTML=rows.map(x=>`<div class="run" data-run="${x.id}"><h3>${esc(x.template_title)} <span class="badge">${esc(x.status)}</span></h3><p>${esc(x.site_name)} · scheduled ${new Date(x.scheduled_for).toLocaleString()}</p><p>${esc(x.template_description||'Complete every checklist item.')}</p>${x.status==='submitted'?`<p><b>Submitted score: ${x.score}%</b></p>`:(x.questions||[]).map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.text)}${q.critical?' ⚠️':''}</b>${q.guidance?`<p>${esc(q.guidance)}</p>`:''}<select><option value="">Select result</option><option value="pass">Pass</option><option value="fail">Fail</option><option value="na">Not applicable</option></select><textarea placeholder="Finding or evidence note (required when failed)"></textarea></div>`).join('')+`<textarea class="overall" placeholder="Overall inspection note"></textarea><button onclick="submit(${x.id})">Submit Inspection</button>`}</div>`).join('')||'<p>No inspections assigned.</p>';$('error').textContent=''}catch(e){$('error').textContent=e.message}}load();
</script></body></html>
