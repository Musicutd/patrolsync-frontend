<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Patrols</title><style>body{font-family:Arial;max-width:650px;margin:20px auto;padding:0 14px;background:#f8fafc}.run{background:#fff;border:1px solid #dbe2ea;border-left:5px solid #2563eb;border-radius:8px;padding:14px;margin:12px 0}.active{border-left-color:#16a34a}.bad{border-left-color:#dc2626}button{padding:10px;background:#2563eb;color:#fff;border:0;border-radius:5px;font-weight:bold}.scan{background:#16a34a}.badge{padding:3px 8px;border-radius:10px;background:#dbeafe}.steps{padding-left:22px}.done{text-decoration:line-through;color:#15803d}.next{font-weight:bold;color:#1d4ed8}.error{color:#dc2626}</style></head><body><p><a href="guard.html">← Guard Portal</a></p><h2>My Scheduled Patrols</h2><div id="message"></div><div id="runs">Loading…</div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');async function api(u,o={}){const r=await fetch(API+u,{...o,headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const rows=await api('/api/patrol-runs?tenant_id='+tenant);const relevant=rows.filter(x=>!['cancelled'].includes(x.status));runs.innerHTML=relevant.length?relevant.map(card).join(''):'<p>No patrols assigned.</p>'}catch(e){message.textContent=e.message;message.className='error'}}
function card(x){const bad=['late','missed','incomplete'].includes(x.display_status),active=x.status==='in_progress',next=x.checkpoints.find(c=>!c.scanned_at);return '<div class="run '+(bad?'bad':active?'active':'')+'"><h3>'+esc(x.route_name)+' <span class="badge">'+esc(x.display_status)+'</span></h3><p>'+esc(x.site_name)+'<br>'+esc(new Date(x.scheduled_start).toLocaleString())+' – '+esc(new Date(x.scheduled_end).toLocaleTimeString())+'<br>Progress: '+x.scanned_count+'/'+x.checkpoint_count+'</p><ol class="steps">'+x.checkpoints.map(c=>'<li class="'+(c.scanned_at?'done':next&&next.checkpoint_id===c.checkpoint_id?'next':'')+'">'+esc(c.name)+(c.scanned_at?' ✓':'')+'</li>').join('')+'</ol>'+(x.status==='scheduled'?'<button onclick="startRun('+x.id+')">Start Patrol</button>':active?'<button class="scan" onclick="scan('+x.id+')">Scan Next Checkpoint</button>':'')+'</div>'}
async function startRun(id){try{await api('/api/patrol-runs/'+id+'/start',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant)})});localStorage.setItem('active_patrol_run_id',id);location.href='guard.html'}catch(e){alert(e.message)}}function scan(id){localStorage.setItem('active_patrol_run_id',id);location.href='guard.html'}load();
</script></body></html>
