<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatrolSync Integrity Tests</title><style>body{font-family:Arial;max-width:1150px;margin:20px auto;padding:0 16px;background:#f8fafc;color:#0f172a}.card{background:#fff;border:1px solid #dbe3ee;border-radius:9px;padding:16px;margin:12px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:14px;border-radius:8px;background:#eff6ff}.metric b{display:block;font-size:25px;margin-top:5px}.pass{color:#15803d}.warn{color:#b45309}.fail{color:#dc2626}.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:bold;background:#e2e8f0}.badge.pass{background:#dcfce7}.badge.warn{background:#fef3c7}.badge.fail{background:#fee2e2}.details{background:#f8fafc;padding:9px;white-space:pre-wrap;overflow:auto;font-size:12px}button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}.muted{color:#64748b;font-size:13px}@media(max-width:650px){.summary{grid-template-columns:1fr}}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Automated Integrity & Smoke Tests</h2><p>Read-only checks for database readiness, duplicate identities, broken relationships, attendance conflicts, failed queues, and tenant isolation.</p><button onclick="runTests()">Run Tests</button> <span id="status" class="muted"></span><div id="summary" class="summary"></div><div id="checks"></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');async function runTests(){const status=document.getElementById('status');status.textContent=' Running read-only tests…';document.getElementById('checks').innerHTML='';try{const r=await fetch(API+'/api/diagnostics/integrity?tenant_id='+encodeURIComponent(tenant),{headers:{Authorization:'Bearer '+token}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Tests failed');document.getElementById('summary').innerHTML=`<div class="metric"><span>Passed</span><b class="pass">${d.summary.pass}</b></div><div class="metric"><span>Warnings</span><b class="warn">${d.summary.warn}</b></div><div class="metric"><span>Failures</span><b class="fail">${d.summary.fail}</b></div>`;document.getElementById('checks').innerHTML=d.checks.map(x=>`<div class="card"><span class="badge ${x.status}">${esc(x.status.toUpperCase())}</span> <b>${esc(x.label)}</b><p>${esc(x.message)}</p>${x.count?`<p><b>Records affected:</b> ${x.count}</p>`:''}${x.details&&x.details.length?`<details><summary>Show diagnostic details</summary><pre class="details">${esc(JSON.stringify(x.details,null,2))}</pre></details>`:''}</div>`).join('');status.textContent=` ${d.status.replaceAll('_',' ')} · completed in ${d.duration_ms} ms · ${new Date(d.generated_at).toLocaleString()}`}catch(e){status.textContent=' '+e.message;document.getElementById('summary').innerHTML=`<div class="card fail">${esc(e.message)}</div>`}}runTests();
</script></body></html>
