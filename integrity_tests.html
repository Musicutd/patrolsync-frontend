<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatrolSync Integrity Tests</title><style>body{font-family:Arial;max-width:1150px;margin:20px auto;padding:0 16px;background:#f8fafc;color:#0f172a}.card{background:#fff;border:1px solid #dbe3ee;border-radius:9px;padding:16px;margin:12px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:14px;border-radius:8px;background:#eff6ff}.metric b{display:block;font-size:25px;margin-top:5px}.pass{color:#15803d}.warn{color:#b45309}.fail{color:#dc2626}.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:bold;background:#e2e8f0}.badge.pass{background:#dcfce7}.badge.warn{background:#fef3c7}.badge.fail{background:#fee2e2}.details{background:#f8fafc;padding:9px;white-space:pre-wrap;overflow:auto;font-size:12px}button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}.muted{color:#64748b;font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}.notice{border-left:4px solid #f59e0b;background:#fffbeb}@media(max-width:650px){.summary{grid-template-columns:1fr}}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Automated Integrity & Smoke Tests</h2><p>Read-only checks for database readiness, duplicate identities, broken relationships, attendance conflicts, failed queues, and tenant isolation.</p><button onclick="runTests()">Run Tests</button> <button onclick="checkRls()">Check RLS Readiness</button> <span id="status" class="muted"></span><div id="summary" class="summary"></div><div id="checks"></div><div id="rls"></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');const auth=()=>({Authorization:'Bearer '+token});async function runTests(){const status=document.getElementById('status');status.textContent=' Running read-only tests…';document.getElementById('checks').innerHTML='';try{const r=await fetch(API+'/api/diagnostics/integrity?tenant_id='+encodeURIComponent(tenant),{headers:auth()}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Tests failed');document.getElementById('summary').innerHTML=`<div class="metric"><span>Passed</span><b class="pass">${d.summary.pass}</b></div><div class="metric"><span>Warnings</span><b class="warn">${d.summary.warn}</b></div><div class="metric"><span>Failures</span><b class="fail">${d.summary.fail}</b></div>`;document.getElementById('checks').innerHTML=d.checks.map(x=>`<div class="card"><span class="badge ${x.status}">${esc(x.status.toUpperCase())}</span> <b>${esc(x.label)}</b><p>${esc(x.message)}</p>${x.count?`<p><b>Records affected:</b> ${x.count}</p>`:''}${x.details&&x.details.length?`<details><summary>Show diagnostic details</summary><pre class="details">${esc(JSON.stringify(x.details,null,2))}</pre></details>`:''}</div>`).join('');status.textContent=` ${d.status.replaceAll('_',' ')} · completed in ${d.duration_ms} ms · ${new Date(d.generated_at).toLocaleString()}`}catch(e){status.textContent=' '+e.message;document.getElementById('summary').innerHTML=`<div class="card fail">${esc(e.message)}</div>`}}async function checkRls(){const box=document.getElementById('rls');box.innerHTML='<div class="card">Checking database policy readiness…</div>';try{const r=await fetch(API+'/api/diagnostics/rls-readiness?tenant_id='+encodeURIComponent(tenant),{headers:auth()}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'RLS check failed');box.innerHTML=`<div class="card notice"><h3>Database Row-Level Security</h3><p><b>Status:</b> ${esc(d.status.replaceAll('_',' '))}</p><p>This report is read-only. It does not enable RLS.</p><p><b>Application role:</b> ${esc(d.application_role.role_name)} · superuser: ${d.application_role.is_superuser?'yes':'no'} · BYPASSRLS: ${d.application_role.bypasses_rls?'yes':'no'}</p><ul>${d.blockers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card table-wrap"><table><thead><tr><th>Tenant table</th><th>Policies</th><th>RLS enabled</th><th>Forced</th><th>Ready</th></tr></thead><tbody>${d.tables.map(x=>`<tr><td>${esc(x.table_name)}</td><td>${x.policy_count}</td><td>${x.rls_enabled?'Yes':'No'}</td><td>${x.rls_forced?'Yes':'No'}</td><td class="${x.ready_for_enforcement?'pass':'warn'}">${x.ready_for_enforcement?'Yes':'Not yet'}</td></tr>`).join('')}</tbody></table></div>`}catch(e){box.innerHTML=`<div class="card fail">${esc(e.message)}</div>`}}runTests();checkRls();
</script><script>
async function checkDatabasePaths(){let box=document.getElementById('paths');if(!box){box=document.createElement('div');box.id='paths';document.getElementById('rls').before(box)}box.innerHTML='<div class="card">Checking system and tenant database paths…</div>';try{const r=await fetch(API+'/api/diagnostics/database-paths?tenant_id='+encodeURIComponent(tenant),{headers:auth()}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Database path check failed');box.innerHTML=`<div class="card ${d.status==='ready_for_enforcement'?'':'notice'}"><h3>System and Tenant Database Paths</h3><p><b>Status:</b> ${esc(d.status.replaceAll('_',' '))}</p><p><b>System role:</b> ${esc(d.system_role.role_name)}<br><b>Tenant role:</b> ${esc(d.tenant_role.role_name)}<br><b>Tenant context:</b> ${esc(d.tenant_role.tenant_context||'not set')}</p><p><b>Cross-company users visible through tenant path:</b> ${d.tenant_probe.cross_tenant_users_visible}</p><p><b>Can create restricted role using SQL:</b> ${d.role_creation.can_create_with_sql?'Yes':'No'}</p><p>${esc(d.role_creation.message)}</p><p><b>Next:</b> ${esc(d.next_action)}</p></div>`}catch(e){box.innerHTML=`<div class="card fail">${esc(e.message)}</div>`}}
checkDatabasePaths();
</script></body></html>
