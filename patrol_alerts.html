<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrol Exception Alerts</title><style>body{font-family:Arial;max-width:1200px;margin:24px auto;padding:0 15px;background:#f8fafc;color:#0f172a}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric,.card{background:white;border:1px solid #dbe2ea;border-radius:9px;padding:15px}.metric b{font-size:26px;display:block;margin-top:5px}.filters{margin:14px 0}.filters select,.filters button,button{padding:8px;border-radius:5px}.filters button,button{border:0;background:#2563eb;color:white}.resolve{background:#16a34a}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px;font-weight:bold}.critical{background:#fee2e2;color:#991b1b}.warning{background:#fef3c7;color:#92400e}.open{color:#dc2626}.acknowledged{color:#d97706}.resolved{color:#15803d}.empty{text-align:center;padding:25px}@media(max-width:750px){.summary{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Patrol Exception Alerts</h2><p>Supervisors should acknowledge active exceptions and document how each one was resolved.</p><div class="summary"><div class="metric">Open<b id="openCount">0</b></div><div class="metric">Acknowledged<b id="ackCount">0</b></div><div class="metric">Critical<b id="criticalCount">0</b></div></div><div class="card"><div class="filters"><select id="status"><option value="all">All statuses</option><option value="open" selected>Open</option><option value="acknowledged">Acknowledged</option><option value="resolved">Resolved</option></select> <select id="severity"><option value="">All severities</option><option value="critical">Critical</option><option value="warning">Warning</option></select> <button id="refresh">Refresh</button></div><div id="message"></div><table><thead><tr><th>Alert</th><th>Guard / Site</th><th>Scheduled</th><th>Progress</th><th>Status</th><th>Action</th></tr></thead><tbody id="alertBody"></tbody></table></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),$=x=>document.getElementById(x);if(!token||!tenant)location.replace('login.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){const r=await fetch(API+u,{...o,headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){let q='?tenant_id='+tenant+'&status='+$('status').value;if($('severity').value)q+='&severity='+$('severity').value;try{const [rows,all]=await Promise.all([api('/api/patrol-alerts'+q),api('/api/patrol-alerts?tenant_id='+tenant+'&status=all')]);$('openCount').textContent=all.filter(x=>x.status==='open').length;$('ackCount').textContent=all.filter(x=>x.status==='acknowledged').length;$('criticalCount').textContent=all.filter(x=>x.severity==='critical'&&x.status!=='resolved').length;$('alertBody').innerHTML=rows.length?rows.map(x=>'<tr><td><span class="badge '+esc(x.severity)+'">'+esc(x.severity)+'</span><br><b>'+esc(x.alert_type.replace('_',' '))+'</b><br><small>'+esc(x.message)+'</small></td><td>'+esc(x.guard_email)+'<br>'+esc(x.route_name)+' · '+esc(x.site_name)+'</td><td>'+esc(new Date(x.scheduled_start).toLocaleString())+'<br>to '+esc(new Date(x.scheduled_end).toLocaleString())+'</td><td>'+x.scanned_count+'/'+x.checkpoint_count+'</td><td class="'+esc(x.status)+'">'+esc(x.status)+'</td><td>'+(x.status==='open'?'<button onclick="ack('+x.id+')">Acknowledge</button> ':'')+(x.status!=='resolved'?'<button class="resolve" onclick="resolveAlert('+x.id+')">Resolve</button>':esc(x.resolution_notes||'Resolved'))+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">No matching patrol alerts.</td></tr>';$('message').textContent=rows.length+' alert(s) shown'}catch(e){$('message').textContent=e.message}}
async function ack(id){try{await api('/api/patrol-alerts/'+id+'/acknowledge',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant)})});load()}catch(e){alert(e.message)}}async function resolveAlert(id){const notes=prompt('How was this exception resolved?');if(!notes||!notes.trim())return;try{await api('/api/patrol-alerts/'+id+'/resolve',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),resolution_notes:notes.trim()})});load()}catch(e){alert(e.message)}}$('refresh').onclick=load;$('status').onchange=load;$('severity').onchange=load;load();setInterval(load,60000);
</script></body></html>
