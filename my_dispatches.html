<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dispatches</title><style>body{font-family:Arial;max-width:750px;margin:20px auto;padding:0 14px;background:#f8fafc}.job{background:#fff;border:1px solid #dbe2ea;border-left:6px solid #94a3b8;border-radius:8px;padding:15px;margin:12px 0}.job.high{border-left-color:#f59e0b}.job.critical{border-left-color:#dc2626;background:#fff1f2}.badge{padding:3px 8px;border-radius:12px;background:#e2e8f0;font-size:12px}.next{width:100%;padding:12px;background:#16a34a;color:#fff;border:0;border-radius:6px}.meta{font-size:12px;color:#64748b}.error{color:#dc2626}</style>  <link rel="stylesheet" href="patrolsync-guard.css">
  <script src="patrolsync-guard-ui.js" defer></script>
</head><body class="ps-guard-page"><p><a href="guard.html">← Guard Dashboard</a></p><h2>My Dispatches</h2><button id="refresh">Refresh</button><p id="error" class="error"></p><div id="list"></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),next={assigned:['accepted','Accept Dispatch'],accepted:['en_route','Start Journey'],en_route:['on_site','Arrived On Site'],on_site:['completed','Complete Dispatch']};if(!token||!tenant)location.replace('guard.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function advance(id,status){let note='';if(status==='completed')note=prompt('Completion note (optional):')||'';try{await api('/api/dispatch-jobs/'+id+'/status',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),status,completion_note:note})});load()}catch(e){alert(e.message)}}async function load(){try{const rows=await api('/api/dispatch-jobs?tenant_id='+tenant+'&status=active');$('list').innerHTML=rows.length?rows.map(x=>{const n=next[x.status];return `<div class="job ${esc(x.priority)}"><b>${esc(x.reference_code)} — ${esc(x.title)}</b> <span class="badge">${esc(x.priority)}</span><p>${esc(x.description||'No additional instructions')}</p><p><b>Location:</b> ${esc(x.site_name||x.address||'Unspecified')}</p>${x.latitude&&x.longitude?`<p><a target="_blank" href="https://www.google.com/maps?q=${x.latitude},${x.longitude}">Open navigation →</a></p>`:''}<div class="meta">Status: ${esc(x.status)} · Assigned ${new Date(x.assigned_at).toLocaleString()}</div>${n?`<p><button class="next" onclick="advance(${x.id},'${n[0]}')">${n[1]}</button></p>`:''}</div>`}).join(''):'<p>No active dispatches.</p>';$('error').textContent=''}catch(e){$('error').textContent=e.message}}$('refresh').onclick=load;load();setInterval(load,15000);
</script></body></html>
