<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shift Handover</title><style>body{font-family:Arial;max-width:700px;margin:20px auto;padding:0 14px;background:#f8fafc}.card{background:white;border:1px solid #dbe2ea;border-radius:9px;padding:15px;margin:12px 0}select,textarea,button{padding:10px;width:100%;box-sizing:border-box;margin:5px 0}button{border:0;border-radius:5px;background:#2563eb;color:white;font-weight:bold}.ack{background:#16a34a}.entry{border-left:4px solid #2563eb}.attention,.fault{border-left-color:#dc2626}.badge{padding:3px 8px;border-radius:10px;background:#dbeafe}.error{color:#dc2626}.success{color:#15803d}</style></head><body><p><a href="guard.html">← Guard Portal</a></p><h2>Shift Handover Log</h2><div class="card"><h3>Create Handover</h3><select id="site"><option value="">Select assigned site</option></select><textarea id="summary" rows="4" placeholder="Summarize the shift, patrol activity, visitors, and important events"></textarea><textarea id="actions" rows="3" placeholder="Outstanding actions or risks for the next guard"></textarea><select id="equipment"><option value="ok">Equipment OK</option><option value="attention">Equipment needs attention</option><option value="fault">Equipment fault</option></select><button id="submit">Submit Handover</button><div id="message"></div></div><h3>Recent Site Handovers</h3><div id="entries">Loading…</div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id'),user=localStorage.getItem('guard_user_id'),H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),$=x=>document.getElementById(x);if(!token||!tenant||!user)location.replace('guard.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){const r=await fetch(API+u,{...o,headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){const rows=await api('/api/guard-assignments?tenant_id='+tenant+'&user_id='+user);$('site').innerHTML='<option value="">Select assigned site</option>'+rows.map(x=>'<option value="'+x.site_id+'">'+esc(x.site_name)+'</option>').join('');load()}
async function create(){try{await api('/api/handovers',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),site_id:Number($('site').value),summary:$('summary').value,outstanding_actions:$('actions').value,equipment_status:$('equipment').value})});$('message').textContent='Handover submitted.';$('message').className='success';$('summary').value='';$('actions').value='';load()}catch(e){$('message').textContent=e.message;$('message').className='error'}}async function load(){try{const rows=await api('/api/handovers?tenant_id='+tenant);$('entries').innerHTML=rows.length?rows.map(x=>'<div class="card entry '+esc(x.equipment_status)+'"><b>'+esc(x.site_name)+'</b> <span class="badge">'+esc(x.status)+'</span><br><small>'+esc(new Date(x.created_at).toLocaleString())+' · '+esc(x.from_email)+'</small><p>'+esc(x.summary)+'</p>'+(x.outstanding_actions?'<p><b>Outstanding:</b> '+esc(x.outstanding_actions)+'</p>':'')+'<p>Equipment: '+esc(x.equipment_status)+'</p>'+(x.status==='pending'&&Number(x.from_user_id)!==Number(user)?'<button class="ack" onclick="ack('+x.id+')">Acknowledge Handover</button>':'')+'</div>').join(''):'<p>No handovers found.</p>'}catch(e){$('entries').textContent=e.message}}async function ack(id){try{await api('/api/handovers/'+id+'/acknowledge',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant)})});load()}catch(e){alert(e.message)}}$('submit').onclick=create;$('site').onchange=load;init().catch(e=>$('message').textContent=e.message);
</script></body></html>
