<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident Case Management</title><style>body{font-family:Arial;max-width:1250px;margin:24px auto;padding:0 15px;background:#f8fafc}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:15px;margin:12px 0}.filters{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px}input,select,textarea,button{padding:9px;box-sizing:border-box}button{border:0;border-radius:5px;background:#2563eb;color:white}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px;background:#dbeafe}.critical,.high{color:#b91c1c;font-weight:bold}.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timeline{border-left:3px solid #93c5fd;padding-left:15px}.activity{margin:10px 0}.hidden{display:none}@media(max-width:850px){.filters,.case-grid{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Incident Case Management</h2><div class="card"><div class="filters"><select id="site"><option value="">All sites</option></select><select id="category"><option value="">All categories</option><option>security</option><option>safety</option><option>medical</option><option>fire</option><option>property</option><option>access</option><option>conduct</option><option>general</option></select><select id="status"><option value="">All statuses</option><option>reported</option><option>acknowledged</option><option>investigating</option><option>resolved</option><option>closed</option></select><input id="date" type="date"><button id="refresh">Refresh</button></div><div id="summary"></div><table><thead><tr><th>Reference</th><th>Reported</th><th>Site</th><th>Category</th><th>Severity</th><th>Status</th><th>Owner</th><th></th></tr></thead><tbody id="body"></tbody></table></div><div id="casePanel" class="card hidden"><h3 id="caseTitle"></h3><p id="caseDescription"></p><div class="case-grid"><div><label>Status</label><select id="caseStatus"><option>reported</option><option>acknowledged</option><option>investigating</option><option>resolved</option><option>closed</option></select><label>Assigned supervisor</label><select id="assignee"><option value="">Unassigned</option></select><label>Resolution details</label><textarea id="resolution" rows="4" style="width:100%"></textarea><button id="saveCase">Save Case</button><h4>Add investigation comment</h4><textarea id="comment" rows="3" style="width:100%"></textarea><button id="addComment">Add Comment</button><div id="caseMessage"></div></div><div><h4>Activity Timeline</h4><div id="timeline" class="timeline"></div></div></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),$=x=>document.getElementById(x);if(!token||!tenant)location.replace('login.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cases=[],admins=[],activeCase=null;async function api(u,o={}){const r=await fetch(API+u,{...o,headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){const [sites,users]=await Promise.all([api('/api/sites?tenant_id='+tenant),api('/api/users?tenant_id='+tenant+'&role=admin')]);admins=users;$('site').innerHTML='<option value="">All sites</option>'+sites.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('assignee').innerHTML='<option value="">Unassigned</option>'+admins.map(x=>'<option value="'+x.id+'">'+esc(x.email)+'</option>').join('');load()}
async function load(){let q='?tenant_id='+tenant;if($('site').value)q+='&site_id='+$('site').value;if($('category').value)q+='&category='+$('category').value;if($('status').value)q+='&status='+$('status').value;if($('date').value)q+='&date='+$('date').value;try{cases=await api('/api/incidents'+q);$('summary').textContent=cases.length+' case(s) · '+cases.filter(x=>!['resolved','closed'].includes(x.status)).length+' active';$('body').innerHTML=cases.length?cases.map(x=>'<tr><td><b>'+esc(x.reference_code||('#'+x.id))+'</b></td><td>'+esc(new Date(x.reported_at).toLocaleString())+'<br><small>'+esc(x.reporter_email||'')+'</small></td><td>'+esc(x.site_name)+'</td><td>'+esc(x.category)+'</td><td class="'+esc(x.severity)+'">'+esc(x.severity)+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td>'+esc(x.assigned_email||'Unassigned')+'</td><td><button onclick="openCase('+x.id+')">Manage</button></td></tr>').join(''):'<tr><td colspan="8">No incidents found.</td></tr>'}catch(e){$('summary').textContent=e.message}}
async function openCase(id){activeCase=cases.find(x=>x.id===id);$('caseTitle').textContent=(activeCase.reference_code||'#'+id)+' — '+activeCase.category;$('caseDescription').textContent=activeCase.description;$('caseStatus').value=activeCase.status;$('assignee').value=activeCase.assigned_to||'';$('resolution').value=activeCase.resolution||'';$('casePanel').classList.remove('hidden');await loadTimeline();$('casePanel').scrollIntoView({behavior:'smooth'})}async function loadTimeline(){const rows=await api('/api/incidents/'+activeCase.id+'/activities?tenant_id='+tenant);$('timeline').innerHTML=rows.length?rows.map(x=>'<div class="activity"><b>'+esc(x.activity_type.replace('_',' '))+'</b> · '+esc(new Date(x.created_at).toLocaleString())+'<br><small>'+esc(x.user_email||'System')+'</small><br>'+esc(x.note||'')+'</div>').join(''):'No activity yet.'}
async function saveCase(){try{await api('/api/incidents/'+activeCase.id+'/case',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),status:$('caseStatus').value,assigned_to:$('assignee').value?Number($('assignee').value):null,resolution:$('resolution').value})});$('caseMessage').textContent='Case updated.';await load();activeCase=cases.find(x=>x.id===activeCase.id);await loadTimeline()}catch(e){$('caseMessage').textContent=e.message}}async function addComment(){const note=$('comment').value.trim();if(!note)return;try{await api('/api/incidents/'+activeCase.id+'/comments',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),note})});$('comment').value='';await loadTimeline()}catch(e){$('caseMessage').textContent=e.message}}$('refresh').onclick=load;[$('site'),$('category'),$('status'),$('date')].forEach(x=>x.onchange=load);$('saveCase').onclick=saveCase;$('addComment').onclick=addComment;init().catch(e=>$('summary').textContent=e.message);
</script></body></html>
