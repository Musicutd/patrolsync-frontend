<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatrolSync System Health</title><style>body{font-family:Arial,sans-serif;max-width:1150px;margin:20px auto;padding:0 16px;background:#f8fafc;color:#0f172a}.card{background:#fff;border:1px solid #dbe3ee;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#eff6ff;border-radius:8px;padding:14px}.metric b{display:block;font-size:25px;margin-top:7px}.ok{color:#15803d}.warn{color:#b45309}.bad{color:#dc2626}button{background:#2563eb;color:white;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}.row{padding:10px 0;border-bottom:1px solid #e2e8f0}.muted{color:#64748b;font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>System Health & Diagnostics</h2><p>Live operational status for your PatrolSync backend, database, audit history, and webhook queue.</p><button onclick="loadHealth()">Refresh</button><span id="status" class="muted"></span><div id="summary" class="grid"></div><div class="card"><h3>Runtime</h3><div id="runtime"></div></div><div class="card"><h3>Webhook Queue</h3><div id="webhooks"></div></div><div class="card"><h3>Recent System Events</h3><div id="events"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');function duration(s){s=Number(s)||0;const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return `${d}d ${h}h ${m}m`}
async function loadHealth(){const status=document.getElementById('status');status.textContent=' Loading…';try{const r=await fetch(API+'/api/system-health?tenant_id='+encodeURIComponent(tenant),{headers:{Authorization:'Bearer '+token}}),d=await r.json().catch(()=>({error:'Unexpected server response'}));if(r.status===401||r.status===403){if(r.status===401)localStorage.clear();throw Error(d.error||'Company administrator access required')}if(!r.ok)throw Error(d.error||'Health check failed');document.getElementById('summary').innerHTML=`<div class="metric"><span>Overall</span><b class="ok">${esc(d.status)}</b></div><div class="metric"><span>Database latency</span><b class="${d.database.latency_ms>500?'warn':'ok'}">${d.database.latency_ms} ms</b></div><div class="metric"><span>Active users</span><b>${d.active_users}</b></div><div class="metric"><span>Audit entries</span><b>${d.audit.total}</b></div>`;document.getElementById('runtime').innerHTML=`<p><b>Uptime:</b> ${duration(d.uptime_seconds)}</p><p><b>Started:</b> ${new Date(d.started_at).toLocaleString()}</p><p><b>Memory:</b> ${d.memory.heap_used_mb} MB heap / ${d.memory.rss_mb} MB process</p><p><b>Database pool:</b> ${d.database.pool_idle} idle, ${d.database.pool_total} total, ${d.database.pool_waiting} waiting</p><p><b>Retention:</b> audit ${d.retention.audit_days} days; webhook history ${d.retention.webhook_days} days</p>`;const failed=Number(d.webhooks.failed)||0;document.getElementById('webhooks').innerHTML=`<p><b>Queued:</b> ${d.webhooks.queued||0} &nbsp; <b class="${failed?'bad':''}">Failed: ${failed}</b> &nbsp; <b>Delivered:</b> ${d.webhooks.delivered||0}</p><p class="muted">Last delivered: ${d.webhooks.last_delivered_at?new Date(d.webhooks.last_delivered_at).toLocaleString():'None yet'}</p>`;document.getElementById('events').innerHTML=d.events.length?d.events.map(x=>`<div class="row"><b class="${x.severity==='error'?'bad':x.severity==='warning'?'warn':''}">${esc(x.severity.toUpperCase())}</b> · ${esc(x.event_type)}<br>${esc(x.message)}<div class="muted">${new Date(x.created_at).toLocaleString()}${x.request_id?' · Request '+esc(x.request_id):''}</div></div>`).join(''):'<p>No recent system events. This is normal.</p>';status.textContent=' Updated '+new Date().toLocaleTimeString()}catch(e){status.textContent=' '+e.message;document.getElementById('summary').innerHTML=`<div class="card bad">${esc(e.message)}</div>`}}loadHealth();setInterval(loadHealth,60000);
</script></body></html>
