<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Dashboard</title><style>body{font-family:Arial;max-width:850px;margin:30px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:18px}.links{display:grid;grid-template-columns:1fr 1fr;gap:9px}.links a{padding:13px;background:#2563eb;color:#fff;text-decoration:none;border-radius:6px;text-align:center}.error{color:red}@media(max-width:650px){.links{grid-template-columns:1fr}}</style></head><body><h2>PatrolSync Staff Dashboard</h2><p id="who"></p><div class="card"><h3>Authorized Modules</h3><div id="links" class="links"></div><p id="error" class="error"></p></div><p><button onclick="localStorage.clear();location.href='login.html'">Log Out</button></p><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),modules={scheduling:['Shift Scheduling','shift_scheduler.html'],attendance:['Attendance & Timesheets','attendance.html'],patrols:['Patrol Operations','patrol_runs.html'],incidents:['Incident Management','incident_management.html'],dispatch:['Dispatch Center','dispatch_center.html'],safety:['Lone-Worker Safety','lone_worker.html'],communications:['Team Messages','team_messages.html'],training:['Training Compliance','training_compliance.html'],assets:['Equipment & Assets','asset_management.html'],quality:['Quality Inspections','quality_inspections.html'],clients:['Client Contracts','service_contracts.html'],finance:['Billing & Invoices','invoices.html'],analytics:['Operational Analytics','analytics.html']};if(!token||!tenant)location.replace('login.html');fetch(API+'/api/staff-session',{headers:{Authorization:'Bearer '+token}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);$('who').textContent=(d.job_title||'Staff')+' — '+d.email;$('links').innerHTML=(d.permissions||[]).filter(k=>modules[k]).map(k=>`<a href="${modules[k][1]}">${modules[k][0]}</a>`).join('')||'<p>No modules assigned.</p>'}).catch(e=>{$('error').textContent=e.message});const $=x=>document.getElementById(x);
</script></body></html>
