<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vision Overview · PatrolSync</title>
<link rel="stylesheet" href="patrolsync-module.css"><script src="patrolsync-module.js" defer></script>
<style>.vision-card{max-width:900px;margin:24px auto;padding:24px;border:1px solid #334155;border-radius:12px;background:#15202d}.vision-card h1{margin-top:0}.vision-muted{opacity:.75}.vision-status{padding:14px;border-radius:8px;background:#253345}</style>
</head><body class="ps-module-shell"><div class="vision-card"><p><a href="dashboard.html">← Operations workspace</a></p><h1>PatrolSync Vision</h1><p class="vision-muted">CCTV intelligence foundation · no camera connection or video processing is active.</p><div id="visionStatus" class="vision-status" role="status">Checking Vision access…</div></div>
<script>
(async function(){
  const box=document.getElementById('visionStatus');
  const token=localStorage.getItem('token');
  if(!token){location.replace('login.html');return;}
  try{
    const response=await fetch('https://patrolsync-backend.onrender.com/api/vision/status',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!response.ok){box.textContent='Vision is not available for this account.';return;}
    const status=await response.json();
    box.textContent=status.enabled?'Vision access is enabled. Camera onboarding and analytics are not available in this foundation stage.':'Vision is not enabled for this company.';
  }catch(_){box.textContent='Vision status cannot be checked right now.';}
})();
</script></body></html>
