<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shift Operations</title><style>body{font-family:Arial;max-width:1050px;margin:25px auto;padding:0 15px;background:#f8fafc}.card{background:white;border:1px solid #ddd;border-radius:9px;padding:16px;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}button{padding:8px;background:#2563eb;color:white;border:0;border-radius:5px}.approve{background:#16a34a}.reject{background:#dc2626}.badge{padding:3px 8px;border-radius:10px;background:#dbeafe}@media(max-width:700px){table{display:block;overflow:auto}}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Confirmations & Shift Swaps</h2><div class="card"><h3>Unconfirmed or Declined Shifts</h3><table><thead><tr><th>Guard</th><th>Site</th><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody id="confirmations"></tbody></table></div><div class="card"><h3>Swap Requests</h3><table><thead><tr><th>From</th><th>To</th><th>Shift</th><th>Status</th><th>Action</th></tr></thead><tbody id="swapBody"></tbody></table></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id');if(!token||!tenant)location.replace('login.html');const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),date=x=>String(x).slice(0,10);async function load(){const [s,w]=await Promise.all([fetch(API+'/api/shifts?tenant_id='+tenant,{headers:H()}),fetch(API+'/api/shift-swaps?tenant_id='+tenant,{headers:H()})]),shifts=await s.json(),swaps=await w.json();const flagged=shifts.filter(x=>x.confirmation_status!=='confirmed'&&x.assignment_status==='assigned');confirmations.innerHTML=flagged.length?flagged.map(x=>'<tr><td>'+x.guard_email+'</td><td>'+x.site_name+'</td><td>'+date(x.shift_date)+'</td><td>'+x.start_time+'–'+x.end_time+'</td><td><span class="badge">'+x.confirmation_status+'</span></td></tr>').join(''):'<tr><td colspan="5">All assigned shifts confirmed.</td></tr>';swapBody.innerHTML=swaps.length?swaps.map(x=>'<tr><td>'+x.requester_email+'</td><td>'+x.target_email+'</td><td>'+date(x.shift_date)+' · '+x.site_name+'</td><td>'+x.status+'</td><td>'+(x.status==='pending_admin'?'<button class="approve" onclick="review('+x.id+',true)">Approve</button> <button class="reject" onclick="review('+x.id+',false)">Reject</button>':'—')+'</td></tr>').join(''):'<tr><td colspan="5">No swap requests.</td></tr>'}
async function review(id,approved){const note=prompt(approved?'Approval note (optional):':'Rejection reason:')||'';if(!approved&&!note)return;const r=await fetch(API+'/api/shift-swaps/'+id+'/review',{method:'PATCH',headers:H(),body:JSON.stringify({tenant_id:Number(tenant),approved,admin_notes:note})}),d=await r.json();if(!r.ok)alert(d.error);load()}load();
</script></body></html>
