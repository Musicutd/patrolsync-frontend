<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workforce Readiness | PatrolSync</title><link rel="stylesheet" href="patrolsync-module.css"><script>document.documentElement.dataset.theme=localStorage.getItem('patrolsync_theme')||'dark';</script><script src="patrolsync-module.js" defer></script>
<style>.wr{max-width:1180px;margin:auto;padding:30px}.wr-top,.wr-hero,.wr-result{display:flex;align-items:center;justify-content:space-between;gap:15px}.wr-back{color:#2dd4bf;text-decoration:none;font-weight:850}.wr button{border:0;border-radius:9px;padding:11px 15px;font-weight:850;cursor:pointer}.wr-theme{background:var(--ps-panel,#111a24);color:var(--ps-text,#e8eef5);border:1px solid var(--ps-line,#2a3948)!important}.wr-run{background:#26c9b8;color:#062e29}.wr-hero{margin:26px 0 12px}.wr-hero h1{font-size:32px;letter-spacing:-.04em;margin:0 0 5px}.wr-hero p,.wr-status,.wr-check p,.wr-result small{color:var(--ps-muted,#91a2b3)}.wr-status{min-height:24px}.wr-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.wr-card,.wr-panel{background:var(--ps-panel,#111a24);border:1px solid var(--ps-line,#2a3948);border-radius:14px}.wr-card{padding:18px}.wr-card span{display:block;color:var(--ps-muted,#91a2b3);font-size:13px}.wr-card strong{display:block;font-size:29px;margin-top:5px}.wr-panel{padding:20px}.wr-gate{font-size:21px;font-weight:900}.stage_3_ready,.pass{color:#21c58b}.ready_with_warnings,.warning{color:#f3aa36}.action_required,.fail{color:#ff6369}.wr-checks{display:grid;gap:10px;margin-top:18px}.wr-check{display:grid;grid-template-columns:75px 1fr;gap:12px;padding:14px;background:var(--ps-soft,#16222e);border:1px solid var(--ps-line,#2a3948);border-radius:10px}.wr-badge{text-transform:uppercase;font-size:11px;font-weight:900}.wr-check b{display:block;margin-bottom:4px}.wr-check p{margin:0;font-size:13px}.wr-empty{text-align:center;padding:34px;color:var(--ps-muted,#91a2b3)}@media(max-width:720px){.wr{padding:16px}.wr-hero,.wr-result{align-items:flex-start;flex-direction:column}.wr-run{width:100%}.wr-metrics{grid-template-columns:repeat(2,1fr)}.wr-check{grid-template-columns:1fr}}</style></head>
<body class="ps-module-shell"><main class="wr"><div class="wr-top"><a class="wr-back" href="dashboard.html">← Operations workspace</a><button id="themeButton" class="wr-theme" onclick="toggleTheme()">☀ Light</button></div><section class="wr-hero"><div><h1>Workforce, Visitor & Custody Readiness</h1><p>Final validation for visitor safety, compliance, issued equipment, and shift continuity.</p></div><button class="wr-run" onclick="runGate()">Run Stage 3 gate</button></section><div id="status" class="wr-status"></div>
<section class="wr-metrics"><article class="wr-card"><span>Passed</span><strong id="passed">—</strong></article><article class="wr-card"><span>Warnings</span><strong id="warnings">—</strong></article><article class="wr-card"><span>Failures</span><strong id="failures">—</strong></article><article class="wr-card"><span>Total checks</span><strong id="total">—</strong></article></section><section class="wr-panel"><div class="wr-result"><div><div id="gate" class="wr-gate">Not run</div><small id="generated">Run the validation after deploying the Stage 3 backend.</small></div><span id="duration"></span></div><div id="checks" class="wr-checks"><div class="wr-empty">No result yet.</div></div></section></main>
<script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');function themeLabel(){$('themeButton').textContent=document.documentElement.dataset.theme==='dark'?'☀ Light':'☾ Dark'}function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('patrolsync_theme',next);themeLabel()}
async function runGate(){$('status').textContent='Running Stage 3 validation…';try{const r=await fetch(API+'/api/workforce-readiness?tenant_id='+tenant,{headers:{Authorization:'Bearer '+token}}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:await r.text()};if(!r.ok)throw Error(d.error||'Readiness check failed');render(d);$('status').textContent='Stage 3 checks completed.'}catch(e){$('status').textContent=e.message;$('status').className='wr-status fail'}}function render(d){$('passed').textContent=d.summary.passed;$('warnings').textContent=d.summary.warnings;$('failures').textContent=d.summary.failures;$('total').textContent=d.summary.total;const labels={stage_3_ready:'STAGE 3 READY',ready_with_warnings:'READY WITH WARNINGS',action_required:'ACTION REQUIRED'};$('gate').textContent=labels[d.status]||d.status;$('gate').className='wr-gate '+d.status;$('generated').textContent='Completed '+new Date(d.generated_at).toLocaleString();$('duration').textContent=d.duration_ms+' ms';$('checks').innerHTML=d.checks.map(c=>`<div class="wr-check"><span class="wr-badge ${c.status}">${c.status}</span><div><b>${esc(c.label)}</b><p>${esc(c.message)}</p></div></div>`).join('')}themeLabel();</script></body></html>
