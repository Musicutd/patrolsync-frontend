<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quality Inspections</title><style>body{font-family:Arial;max-width:1200px;margin:20px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea,button{width:100%;padding:9px;box-sizing:border-box;margin:3px 0}button{background:#2563eb;color:#fff;border:0;border-radius:5px}.question,.row{padding:11px;border-bottom:1px solid #ddd}.question{background:#f8fafc;margin:7px 0;border:1px solid #ddd;border-radius:6px}.badge{padding:3px 8px;border-radius:10px;background:#e2e8f0}.bad{color:#dc2626;font-weight:bold}.good{color:#15803d}.error{color:#dc2626}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Quality Inspections & Corrective Actions</h2><div class="card"><h3>Create Inspection Template</h3><div class="grid"><label>Title<input id="title"></label><label>Site restriction<select id="templateSite"><option value="">Any site</option></select></label><label>Passing score<input id="pass" type="number" value="80" min="0" max="100"></label></div><textarea id="description" placeholder="Inspection purpose and instructions"></textarea><h4>Checklist Questions</h4><div id="questions"></div><button id="addQuestion" style="background:#64748b">+ Add Question</button><button id="createTemplate">Create Template</button><p id="status"></p></div><div class="card"><h3>Schedule Inspection</h3><div class="grid"><select id="template"><option value="">Select template</option></select><select id="runSite"><option value="">Select site</option></select><select id="guard"><option value="">Select guard</option></select><input id="scheduled" type="datetime-local"></div><button id="schedule">Assign Inspection</button></div><div class="card"><h3>Inspection Results</h3><button onclick="load()">Refresh</button><div id="runs"></div></div><div class="card"><h3>Corrective Actions</h3><div id="actions"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sites=[],guards=[],templates=[];if(!token||!tenant)location.replace('login.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}function show(m,c='error'){$('status').textContent=m;$('status').className=c}function addQuestion(){const d=document.createElement('div');d.className='question';d.innerHTML=`<label>Question<input class="qtext" placeholder="e.g. Are all emergency exits clear?"></label><label>Guidance (optional)<input class="qguide" placeholder="What the inspector should verify"></label><label><input class="qcritical" type="checkbox" style="width:auto"> Critical failure</label><button style="background:#dc2626" onclick="this.parentElement.remove()">Remove</button>`;$('questions').appendChild(d)}function getQuestions(){const q=[...document.querySelectorAll('.question')].map(d=>({text:d.querySelector('.qtext').value.trim(),guidance:d.querySelector('.qguide').value.trim(),critical:d.querySelector('.qcritical').checked}));if(!q.length||q.some(x=>!x.text))throw Error('Add at least one complete question.');return q}async function setup(){const[u,s]=await Promise.all([api('/api/users?tenant_id='+tenant),api('/api/sites?tenant_id='+tenant)]);guards=(Array.isArray(u)?u:u.users||[]).filter(x=>x.role==='guard');sites=Array.isArray(s)?s:s.sites||[];const so='<option value="">Select site</option>'+sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('runSite').innerHTML=so;$('templateSite').innerHTML='<option value="">Any site</option>'+sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('guard').innerHTML='<option value="">Select guard</option>'+guards.map(x=>`<option value="${x.id}">${esc(x.email)}</option>`).join('')}async function createTemplate(){try{await api('/api/inspection-templates',{method:'POST',body:JSON.stringify({tenant_id:+tenant,title:$('title').value,description:$('description').value,site_id:$('templateSite').value?+$('templateSite').value:null,passing_score:+$('pass').value,questions:getQuestions()})});show('Template created.','good');$('questions').innerHTML='';load()}catch(e){show(e.message)}}async function schedule(){try{await api('/api/inspection-runs',{method:'POST',body:JSON.stringify({tenant_id:+tenant,template_id:+$('template').value,site_id:+$('runSite').value,assigned_user_id:+$('guard').value,scheduled_for:$('scheduled').value})});show('Inspection assigned and guard notified.','good');load()}catch(e){show(e.message)}}async function editAction(id){const owner=prompt('Assigned guard ID (blank for unassigned):')||'',due=prompt('Due date/time (YYYY-MM-DD HH:mm or blank):')||'',status=prompt('Status: open, in_progress, resolved, cancelled','in_progress');if(!status)return;const note=status==='resolved'?(prompt('Resolution evidence/note:')||''):'';try{await api('/api/corrective-actions/'+id,{method:'PATCH',body:JSON.stringify({tenant_id:+tenant,assigned_user_id:owner?+owner:null,due_at:due||null,status,resolution_note:note})});load()}catch(e){alert(e.message)}}async function load(){try{const[t,r,a]=await Promise.all([api('/api/inspection-templates?tenant_id='+tenant),api('/api/inspection-runs?tenant_id='+tenant),api('/api/corrective-actions?tenant_id='+tenant)]);templates=t;$('template').innerHTML='<option value="">Select template</option>'+t.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');$('runs').innerHTML=r.map(x=>`<div class="row"><b>${esc(x.template_title)}</b> — ${esc(x.site_name)} / ${esc(x.guard_email)} <span class="badge">${esc(x.status)}</span> ${x.score!=null?`<b class="${x.score>=x.passing_score?'good':'bad'}">${x.score}%</b>`:''}<br>Scheduled ${new Date(x.scheduled_for).toLocaleString()}</div>`).join('')||'<p>No inspections.</p>';$('actions').innerHTML=a.map(x=>`<div class="row"><b>${esc(x.title)}</b> <span class="badge">${esc(x.status)}</span><p>${esc(x.description||'No finding note')} · ${esc(x.site_name)} · owner ${esc(x.assigned_email||'unassigned')} · due ${x.due_at?new Date(x.due_at).toLocaleString():'none'}</p><button onclick="editAction(${x.id})">Update Action</button></div>`).join('')||'<p>No corrective actions.</p>'}catch(e){show(e.message)}}$('addQuestion').onclick=addQuestion;$('createTemplate').onclick=createTemplate;$('schedule').onclick=schedule;setup().then(load).catch(e=>show(e.message));
</script></body></html>
