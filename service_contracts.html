<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Contracts & SLAs</title><style>body{font-family:Arial;max-width:1250px;margin:24px auto;padding:0 15px;background:#f8fafc}.card{background:white;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:12px 0}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{font-size:12px;font-weight:bold;display:block}.field input,.field select,.field textarea{width:100%;padding:9px;box-sizing:border-box}.wide{grid-column:span 2}button{padding:9px;border:0;border-radius:5px;background:#2563eb;color:white}.secondary{background:#64748b}.suspend{background:#d97706}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px;background:#dbeafe}.active{color:#15803d}.suspended,.expired{color:#b91c1c}@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}table{display:block;overflow:auto}}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Client Contracts & SLA Definitions</h2><div class="card"><h3 id="formTitle">Create Service Contract</h3><input id="contractId" type="hidden"><div class="form"><div class="field"><label>Site</label><select id="site"><option value="">Select site</option></select></div><div class="field"><label>Client name</label><input id="clientName"></div><div class="field"><label>Contract reference</label><input id="reference" placeholder="Auto-generated if empty"></div><div class="field"><label>Status</label><select id="contractStatus"><option value="draft">Draft</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div><div class="field"><label>Start date</label><input id="start" type="date"></div><div class="field"><label>End date</label><input id="end" type="date"></div><div class="field"><label>Billing model</label><select id="billing"><option value="monthly">Monthly</option><option value="hourly">Hourly</option><option value="per_patrol">Per patrol</option><option value="fixed">Fixed contract</option></select></div><div class="field"><label>Rate</label><input id="rate" type="number" min="0" step="0.01"></div><div class="field"><label>Currency</label><input id="currency" maxlength="3" value="EUR"></div><div class="field"><label>Patrol completion SLA %</label><input id="patrolSla" type="number" min="0" max="100" step="0.1" value="95"></div><div class="field"><label>Incident acknowledgement SLA (minutes)</label><input id="incidentSla" type="number" min="1" value="15"></div><div class="field"><label>Shift coverage SLA %</label><input id="coverageSla" type="number" min="0" max="100" step="0.1" value="98"></div><div class="field"><label>Client report frequency</label><select id="frequency"><option value="weekly">Weekly</option><option value="monthly" selected>Monthly</option><option value="quarterly">Quarterly</option></select></div><div class="field wide"><label>Notes</label><textarea id="notes" rows="2"></textarea></div></div><button id="save" style="margin-top:10px">Save Contract</button> <button id="cancel" class="secondary" style="display:none">Cancel Edit</button><div id="message"></div></div><div class="card"><h3>Service Contracts</h3><select id="filterStatus"><option value="all">All statuses</option><option value="active">Active</option><option value="draft">Draft</option><option value="suspended">Suspended</option><option value="expired">Expired</option></select> <button id="refresh">Refresh</button><table><thead><tr><th>Reference / Client</th><th>Site</th><th>Period</th><th>Commercial</th><th>SLAs</th><th>Reporting</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),$=x=>document.getElementById(x);if(!token||!tenant)location.replace('login.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let contracts=[];async function api(u,o={}){const r=await fetch(API+u,{...o,headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){const sites=await api('/api/sites?tenant_id='+tenant);$('site').innerHTML='<option value="">Select site</option>'+sites.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('start').value=new Date().toISOString().slice(0,10);load()}
function payload(){return{tenant_id:Number(tenant),site_id:Number($('site').value),client_name:$('clientName').value,reference_code:$('reference').value,status:$('contractStatus').value,start_date:$('start').value,end_date:$('end').value||null,billing_model:$('billing').value,rate:$('rate').value?Number($('rate').value):null,currency:$('currency').value,sla_patrol_completion_pct:Number($('patrolSla').value),sla_incident_ack_minutes:Number($('incidentSla').value),sla_shift_coverage_pct:Number($('coverageSla').value),report_frequency:$('frequency').value,notes:$('notes').value}}
async function save(){const id=$('contractId').value;try{await api(id?'/api/service-contracts/'+id:'/api/service-contracts',{method:id?'PUT':'POST',body:JSON.stringify(payload())});$('message').textContent=id?'Contract updated.':'Contract created.';reset();load()}catch(e){$('message').textContent=e.message}}
async function load(){try{contracts=await api('/api/service-contracts?tenant_id='+tenant+'&status='+$('filterStatus').value);$('body').innerHTML=contracts.length?contracts.map(x=>'<tr><td><b>'+esc(x.reference_code)+'</b><br>'+esc(x.client_name)+'</td><td>'+esc(x.site_name)+'</td><td>'+esc(String(x.start_date).slice(0,10))+' – '+esc(x.end_date?String(x.end_date).slice(0,10):'Ongoing')+'</td><td>'+esc(x.billing_model)+'<br>'+(x.rate!==null?esc(x.currency)+' '+esc(x.rate):'Rate not set')+'</td><td>Patrol '+x.sla_patrol_completion_pct+'%<br>Incident '+x.sla_incident_ack_minutes+' min<br>Coverage '+x.sla_shift_coverage_pct+'%</td><td>'+esc(x.report_frequency)+'</td><td class="'+esc(x.status)+'"><span class="badge">'+esc(x.status)+'</span></td><td><button onclick="edit('+x.id+')">Edit</button> '+(x.status==='active'?'<button class="suspend" onclick="setStatus('+x.id+',\'suspended\')">Suspend</button>':'<button onclick="setStatus('+x.id+',\'active\')">Activate</button>')+'</td></tr>').join(''):'<tr><td colspan="8">No contracts found.</td></tr>'}catch(e){$('message').textContent=e.message}}
function edit(id){const x=contracts.find(c=>String(c.id)===String(id));$('contractId').value=x.id;$('site').value=x.site_id;$('clientName').value=x.client_name;$('reference').value=x.reference_code;$('contractStatus').value=x.status==='expired'?'draft':x.status;$('start').value=String(x.start_date).slice(0,10);$('end').value=x.end_date?String(x.end_date).slice(0,10):'';$('billing').value=x.billing_model;$('rate').value=x.rate??'';$('currency').value=x.currency;$('patrolSla').value=x.sla_patrol_completion_pct;$('incidentSla').value=x.sla_incident_ack_minutes;$('coverageSla').value=x.sla_shift_coverage_pct;$('frequency').value=x.report_frequency;$('notes').value=x.notes||'';$('formTitle').textContent='Edit Contract';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}function reset(){$('contractId').value='';$('clientName').value='';$('reference').value='';$('end').value='';$('rate').value='';$('notes').value='';$('formTitle').textContent='Create Service Contract';$('cancel').style.display='none'}async function setStatus(id,status){try{await api('/api/service-contracts/'+id+'/status',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),status})});load()}catch(e){alert(e.message)}}$('save').onclick=save;$('cancel').onclick=reset;$('refresh').onclick=load;$('filterStatus').onchange=load;init().catch(e=>$('message').textContent=e.message);
</script></body></html>
