<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lone-Worker Safety</title><style>body{font-family:Arial;max-width:1150px;margin:24px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,textarea,button{width:100%;padding:9px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;border-radius:5px}.row{display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1fr;gap:8px;padding:10px;border-bottom:1px solid #e2e8f0}.danger{color:#dc2626;font-weight:bold}.safe{color:#15803d}.error{color:#dc2626}@media(max-width:750px){.grid,.row{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Lone-Worker Safety</h2><div class="card"><h3>Configure Welfare Checks</h3><div class="grid"><select id="guard"><option value="">Select guard</option></select><select id="site"><option value="">Select site</option></select><label>Check every (minutes)<input id="interval" type="number" min="5" max="720" value="60"></label><label>Grace period (minutes)<input id="grace" type="number" min="0" max="120" value="10"></label></div><textarea id="instructions" rows="2" placeholder="Safety instructions or escalation procedure"></textarea><button id="save">Save / Enable</button><p id="status"></p></div><div class="card"><h3>Live Monitor</h3><button id="refresh" style="max-width:120px">Refresh</button><div id="list"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function options(){try{const [users,sites]=await Promise.all([api('/api/users?tenant_id='+tenant),api('/api/sites?tenant_id='+tenant)]),u=Array.isArray(users)?users:users.users||[],s=Array.isArray(sites)?sites:sites.sites||[];$('guard').innerHTML='<option value="">Select guard</option>'+u.filter(x=>x.role==='guard').map(x=>`<option value="${x.id}">${esc(x.email)}</option>`).join('');$('site').innerHTML='<option value="">Select site</option>'+s.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}catch(e){show(e.message)}}function show(m,c='error'){$('status').textContent=m;$('status').className=c}async function save(){try{await api('/api/lone-worker/settings',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),user_id:Number($('guard').value),site_id:Number($('site').value),interval_minutes:Number($('interval').value),grace_minutes:Number($('grace').value),instructions:$('instructions').value})});show('Safety check configured.','safe');load()}catch(e){show(e.message)}}async function toggle(id,enabled){try{await api('/api/lone-worker/settings/'+id+'/toggle',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),enabled})});load()}catch(e){alert(e.message)}}async function load(){try{const rows=await api('/api/lone-worker/settings?tenant_id='+tenant);$('list').innerHTML=rows.length?rows.map(x=>{const ref=x.safety_reference?new Date(x.safety_reference):null,due=ref?new Date(ref.getTime()+(Number(x.interval_minutes)+Number(x.grace_minutes))*60000):null,overdue=x.clocked_in_at&&due<Date.now();return `<div class="row"><span><b>${esc(x.guard_email)}</b><br>${esc(x.site_name)}</span><span>${x.clocked_in_at?(overdue?'<span class="danger">OVERDUE</span>':'<span class="safe">Active / safe</span>'):'Not clocked in'}<br>Last: ${x.last_check_in?new Date(x.last_check_in).toLocaleString():'No check-in'}</span><span>${x.interval_minutes} + ${x.grace_minutes} min</span><span>${x.alert_id?'<span class="danger">Alert open</span>':'No alert'}</span><button onclick="toggle(${x.id},${!x.enabled})">${x.enabled?'Disable':'Enable'}</button></div>`}).join(''):'<p>No lone-worker rules configured.</p>'}catch(e){show(e.message)}}$('save').onclick=save;$('refresh').onclick=load;options();load();setInterval(load,30000);
</script></body></html>
