<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Delivery Monitor</title><style>body{font-family:Arial;max-width:1250px;margin:24px auto;padding:0 15px;background:#f8fafc;color:#172033}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:12px 0}.setup{border-left:5px solid #f59e0b}.ready{border-color:#16a34a}input,select,button{padding:9px;box-sizing:border-box}button{border:0;border-radius:5px;background:#2563eb;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px;background:#e2e8f0}.sent{background:#dcfce7}.failed{background:#fee2e2}.error{color:#dc2626}@media(max-width:800px){table{display:block;overflow:auto}}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Email Delivery Monitor</h2><div id="setup" class="card setup"></div><div class="card"><h3>Send Test Email</h3><input id="testEmail" type="email" placeholder="Recipient email"><button id="test">Send Test</button><p id="message" class="error"></p></div><div class="card"><select id="status"><option value="all">All statuses</option><option>queued</option><option>sending</option><option>sent</option><option>failed</option></select> <button id="refresh">Refresh</button><table><thead><tr><th>Created</th><th>Event</th><th>Recipient</th><th>Subject</th><th>Status</th><th>Attempts</th><th>Error</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div>
<script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'}),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');async function api(path,o={}){const r=await fetch(API+path,{...o,headers:H()}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:`HTTP ${r.status}`};if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await api(`/api/email-deliveries?tenant_id=${tenant}&status=${$('status').value}`);$('setup').className='card setup '+(d.configured?'ready':'');$('setup').innerHTML=d.configured?`<b>Email configured</b><p>Provider: ${esc(d.provider)} · From: ${esc(d.from_address)}</p>`:`<b>Email configuration required</b><p>Add BREVO_API_KEY, EMAIL_FROM_ADDRESS, EMAIL_FROM_NAME, EMAIL_PROVIDER=brevo, and FRONTEND_URL to the backend Render environment.</p>`;$('body').innerHTML=d.deliveries.length?d.deliveries.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.event_type)}</td><td>${esc(x.recipient_email)}</td><td>${esc(x.subject)}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td>${x.attempt_count}/5</td><td>${esc(x.last_error||'—')}</td><td>${x.status==='failed'?`<button onclick="retry(${x.id})">Retry</button>`:''}</td></tr>`).join(''):'<tr><td colspan="8">No email deliveries.</td></tr>';$('message').textContent=''}catch(e){$('message').textContent=e.message}}async function retry(id){try{await api('/api/email-deliveries/'+id+'/retry',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant)})});setTimeout(load,1000)}catch(e){alert(e.message)}}async function test(){try{$('message').textContent='Sending…';const d=await api('/api/email-deliveries/test',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),recipient_email:$('testEmail').value})});$('message').textContent=d.status==='sent'?'Test email sent successfully.':d.last_error||'Test failed';load()}catch(e){$('message').textContent=e.message;load()}}$('test').onclick=test;$('refresh').onclick=load;$('status').onchange=load;load();</script></body></html>
