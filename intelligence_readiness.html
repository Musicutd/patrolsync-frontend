<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence Readiness</title><style>
:root{--bg:#f1f4f6;--card:#fff;--text:#161d24;--muted:#68737e;--line:#d9e0e5;--teal:#16b8a7;--soft:#f4f7f8;--red:#e5484d;--amber:#d78a10;--green:#15966f}html[data-theme=dark]{color-scheme:dark;--bg:#090e13;--card:#10171e;--text:#e7edf2;--muted:#91a0ad;--line:#293540;--soft:#151e26}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1100px;margin:auto;padding:28px}.top,.hero,.result-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.top{margin-bottom:25px}.back{color:var(--teal);font-weight:800;text-decoration:none}button{border:0;border-radius:8px;padding:10px 14px;background:var(--teal);color:#042c27;font-weight:850;cursor:pointer}.theme{background:var(--soft);color:var(--text);border:1px solid var(--line)}h1{font-size:31px;letter-spacing:-.04em;margin:0 0 5px}.hero p{margin:0;color:var(--muted)}.status{min-height:22px;margin:13px 0;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px}.metric{padding:17px}.metric small{display:block;color:var(--muted)}.metric strong{font-size:28px;display:block;margin-top:5px}.panel{padding:19px}.gate{font-size:20px;font-weight:900}.ready{color:var(--green)}.action_required{color:var(--red)}.ready_with_warnings{color:var(--amber)}.checks{display:grid;gap:9px;margin-top:18px}.check{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:14px;background:var(--soft);border:1px solid var(--line);border-radius:10px}.badge{font-size:11px;font-weight:900;text-transform:uppercase}.pass{color:var(--green)}.fail{color:var(--red)}.warning{color:var(--amber)}.check b{display:block;margin-bottom:4px}.check p{margin:0;color:var(--muted);font-size:13px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:700px){.shell{padding:15px}.hero,.result-head{align-items:flex-start;flex-direction:column}.hero button{width:100%}.summary{grid-template-columns:repeat(2,1fr)}.check{grid-template-columns:1fr}}
</style><script>const saved=localStorage.getItem('patrolsync_theme');document.documentElement.dataset.theme=saved||'dark';</script>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><main class="shell">
<div class="top"><a class="back" href="dashboard.html">← Operations workspace</a><button id="theme" class="theme" onclick="toggleTheme()">Change theme</button></div>
<section class="hero"><div><h1>Intelligence Readiness</h1><p>Final validation for TrustProof, Coverage Autopilot, and Operations Risk.</p></div><button onclick="runGate()">Run readiness checks</button></section><div id="status" class="status"></div>
<section class="summary"><div class="metric"><small>Passed</small><strong id="passed">—</strong></div><div class="metric"><small>Warnings</small><strong id="warnings">—</strong></div><div class="metric"><small>Failures</small><strong id="failures">—</strong></div><div class="metric"><small>Total checks</small><strong id="total">—</strong></div></section>
<section class="panel"><div class="result-head"><div><div id="gate" class="gate">Not run</div><small id="generated"></small></div><span id="duration"></span></div><div id="checks" class="checks"><div class="empty">Run the gate to validate Phase 8.</div></div></section>
</main><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id');if(!token||!tenant)location.replace('login.html');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toggleTheme(){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('patrolsync_theme',n);themeLabel()}function themeLabel(){$('theme').textContent=document.documentElement.dataset.theme==='dark'?'☀ Light':'☾ Dark'}
async function runGate(){$('status').textContent='Running Phase 8 validation…';try{const r=await fetch(API+'/api/intelligence-readiness?tenant_id='+tenant,{headers:{Authorization:'Bearer '+token}}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:await r.text()};if(!r.ok)throw Error(d.error||'Readiness check failed');render(d);$('status').textContent='Checks completed.'}catch(e){$('status').textContent=e.message;$('status').className='status fail'}}
function render(d){const s=d.summary;$('passed').textContent=s.passed;$('warnings').textContent=s.warnings;$('failures').textContent=s.failures;$('total').textContent=s.total;const labels={ready:'PHASE 8 READY',ready_with_warnings:'READY WITH WARNINGS',action_required:'ACTION REQUIRED'};$('gate').textContent=labels[d.status]||d.status;$('gate').className='gate '+d.status;$('generated').textContent='Completed '+new Date(d.generated_at).toLocaleString();$('duration').textContent=d.duration_ms+' ms';$('checks').innerHTML=d.checks.map(c=>`<div class="check"><span class="badge ${c.status}">${c.status}</span><div><b>${esc(c.label)}</b><p>${esc(c.message)}</p></div></div>`).join('')}
themeLabel();
</script></body></html>
