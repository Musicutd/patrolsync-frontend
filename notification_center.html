<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications & Escalations</title>
<style>body{font-family:Arial;max-width:1200px;margin:24px auto;padding:0 15px;background:#f8fafc;color:#172033}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea,button{width:100%;padding:10px;box-sizing:border-box;margin:5px 0}button{border:0;border-radius:5px;background:#2563eb;color:#fff;cursor:pointer}.danger{background:#dc2626}.note{border-left:5px solid #94a3b8;padding:12px;margin:9px 0;background:#f8fafc}.note.high{border-color:#f59e0b}.note.critical{border-color:#dc2626;background:#fff1f2}.meta{font-size:12px;color:#64748b}.badge{display:inline-block;padding:3px 8px;border-radius:12px;background:#e2e8f0;font-size:12px}.error{color:#dc2626}.success{color:#15803d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head>
<body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Notifications & Escalations</h2><p>Send operational notices now. Automated event rules will use this same inbox in the next Phase 4 step.</p>
<div class="card"><h3>Create Notification</h3><div class="grid"><label>Title<input id="title" maxlength="160" placeholder="e.g. Urgent post-order update"></label><label>Category<select id="category"><option>general</option><option>schedule</option><option>patrol</option><option>safety</option><option>incident</option><option>compliance</option></select></label><label>Priority<select id="priority"><option value="normal">Normal</option><option value="low">Low</option><option value="high">High</option><option value="critical">Critical</option></select></label><label>Audience<select id="audience"><option value="all_guards">All guards</option><option value="specific_guard">Specific guard</option><option value="admins">Admins</option><option value="all">Admins and guards</option></select></label><label id="guardWrap" style="display:none">Guard<select id="guard"><option value="">Select a guard</option></select></label><label>Expires (optional)<input id="expires" type="datetime-local"></label></div><label>Message<textarea id="message" rows="4" maxlength="4000" placeholder="Write clear instructions..."></textarea></label><label>Action link (optional)<input id="url" placeholder="e.g. my_shifts.html"></label><label><input id="ack" type="checkbox" style="width:auto"> Require acknowledgement</label><button id="send">Send Notification</button><p id="status"></p></div>
<div class="card"><h3>Notification History</h3><select id="filter" style="max-width:220px"><option value="active">Active</option><option value="unread">Unread by me</option><option value="ack_required">Awaiting my acknowledgement</option><option value="all">All active</option></select><button id="refresh" style="max-width:120px">Refresh</button><div id="summary"></div><div id="list"></div></div>
<script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');async function api(path,o={}){const r=await fetch(API+path,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:'HTTP '+r.status};if(!r.ok)throw Error(d.error||'Request failed');return d}async function guards(){try{const rows=await api('/api/users?tenant_id='+tenant),list=Array.isArray(rows)?rows:(rows.users||[]);$('guard').innerHTML='<option value="">Select a guard</option>'+list.filter(x=>x.role==='guard').map(x=>`<option value="${x.id}">${esc(x.email)}</option>`).join('')}catch(e){show(e.message,'error')}}function show(m,c=''){$('status').textContent=m;$('status').className=c}async function load(){try{const d=await api(`/api/communication-notifications?tenant_id=${tenant}&status=${$('filter').value}`);$('summary').innerHTML=`<p><b>${d.unread_count}</b> unread · <b>${d.acknowledgement_count}</b> awaiting your acknowledgement</p>`;$('list').innerHTML=d.notifications.length?d.notifications.map(n=>`<div class="note ${esc(n.priority)}"><b>${esc(n.title)}</b> <span class="badge">${esc(n.priority)}</span><p>${esc(n.message)}</p><div class="meta">${esc(n.category)} · ${esc(n.audience)}${n.recipient_email?' · '+esc(n.recipient_email):''} · ${new Date(n.created_at).toLocaleString()}</div>${n.action_url?`<p><a href="${esc(n.action_url)}">Open related page →</a></p>`:''}<button class="danger" style="max-width:90px" onclick="removeNote(${n.id})">Delete</button></div>`).join(''):'<p>No notifications.</p>';show('')}catch(e){show(e.message,'error')}}async function send(){try{show('Sending…');const audience=$('audience').value;await api('/api/communication-notifications',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),title:$('title').value,message:$('message').value,category:$('category').value,priority:$('priority').value,audience,recipient_user_id:audience==='specific_guard'?Number($('guard').value):null,action_url:$('url').value,requires_acknowledgement:$('ack').checked,expires_at:$('expires').value||null})});show('Notification sent.','success');$('title').value='';$('message').value='';load()}catch(e){show(e.message,'error')}}async function removeNote(id){if(!confirm('Delete this notification for everyone?'))return;try{await api(`/api/communication-notifications/${id}?tenant_id=${tenant}`,{method:'DELETE'});load()}catch(e){alert(e.message)}}$('audience').onchange=()=>{$('guardWrap').style.display=$('audience').value==='specific_guard'?'block':'none'};$('send').onclick=send;$('refresh').onclick=load;$('filter').onchange=load;guards();load();</script></body></html>
