<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><style>body{font-family:Arial;max-width:440px;margin:70px auto;padding:20px}input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;font-size:15px}button{background:#2563eb;color:white;border:0;border-radius:6px}.status{margin-top:12px}.error{color:red}.success{color:green}.hint{font-size:13px;color:#64748b}</style></head><body><p><a id="back" href="login.html">← Login</a></p><h2>Reset your password</h2><p>Enter the Company ID shown on the administrator dashboard, then select the correct account type.</p><input id="companyId" type="number" min="1" inputmode="numeric" placeholder="Company ID"><select id="accountType"><option value="admin">Administrator or office staff</option><option value="guard">Security guard</option></select><input id="email" type="email" placeholder="Email address"><button onclick="send()">Send Reset Link</button><div id="status" class="status"></div><p class="hint">The Company ID prevents an account with the same email in another company from being changed.</p><script>const API='https://patrolsync-backend.onrender.com',requestedRole=new URLSearchParams(location.search).get('role'),remembered=localStorage.getItem('guard_company_id');if(requestedRole==='guard'){document.getElementById('accountType').value='guard';document.getElementById('back').href='guard.html'}if(remembered)document.getElementById('companyId').value=remembered;async function send(){const s=document.getElementById('status'),companyId=Number(document.getElementById('companyId').value);if(!Number.isInteger(companyId)||companyId<1){s.textContent='Company ID is required.';s.className='status error';return}s.textContent='Sending…';s.className='status';try{const r=await fetch(API+'/api/auth/scoped-forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_id:companyId,email:document.getElementById('email').value.trim(),account_type:document.getElementById('accountType').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');localStorage.setItem('guard_company_id',String(companyId));s.textContent=d.message;s.className='status success'}catch(e){s.textContent=e.message;s.className='status error'}}</script></body></html>
