<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave Management</title><style>body{font-family:Arial;max-width:1050px;margin:25px auto;padding:0 15px;background:#f8fafc}a{color:#2563eb}.card{background:white;border:1px solid #ddd;border-radius:9px;padding:16px;margin:14px 0}select,button{padding:9px}button{border:0;border-radius:5px;color:white;background:#2563eb}.approve{background:#16a34a}.reject{background:#dc2626}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px}.pending{background:#dbeafe}.approved{background:#dcfce7}.rejected{background:#fee2e2}.error{color:red}@media(max-width:700px){table{display:block;overflow:auto}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Leave Management</h2><div class="card"><select id="statusFilter" onchange="loadRequests()"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div><div class="card"><div id="message"></div><table><thead><tr><th>Guard</th><th>Type</th><th>Dates</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id');if(!token||!tenant)location.replace('login.html');const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});async function loadRequests(){let url=API+'/api/leave-requests?tenant_id='+tenant;if(statusFilter.value)url+='&status='+statusFilter.value;try{const r=await fetch(url,{headers:H()}),rows=await r.json();if(!r.ok)throw Error(rows.error);body.innerHTML='';rows.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+x.guard_email+'</td><td>'+x.leave_type+'</td><td>'+String(x.start_date).slice(0,10)+' to '+String(x.end_date).slice(0,10)+'</td><td>'+(x.reason||'—')+'</td><td><span class="badge '+x.status+'">'+x.status+'</span></td><td>'+(x.status==='pending'?'<button class="approve">Approve</button> <button class="reject">Reject</button>':(x.review_notes||'—'))+'</td>';if(x.status==='pending'){const b=tr.querySelectorAll('button');b[0].onclick=()=>review(x.id,'approved');b[1].onclick=()=>review(x.id,'rejected')}body.appendChild(tr)});if(!rows.length)body.innerHTML='<tr><td colspan="6">No requests found.</td></tr>'}catch(e){message.textContent=e.message;message.className='error'}}async function review(id,status){let note=status==='rejected'?(prompt('Rejection reason:')||''):(prompt('Approval note (optional):')||'');if(status==='rejected'&&!note.trim())return;const r=await fetch(API+'/api/leave-requests/'+id+'/review',{method:'PATCH',headers:H(),body:JSON.stringify({tenant_id:Number(tenant),status,review_notes:note})}),d=await r.json();if(!r.ok)alert(d.error);loadRequests()}loadRequests();
</script></body></html>
