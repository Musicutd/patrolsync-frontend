<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatrolSync Two-Step Verification</title><style>body{font-family:Arial;max-width:720px;margin:30px auto;padding:0 16px;background:#f8fafc}.card{background:white;border:1px solid #dbe3ee;border-radius:10px;padding:20px;margin:14px 0}input,button{box-sizing:border-box;padding:11px;margin:6px 0;border-radius:6px;border:1px solid #cbd5e1}input{width:100%}button{background:#2563eb;color:white;border:0;cursor:pointer}.danger{background:#dc2626}.ok{color:#15803d}.error{color:#dc2626}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Two-Step Verification</h2><div class="card"><h3>Email verification codes</h3><p>After your password is accepted, PatrolSync sends a six-digit code to your account email. Codes expire after 10 minutes and allow five attempts.</p><p id="state">Loading…</p><button id="start" onclick="startEnable()" style="display:none">Enable Two-Step Verification</button><div id="confirm" style="display:none"><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button onclick="confirmEnable()">Confirm & Enable</button></div><div id="disable" style="display:none"><input id="password" type="password" placeholder="Current password"><button class="danger" onclick="disableMfa()">Disable Two-Step Verification</button></div><p id="status"></p></div><script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id');let challenge=null;if(!token||!tenant)location.replace('login.html');const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});async function load(){try{const r=await fetch(API+'/api/security/email-mfa',{headers:headers()}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not load settings');document.getElementById('state').innerHTML='<b>Status:</b> '+(d.enabled?'Enabled':'Disabled')+'<br><b>Email:</b> '+d.email+'<br><b>Email provider:</b> '+(d.provider_ready?'Ready':'Not configured');document.getElementById('state').className=d.enabled?'ok':'';document.getElementById('start').style.display=!d.enabled&&d.provider_ready?'inline-block':'none';document.getElementById('disable').style.display=d.enabled?'block':'none'}catch(e){show(e.message,true)}}async function startEnable(){try{const r=await fetch(API+'/api/security/email-mfa/start',{method:'POST',headers:headers(),body:JSON.stringify({tenant_id:Number(tenant)})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not send code');challenge=d.challenge_token;document.getElementById('confirm').style.display='block';show('Verification code sent to your email.')}catch(e){show(e.message,true)}}async function confirmEnable(){try{const code=document.getElementById('code').value.trim(),r=await fetch(API+'/api/security/email-mfa/confirm',{method:'POST',headers:headers(),body:JSON.stringify({challenge_token:challenge,code})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not enable');show(d.message);document.getElementById('confirm').style.display='none';load()}catch(e){show(e.message,true)}}async function disableMfa(){if(!confirm('Disable two-step verification?'))return;try{const password=document.getElementById('password').value,r=await fetch(API+'/api/security/email-mfa',{method:'DELETE',headers:headers(),body:JSON.stringify({password})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not disable');show(d.message);document.getElementById('password').value='';load()}catch(e){show(e.message,true)}}function show(message,error=false){const s=document.getElementById('status');s.textContent=message;s.className=error?'error':'ok'}load();</script></body></html>
