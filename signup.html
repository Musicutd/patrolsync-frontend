<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PatrolSync - Sign Up</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; }
    h2 { color: #222; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; font-size: 14px; }
    button { background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #999; }
    #status { margin-top: 10px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
    .plans { display: flex; gap: 10px; margin: 10px 0; }
    .plan-card { flex: 1; border: 2px solid #ddd; border-radius: 6px; padding: 12px; text-align: center; cursor: pointer; }
    .plan-card.selected { border-color: #2563eb; background: #eff6ff; }
  </style>
</head>
<body>
  <h2>Create Your PatrolSync Account</h2>
  <form id="signupForm">
    <label>Company Name</label>
    <input type="text" id="company_name" required placeholder="e.g. Apex Security Ltd">

    <label>Choose a Plan</label>
    <div class="plans">
      <div class="plan-card selected" data-plan="starter">Starter</div>
      <div class="plan-card" data-plan="pro">Pro</div>
      <div class="plan-card" data-plan="enterprise">Enterprise</div>
    </div>

    <label>Admin Email</label>
    <input type="email" id="admin_email" required placeholder="you@company.com">

    <label>Password</label>
    <input type="password" id="admin_password" required minlength="6">

    <button type="submit" id="submitBtn">Create Account</button>
  </form>
  <div id="status"></div>

  <script>
    const API_URL = 'https://patrolsync-backend.onrender.com/api/signup';
    let selectedPlan = 'starter';

    document.querySelectorAll('.plan-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedPlan = card.dataset.plan;
      });
    });

    const form = document.getElementById('signupForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = 'Creating account...';
      statusDiv.className = '';

      const payload = {
        company_name: document.getElementById('company_name').value,
        plan: selectedPlan,
        admin_email: document.getElementById('admin_email').value,
        admin_password: document.getElementById('admin_password').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Signup failed');

        localStorage.setItem('token', data.token);
        localStorage.setItem('tenant_id', data.tenant.id);
        localStorage.setItem('user_email', data.admin.email);

        statusDiv.textContent = 'Account created! Tenant ID: ' + data.tenant.id;
        statusDiv.className = 'success';
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.className = 'error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
