<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Messages</title><style>body{font-family:Arial;margin:0;background:#f1f5f9;color:#172033}.wrap{max-width:1100px;margin:20px auto;padding:0 12px}.layout{display:grid;grid-template-columns:300px 1fr;min-height:650px;background:#fff;border:1px solid #dbe2ea;border-radius:10px;overflow:hidden}.sidebar{border-right:1px solid #dbe2ea;padding:12px}.chat{display:flex;flex-direction:column}.messages{padding:18px;flex:1;overflow:auto;max-height:550px}.conversation{padding:11px;border-radius:7px;cursor:pointer;border-bottom:1px solid #e2e8f0}.conversation.active{background:#dbeafe}.unread{background:#dc2626;color:#fff;border-radius:10px;padding:2px 7px;font-size:11px}.message{max-width:75%;padding:10px;border-radius:10px;background:#e2e8f0;margin:8px 0}.mine{margin-left:auto;background:#2563eb;color:#fff}.meta{font-size:11px;opacity:.7;margin-top:5px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #dbe2ea}.composer textarea{flex:1;padding:10px}.composer button,button,select{padding:9px;border:0;border-radius:5px;background:#2563eb;color:#fff}.muted{color:#64748b;font-size:13px}.error{color:#dc2626}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid #dbe2ea}.messages{min-height:380px}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><div class="wrap"><p><a id="back" href="dashboard.html">← Dashboard</a></p><h2>Team Messages</h2><div class="layout"><aside class="sidebar"><div id="adminCreate" style="display:none"><select id="guard"><option value="">Message a guard…</option></select><button id="create">Start</button></div><h3>Conversations</h3><div id="conversations"></div><p id="error" class="error"></p></aside><main class="chat"><div style="padding:12px;border-bottom:1px solid #dbe2ea"><b id="title">Select a conversation</b><div id="hint" class="muted"></div></div><div id="messages" class="messages"></div><div id="composer" class="composer" style="display:none"><textarea id="message" rows="2" maxlength="4000" placeholder="Write a message..."></textarea><button id="send">Send</button></div></main></div></div><script>
const API='https://patrolsync-backend.onrender.com',adminToken=localStorage.getItem('token'),guardToken=localStorage.getItem('guard_token'),isAdmin=Boolean(adminToken),token=adminToken||guardToken,tenant=localStorage.getItem(isAdmin?'tenant_id':'guard_tenant_id'),me=Number(localStorage.getItem(isAdmin?'admin_user_id':'guard_user_id')||0),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active=null,channels=[],poll=null;if(!token||!tenant)location.replace(isAdmin?'login.html':'guard.html');if(!isAdmin)$('back').href='guard.html';if(isAdmin)$('adminCreate').style.display='block';async function api(path,o={}){const r=await fetch(API+path,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function loadGuards(){if(!isAdmin)return;try{const rows=await api('/api/users?tenant_id='+tenant),list=Array.isArray(rows)?rows:(rows.users||[]);$('guard').innerHTML='<option value="">Message a guard…</option>'+list.filter(x=>x.role==='guard').map(x=>`<option value="${x.id}">${esc(x.email)}</option>`).join('')}catch(e){$('error').textContent=e.message}}async function loadConversations(keep=true){try{channels=await api('/api/team-conversations?tenant_id='+tenant);$('conversations').innerHTML=channels.map(c=>`<div class="conversation ${active==c.id?'active':''}" onclick="openChat(${c.id})"><b>${esc(c.kind==='company'?'📢 '+c.title:c.guard_email||c.title)}</b>${c.unread_count?` <span class="unread">${c.unread_count}</span>`:''}<div class="muted">${esc((c.last_message||'No messages yet').slice(0,55))}</div></div>`).join('');if(!keep&&!active&&channels.length)openChat(channels[0].id)}catch(e){$('error').textContent=e.message}}async function openChat(id){active=id;const c=channels.find(x=>String(x.id)===String(id));$('title').textContent=c?(c.kind==='company'?'Company Announcements':c.guard_email||c.title):'Conversation';$('hint').textContent=c&&c.kind==='company'&&!isAdmin?'Only administrators can post in this channel.':'';$('composer').style.display=c&&c.kind==='company'&&!isAdmin?'none':'flex';await loadMessages();loadConversations()}async function loadMessages(){if(!active)return;try{const rows=await api(`/api/team-conversations/${active}/messages?tenant_id=${tenant}`);$('messages').innerHTML=rows.length?rows.map(m=>`<div class="message ${Number(m.sender_user_id)===me?'mine':''}">${esc(m.message)}<div class="meta">${esc(m.sender_email||m.sender_role)} · ${new Date(m.created_at).toLocaleString()}</div></div>`).join(''):'<p class="muted">No messages yet.</p>';$('messages').scrollTop=$('messages').scrollHeight}catch(e){$('error').textContent=e.message}}async function createDirect(){try{const id=Number($('guard').value);if(!id)return;const c=await api('/api/team-conversations/direct',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),guard_user_id:id})});await loadConversations();openChat(c.id)}catch(e){$('error').textContent=e.message}}async function send(){const message=$('message').value.trim();if(!active||!message)return;try{await api(`/api/team-conversations/${active}/messages`,{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),message})});$('message').value='';await loadMessages();loadConversations()}catch(e){$('error').textContent=e.message}}$('create').onclick=createDirect;$('send').onclick=send;$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};loadGuards();loadConversations(false);poll=setInterval(()=>{loadConversations();loadMessages()},5000);window.addEventListener('beforeunload',()=>clearInterval(poll));
</script></body></html>
