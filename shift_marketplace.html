<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Shifts & Swaps</title><style>body{font-family:Arial;max-width:850px;margin:25px auto;padding:0 15px;background:#f8fafc}.card{background:white;border:1px solid #ddd;border-radius:9px;padding:16px;margin:14px 0}.item{padding:12px 0;border-bottom:1px solid #eee}button,select,input{padding:9px;margin:5px;border-radius:5px}button{background:#2563eb;color:white;border:0}.accept{background:#16a34a}.decline{background:#dc2626}.badge{padding:3px 8px;background:#dbeafe;border-radius:10px}.error{color:red}</style>  <link rel="stylesheet" href="patrolsync-guard.css">
  <script src="patrolsync-guard-ui.js" defer></script>
</head><body class="ps-guard-page"><p><a href="guard.html">← Guard App</a></p><h2>Open Shifts & Swaps</h2><div class="card"><h3>Available Open Shifts</h3><div id="open"></div></div><div class="card"><h3>Request a Swap</h3><select id="myShift"></select><button onclick="loadTargets()">Choose Shift</button><div id="targetArea"></div></div><div class="card"><h3>Swap Requests</h3><div id="swaps"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id'),user=localStorage.getItem('guard_user_id');if(!token||!tenant)location.replace('guard.html');const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});const date=x=>String(x).slice(0,10);
async function load(){const [o,s,w]=await Promise.all([fetch(API+'/api/open-shifts?tenant_id='+tenant,{headers:H()}),fetch(API+'/api/shifts?tenant_id='+tenant+'&user_id='+user,{headers:H()}),fetch(API+'/api/shift-swaps?tenant_id='+tenant,{headers:H()})]);const opens=await o.json(),mine=await s.json(),swapRows=await w.json();open.innerHTML=opens.length?opens.map(x=>'<div class="item"><b>'+x.site_name+'</b> · '+date(x.shift_date)+' · '+x.start_time+'–'+x.end_time+' ('+x.duration_hours+'h)<br><button onclick="claim('+x.id+')">Claim Shift</button></div>').join(''):'No open shifts.';myShift.innerHTML='<option value="">Select your shift</option>'+mine.map(x=>'<option value="'+x.id+'">'+date(x.shift_date)+' · '+x.start_time+'–'+x.end_time+' · '+x.site_name+'</option>').join('');swaps.innerHTML=swapRows.length?swapRows.map(x=>'<div class="item"><span class="badge">'+x.status+'</span> '+date(x.shift_date)+' · '+x.site_name+'<br>'+x.requester_email+' → '+x.target_email+(x.status==='pending_recipient'&&Number(x.target_user_id)===Number(user)?'<br><button class="accept" onclick="respond('+x.id+',true)">Accept</button><button class="decline" onclick="respond('+x.id+',false)">Decline</button>':'')+'</div>').join(''):'No swap requests.'}
async function claim(id){const r=await fetch(API+'/api/open-shifts/'+id+'/claim',{method:'POST',headers:H(),body:JSON.stringify({tenant_id:Number(tenant)})}),d=await r.json();if(!r.ok)return alert(d.error);alert('Shift claimed.');load()}
async function loadTargets(){if(!myShift.value)return;const r=await fetch(API+'/api/shifts/'+myShift.value+'/swap-targets?tenant_id='+tenant,{headers:H()}),rows=await r.json();targetArea.innerHTML='<select id="target">'+rows.map(x=>'<option value="'+x.id+'">'+x.email+'</option>').join('')+'</select><input id="reason" placeholder="Reason"><button onclick="requestSwap()">Send Request</button>'}
async function requestSwap(){const r=await fetch(API+'/api/shift-swaps',{method:'POST',headers:H(),body:JSON.stringify({tenant_id:Number(tenant),shift_id:Number(myShift.value),target_user_id:Number(target.value),reason:reason.value})}),d=await r.json();if(!r.ok)return alert(d.error);alert('Swap request sent.');load()}
async function respond(id,accepted){const r=await fetch(API+'/api/shift-swaps/'+id+'/respond',{method:'PATCH',headers:H(),body:JSON.stringify({tenant_id:Number(tenant),accepted})}),d=await r.json();if(!r.ok)alert(d.error);load()}load();
</script></body></html>
