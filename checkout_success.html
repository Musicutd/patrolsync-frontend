<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout confirmation — PatrolSync</title><link rel="stylesheet" href="patrolsync-module.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d14;color:#eef4fa;font:15px/1.55 Inter,Segoe UI,sans-serif}.card{width:min(620px,calc(100% - 32px));padding:32px;border:1px solid #263143;border-radius:18px;background:#111927}.mark{font-size:38px;color:#2dd4bf}h1{margin:.2em 0}.muted{color:#94a0b2}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}a{padding:11px 15px;border-radius:9px;background:#2dd4bf;color:#061411;font-weight:800;text-decoration:none}a.secondary{border:1px solid #344156;background:transparent;color:#eef4fa}</style></head><body><main class="card"><div class="mark">✓</div><h1>Payment received</h1><p id="message" class="muted">Confirming the signed payment notification and applying your subscription…</p><div id="details"></div><div class="actions"><a href="subscription_usage.html">Return to Plan &amp; Usage</a><a class="secondary" href="dashboard.html">Operations workspace</a></div></main><script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),checkout=new URLSearchParams(location.search).get('checkout'),message=document.getElementById('message'),details=document.getElementById('details');if(!token)location.replace('login.html');let attempts=0;async function check(){if(!checkout){message.textContent='The checkout reference is missing. Return to Plan & Usage to review your subscription.';return}try{const response=await fetch(API+'/api/billing/checkout-session/'+encodeURIComponent(checkout),{headers:{Authorization:'Bearer '+token}}),data=await response.json();if(!response.ok)throw Error(data.error||'Confirmation unavailable');if(data.status==='paid'){message.textContent='Your payment was verified and the subscription is active.';details.textContent=data.plan_code+' · '+(data.billing_interval==='year'?'annual':'monthly')+' billing · '+data.currency;return}if(['failed','expired'].includes(data.status)){message.textContent='This checkout was not completed. No subscription change was applied.';return}attempts++;message.textContent='Payment finished. Waiting for secure provider confirmation…';if(attempts<20)setTimeout(check,2000);else message.textContent='Payment confirmation is taking longer than expected. Your plan will be applied automatically when the signed notification arrives.'}catch(error){message.textContent=error.message}}check();</script></body></html>
