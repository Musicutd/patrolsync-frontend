<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PatrolSync - Report Incident</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    h2 { color: #222; }
    textarea, select, input, button {
      width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; font-size: 14px;
    }
    button {
      background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;
    }
    button:disabled { background: #999; }
    #status { margin-top: 10px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>Report Incident</h2>
  <form id="incidentForm">
    <label>Tenant ID</label>
    <input type="number" id="tenant_id" required value="1">

    <label>Site ID</label>
    <input type="number" id="site_id" required value="1">

    <label>User ID</label>
    <input type="number" id="user_id" required value="1">

    <label>Description</label>
    <textarea id="description" rows="4" placeholder="Describe what happened" required></textarea>

    <label>Severity</label>
    <select id="severity">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <button type="submit" id="submitBtn">Submit Report</button>
  </form>
  <div id="status"></div>

  <script>
    const API_URL = 'https://patrolsync-backend.onrender.com/api/incidents';
    const form = document.getElementById('incidentForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = 'Submitting...';
      statusDiv.className = '';

      const payload = {
        tenant_id: Number(document.getElementById('tenant_id').value),
        site_id: Number(document.getElementById('site_id').value),
        user_id: Number(document.getElementById('user_id').value),
        description: document.getElementById('description').value,
        severity: document.getElementById('severity').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Request failed');
        statusDiv.textContent = 'Incident reported successfully.';
        statusDiv.className = 'success';
        document.getElementById('description').value = '';
      } catch (err) {
        statusDiv.textContent = 'Something went wrong. Please try again.';
        statusDiv.className = 'error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
