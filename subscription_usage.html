<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan & Usage — PatrolSync</title><link rel="stylesheet" href="patrolsync-module.css"><style>
body{margin:0;background:#080d14;color:#eef4fa;font:14px/1.5 Inter,Segoe UI,sans-serif}html[data-theme=light] body{background:#eef3f7;color:#101827}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.top a{color:#2dd4bf}.card{background:#111927;border:1px solid #263143;border-radius:14px;padding:19px;margin-top:15px}html[data-theme=light] .card{background:#fff;border-color:#d7dee9}.muted{color:#94a0b2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.metric{background:#151e2c;border:1px solid #263143;border-radius:11px;padding:15px}html[data-theme=light] .metric{background:#f7f9fc;border-color:#d7dee9}.metric b{display:block;font-size:28px}.bar{height:8px;background:#253044;border-radius:9px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:#2dd4bf}.feature{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #263143}.on{color:#31c48d}.off{color:#94a0b2}button{background:#2dd4bf;border:0;border-radius:8px;padding:9px 12px;font-weight:800}@media(max-width:600px){.wrap{padding:16px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><a href="dashboard.html">← Operations workspace</a><h1>Plan & Usage</h1><div class="muted">Current capacity and monthly metered usage</div></div><button id="theme">☀ Light</button></div><div id="status" class="muted"></div><section id="capacity" class="grid"></section><section class="card"><h2>Included capabilities</h2><div id="features"></div></section></main><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token');if(!token)location.replace('login.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='patrolsync_theme';document.documentElement.dataset.theme=localStorage.getItem(key)||'dark';function draw(){theme.textContent=document.documentElement.dataset.theme==='dark'?'☀ Light':'☾ Dark'}theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem(key,document.documentElement.dataset.theme);draw()};draw();async function api(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(r.status===401)location.replace('login.html');if(!r.ok)throw Error(d.error||'Request failed');return d}function metric(label,current,limit){const unlimited=limit==null,pct=unlimited?0:Math.min(100,Math.round((current/Math.max(1,limit))*100));return`<article class="metric"><span class="muted">${esc(label)}</span><b>${current} <small class="muted">/ ${unlimited?'Unlimited':limit}</small></b>${unlimited?'':`<div class="bar"><span style="width:${pct}%"></span></div>`}</article>`}async function load(){status.textContent='Loading…';try{const[e,u]=await Promise.all([api('/api/subscription/entitlements'),api('/api/subscription/usage')]);const byCode=Object.fromEntries(u.features.map(f=>[f.code,f]));status.innerHTML=`<div class="card"><b>${esc(e.plan?.name||'Current plan')}</b> · ${esc(e.plan?.version||'')} · ${esc(e.plan?.status||'')}<br><span class="muted">Usage period ${new Date(u.period.start).toLocaleDateString()} – ${new Date(u.period.end).toLocaleDateString()}</span></div>`;capacity.innerHTML=metric('Active guards',u.capacity.active_guards,byCode.active_guards?.hard_limit)+metric('Sites',u.capacity.sites,byCode.sites?.hard_limit)+metric('Checkpoints',u.capacity.checkpoints,byCode.checkpoints?.hard_limit)+metric('Client users',u.capacity.client_users,byCode.client_users?.hard_limit);features.innerHTML=u.features.filter(f=>f.unit==='boolean').map(f=>`<div class="feature"><b>${esc(f.name)}</b><b class="${f.enabled?'on':'off'}">${f.enabled?'Included':'Not included'}</b></div>`).join('')||'<div class="muted">No feature catalogue entries.</div>'}catch(e){status.textContent=e.message;status.style.color='#fb5d78'}}load();
</script></body></html>
