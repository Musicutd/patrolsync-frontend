<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PatrolSync - Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; }
    h2, h3 { color: #222; }
    input, select, button, textarea { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; font-size: 14px; }
    button { background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.logout { background: #dc2626; }
    button.scan { background: #16a34a; width: auto; padding: 4px 10px; margin: 0; font-size: 12px; }
    section { border: 1px solid #ddd; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
    #header { display: flex; justify-content: space-between; align-items: center; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #eee; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; }
    .status { font-weight: bold; margin-top: 8px; }
    .success { color: green; }
    .error { color: red; }
    .sev-low { color: #2563eb; }
    .sev-medium { color: #d97706; }
    .sev-high { color: #dc2626; font-weight: bold; }
    .sev-critical { color: #7f1d1d; font-weight: bold; }
  </style>
</head>
<body>
  <div id="header">
    <h2 id="companyName">Loading...</h2>
    <button class="logout" onclick="logout()">Log Out</button>
  </div>
  <p>Plan: <strong id="planLabel">-</strong> | Tenant ID: <span id="tenantIdLabel">-</span></p>

  <section>
    <h3>Add a Site</h3>
    <input type="text" id="siteName" placeholder="Site name (e.g. Downtown Mall)">
    <input type="text" id="siteAddress" placeholder="Address (optional)">
    <button onclick="addSite()">Add Site</button>
    <div id="siteStatus" class="status"></div>
    <ul id="siteList"></ul>
  </section>

  <section>
    <h3>Add a Guard</h3>
    <input type="email" id="guardEmail" placeholder="Guard email">
    <input type="password" id="guardPassword" placeholder="Temporary password" minlength="6">
    <button onclick="addGuard()">Add Guard</button>
    <div id="guardStatus" class="status"></div>
    <ul id="guardList"></ul>
  </section>

  <section>
    <h3>Checkpoints</h3>
    <select id="checkpointSite">
      <option value="">Select a site</option>
    </select>
    <input type="text" id="checkpointName" placeholder="Checkpoint name (e.g. Main Entrance)">
    <input type="text" id="checkpointQr" placeholder="QR code value (e.g. CP-001)">
    <input type="text" id="checkpointLat" placeholder="Latitude (optional)">
    <input type="text" id="checkpointLng" placeholder="Longitude (optional)">
    <button onclick="addCheckpoint()">Add Checkpoint</button>
    <div id="checkpointStatus" class="status"></div>
    <ul id="checkpointList"></ul>
  </section>

  <section>
    <h3>Report Incident</h3>
    <select id="incidentSite">
      <option value="">Select a site</option>
    </select>
    <textarea id="incidentDescription" placeholder="Describe what happened" rows="4"></textarea>
    <select id="incidentSeverity">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="critical">Critical</option>
    </select>
    <button onclick="addIncident()">Submit Report</button>
    <div id="incidentSubmitStatus" class="status"></div>
  </section>

  <section>
    <h3>Recent Incidents</h3>
    <button onclick="loadIncidents()">Refresh</button>
    <ul id="incidentList"></ul>
  </section>

  <script>
    const API_BASE = 'https://patrolsync-backend.onrender.com';
    const token = localStorage.getItem('token');
    const tenantId = localStorage.getItem('tenant_id');
    const userEmail = localStorage.getItem('user_email');

    if (!token || !tenantId) {
      window.location.href = 'signup.html';
    }

    document.getElementById('tenantIdLabel').textContent = tenantId;
    document.getElementById('companyName').textContent = userEmail ? 'Welcome, ' + userEmail : 'Dashboard';

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      };
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('tenant_id');
      localStorage.removeItem('user_email');
      window.location.href = 'signup.html';
    }

    async function loadTenantInfo() {
      try {
        const res = await fetch(API_BASE + '/api/tenants');
        const tenants = await res.json();
        const tenant = tenants.find(t => t.id === Number(tenantId));
        if (tenant) {
          document.getElementById('companyName').textContent = tenant.name;
          document.getElementById('planLabel').textContent = tenant.plan;
        }
      } catch (err) {}
    }

    function populateSiteDropdown(select, sites) {
      const previousValue = select.value;
      select.innerHTML = '<option value="">Select a site</option>';
      sites.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        select.appendChild(opt);
      });
      if (previousValue) select.value = previousValue;
    }

    let currentSites = [];

    async function loadSites() {
      try {
        const res = await fetch(API_BASE + '/api/sites?tenant_id=' + tenantId, { headers: authHeaders() });
        const sites = await res.json();
        currentSites = sites;

        const list = document.getElementById('siteList');
        list.innerHTML = '';
        sites.forEach(s => {
          const li = document.createElement('li');
          li.textContent = s.name + (s.address ? ' — ' + s.address : '');
          list.appendChild(li);
        });

        populateSiteDropdown(document.getElementById('incidentSite'), sites);
        populateSiteDropdown(document.getElementById('checkpointSite'), sites);

        if (document.getElementById('checkpointSite').value) {
          loadCheckpoints();
        }
      } catch (err) {}
    }

    async function addSite() {
      const name = document.getElementById('siteName').value;
      const address = document.getElementById('siteAddress').value;
      const statusDiv = document.getElementById('siteStatus');
      if (!name) { statusDiv.textContent = 'Site name is required'; statusDiv.className = 'status error'; return; }
      try {
        const res = await fetch(API_BASE + '/api/sites', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ tenant_id: Number(tenantId), name, address })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to add site');
        statusDiv.textContent = 'Site added.';
        statusDiv.className = 'status success';
        document.getElementById('siteName').value = '';
        document.getElementById('siteAddress').value = '';
        loadSites();
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.className = 'status error';
      }
    }

    async function loadGuards() {
      try {
        const res = await fetch(API_BASE + '/api/users?tenant_id=' + tenantId + '&role=guard', { headers: authHeaders() });
        const guards = await res.json();
        const list = document.getElementById('guardList');
        list.innerHTML = '';
        guards.forEach(g => {
          const li = document.createElement('li');
          li.textContent = g.email;
          list.appendChild(li);
        });
      } catch (err) {}
    }

    async function addGuard() {
      const email = document.getElementById('guardEmail').value;
      const password = document.getElementById('guardPassword').value;
      const statusDiv = document.getElementById('guardStatus');
      if (!email || !password) { statusDiv.textContent = 'Email and password are required'; statusDiv.className = 'status error'; return; }
      try {
        const res = await fetch(API_BASE + '/api/users', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ tenant_id: Number(tenantId), email, role: 'guard', password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to add guard');
        statusDiv.textContent = 'Guard added.';
        statusDiv.className = 'status success';
        document.getElementById('guardEmail').value = '';
        document.getElementById('guardPassword').value = '';
        loadGuards();
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.className = 'status error';
      }
    }

    document.getElementById('checkpointSite').addEventListener('change', loadCheckpoints);

    async function loadCheckpoints() {
      const siteId = document.getElementById('checkpointSite').value;
      const list = document.getElementById('checkpointList');
      list.innerHTML = '';
      if (!siteId) return;
      try {
        const res = await fetch(API_BASE + '/api/checkpoints?tenant_id=' + tenantId + '&site_id=' + siteId, { headers: authHeaders() });
        const checkpoints = await res.json();
        checkpoints.forEach(cp => {
          const li = document.createElement('li');
          const label = document.createElement('span');
          label.textContent = cp.name + ' (QR: ' + cp.qr_code + ')';
          const scanBtn = document.createElement('button');
          scanBtn.textContent = 'Log Scan';
          scanBtn.className = 'scan';
          scanBtn.onclick = () => logPatrolScan(cp.id, li);
          li.appendChild(label);
          li.appendChild(scanBtn);
          list.appendChild(li);
        });
      } catch (err) {}
    }

    async function addCheckpoint() {
      const siteId = document.getElementById('checkpointSite').value;
      const name = document.getElementById('checkpointName').value;
      const qrCode = document.getElementById('checkpointQr').value;
      const lat = document.getElementById('checkpointLat').value;
      const lng = document.getElementById('checkpointLng').value;
      const statusDiv = document.getElementById('checkpointStatus');

      if (!siteId) { statusDiv.textContent = 'Please select a site'; statusDiv.className = 'status error'; return; }
      if (!name || !qrCode) { statusDiv.textContent = 'Checkpoint name and QR code are required'; statusDiv.className = 'status error'; return; }

      try {
        const res = await fetch(API_BASE + '/api/checkpoints', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            tenant_id: Number(tenantId),
            site_id: Number(siteId),
            name,
            qr_code: qrCode,
            latitude: lat || null,
            longitude: lng || null
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to add checkpoint');
        statusDiv.textContent = 'Checkpoint added.';
        statusDiv.className = 'status success';
        document.getElementById('checkpointName').value = '';
        document.getElementById('checkpointQr').value = '';
        document.getElementById('checkpointLat').value = '';
        document.getElementById('checkpointLng').value = '';
        loadCheckpoints();
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.className = 'status error';
      }
    }

    async function logPatrolScan(checkpointId, listItemEl) {
      try {
        const res = await fetch(API_BASE + '/api/patrol-logs', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            tenant_id: Number(tenantId),
            checkpoint_id: checkpointId,
            user_id: JSON.parse(atob(token.split('.')[1])).user_id
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to log scan');
        const confirmMsg = document.createElement('span');
        confirmMsg.textContent = ' ✓ scanned ' + new Date(data.scanned_at || Date.now()).toLocaleTimeString();
        confirmMsg.style.color = 'green';
        confirmMsg.style.fontSize = '12px';
        listItemEl.appendChild(confirmMsg);
      } catch (err) {
        alert('Failed to log scan: ' + err.message);
      }
    }

    async function addIncident() {
      const siteId = document.getElementById('incidentSite').value;
      const description = document.getElementById('incidentDescription').value;
      const severity = document.getElementById('incidentSeverity').value;
      const statusDiv = document.getElementById('incidentSubmitStatus');

      if (!siteId) { statusDiv.textContent = 'Please select a site'; statusDiv.className = 'status error'; return; }
      if (!description) { statusDiv.textContent = 'Description is required'; statusDiv.className = 'status error'; return; }

      try {
        const res = await fetch(API_BASE + '/api/incidents', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            tenant_id: Number(tenantId),
            site_id: Number(siteId),
            description,
            severity
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to submit incident');
        statusDiv.textContent = 'Incident submitted.';
        statusDiv.className = 'status success';
        document.getElementById('incidentDescription').value = '';
        document.getElementById('incidentSite').value = '';
        loadIncidents();
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.className = 'status error';
      }
    }

    async function loadIncidents() {
      try {
        const res = await fetch(API_BASE + '/api/incidents?tenant_id=' + tenantId, { headers: authHeaders() });
        const incidents = await res.json();
        const list = document.getElementById('incidentList');
        list.innerHTML = '';
        incidents.forEach(i => {
          const li = document.createElement('li');
          li.innerHTML = '<span class="sev-' + i.severity + '">[' + i.severity.toUpperCase() + ']</span> ' +
            i.description + ' — ' + new Date(i.reported_at).toLocaleString();
          list.appendChild(li);
        });
      } catch (err) {}
    }

    loadTenantInfo();
    loadSites();
    loadGuards();
    loadIncidents();
  </script>
</body>
</html>
