<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch Command Center</title><style>body{font-family:Arial;max-width:1250px;margin:20px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}input,select,textarea,button{width:100%;padding:9px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;border-radius:5px}.job{border-left:6px solid #94a3b8;padding:12px;margin:9px 0;background:#f8fafc}.job.high{border-color:#f59e0b}.job.critical{border-color:#dc2626;background:#fff1f2}.badge{padding:3px 8px;border-radius:12px;background:#e2e8f0;font-size:12px}.meta{font-size:12px;color:#64748b}.error{color:#dc2626}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Dispatch Command Center</h2><div class="card"><h3>Create Dispatch</h3><div class="grid"><input id="title" placeholder="Dispatch title"><select id="priority"><option value="normal">Normal priority</option><option value="low">Low</option><option value="high">High</option><option value="critical">Critical</option></select><select id="guard"><option value="">Assign guard</option></select><select id="site"><option value="">Site (optional)</option></select><input id="address" placeholder="Address or meeting point"><input id="latitude" placeholder="Latitude (optional)"><input id="longitude" placeholder="Longitude (optional)"></div><textarea id="description" rows="3" placeholder="Instructions and incident details"></textarea><button id="create">Assign Dispatch</button><p id="status"></p></div><div class="card"><h3>Operations Board</h3><select id="filter" style="max-width:220px"><option value="active">Active jobs</option><option value="all">All jobs</option></select><button id="refresh" style="max-width:110px">Refresh</button><div id="list"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}function show(m,c='error'){$('status').textContent=m;$('status').className=c}async function options(){try{const [users,sites]=await Promise.all([api('/api/users?tenant_id='+tenant),api('/api/sites?tenant_id='+tenant)]),u=Array.isArray(users)?users:users.users||[],s=Array.isArray(sites)?sites:sites.sites||[];$('guard').innerHTML='<option value="">Assign guard</option>'+u.filter(x=>x.role==='guard').map(x=>`<option value="${x.id}">${esc(x.email)}</option>`).join('');$('site').innerHTML='<option value="">Site (optional)</option>'+s.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}catch(e){show(e.message)}}async function create(){try{await api('/api/dispatch-jobs',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),title:$('title').value,description:$('description').value,priority:$('priority').value,assigned_guard_id:Number($('guard').value),site_id:$('site').value?Number($('site').value):null,address:$('address').value,latitude:$('latitude').value?Number($('latitude').value):null,longitude:$('longitude').value?Number($('longitude').value):null})});show('Dispatch assigned and guard notified.','');$('title').value='';$('description').value='';load()}catch(e){show(e.message)}}async function status(id,value){try{await api('/api/dispatch-jobs/'+id+'/status',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),status:value})});load()}catch(e){alert(e.message)}}async function load(){try{const rows=await api('/api/dispatch-jobs?tenant_id='+tenant+'&status='+$('filter').value);$('list').innerHTML=rows.length?rows.map(x=>`<div class="job ${esc(x.priority)}"><b>${esc(x.reference_code)} — ${esc(x.title)}</b> <span class="badge">${esc(x.priority)}</span> <span class="badge">${esc(x.status)}</span><p>${esc(x.description||'No additional instructions')}</p><div class="meta">Guard: ${esc(x.guard_email)} · Site: ${esc(x.site_name||x.address||'Unspecified')} · Assigned ${new Date(x.assigned_at).toLocaleString()}</div>${x.latitude&&x.longitude?`<p><a target="_blank" href="https://www.google.com/maps?q=${x.latitude},${x.longitude}">Open location →</a></p>`:''}${!['completed','cancelled'].includes(x.status)?`<button style="max-width:100px;background:#dc2626" onclick="status(${x.id},'cancelled')">Cancel</button>`:''}</div>`).join(''):'<p>No dispatch jobs.</p>'}catch(e){show(e.message)}}$('create').onclick=create;$('refresh').onclick=load;$('filter').onchange=load;options();load();setInterval(load,15000);
</script></body></html>
