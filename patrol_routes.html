<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrol Routes</title>
<style>body{font-family:Arial;max-width:1100px;margin:24px auto;padding:0 16px;background:#f8fafc;color:#0f172a}.grid{display:grid;grid-template-columns:420px 1fr;gap:16px}.card{background:white;border:1px solid #d7dee8;border-radius:10px;padding:16px}label{display:block;font-size:13px;font-weight:bold;margin-top:10px}input,select,textarea,button{box-sizing:border-box;padding:9px;border:1px solid #94a3b8;border-radius:5px}input,select,textarea{width:100%}button{border:0;background:#2563eb;color:white;cursor:pointer}.secondary{background:#64748b}.danger{background:#dc2626}.checkpoint{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #dbe2ea;border-radius:6px;margin:6px 0}.checkpoint span{flex:1}.route{border-left:4px solid #2563eb;padding:12px;margin:10px 0;background:#f8fafc}.route h3{margin:0 0 5px}.muted{color:#64748b;font-size:13px}.status{margin-top:9px}.error{color:#dc2626}.success{color:#15803d}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell">
<p><a href="dashboard.html">← Back to Dashboard</a></p><h2>Patrol Route Templates</h2><p>Group checkpoints into reusable routes and set the order guards must follow.</p><div class="grid"><div class="card"><h3 id="formTitle">Create Route</h3><input type="hidden" id="routeId"><label>Site</label><select id="site"><option value="">Select a site</option></select><label>Route name</label><input id="name" placeholder="e.g. Night perimeter patrol"><label>Description</label><textarea id="description" placeholder="Instructions for this patrol"></textarea><label>Estimated duration (minutes)</label><input id="minutes" type="number" min="1" placeholder="30"><label><input id="strict" type="checkbox" checked style="width:auto"> Require checkpoints in this order</label><h4>Checkpoint order</h4><div id="checkpointList" class="muted">Select a site first.</div><button id="save" style="margin-top:10px">Save Route</button> <button id="cancel" class="secondary" style="display:none">Cancel Edit</button><div id="message" class="status"></div></div><div class="card"><h3>Saved Routes</h3><div id="routes">Loading…</div></div></div>
<script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id');if(!token||!tenant)location.replace('login.html');
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),$=id=>document.getElementById(id);let checkpoints=[],order=[],savedRoutes=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url,opt={}){const r=await fetch(API+url,{...opt,headers:{...H(),...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function loadSites(){const rows=await json('/api/sites?tenant_id='+tenant);$('site').innerHTML='<option value="">Select a site</option>'+rows.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')}
async function loadCheckpoints(){const site=$('site').value;order=[];if(!site){checkpoints=[];renderCheckpoints();return}checkpoints=await json('/api/checkpoints?tenant_id='+tenant+'&site_id='+site);order=checkpoints.map(x=>x.id);renderCheckpoints()}
function renderCheckpoints(){const box=$('checkpointList');if(!checkpoints.length){box.innerHTML='<span class="muted">No checkpoints found at this site.</span>';return}box.innerHTML=order.map((id,i)=>{const c=checkpoints.find(x=>x.id===id);return '<div class="checkpoint"><b>'+(i+1)+'</b><span>'+esc(c.name)+'</span><button onclick="move('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button><button onclick="move('+i+',1)" '+(i===order.length-1?'disabled':'')+'>↓</button><button class="danger" onclick="removeCheckpoint('+id+')">×</button></div>'}).join('');const unused=checkpoints.filter(x=>!order.includes(x.id));if(unused.length)box.innerHTML+='<select id="addCheckpoint"><option value="">+ Add removed checkpoint</option>'+unused.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select>'}
function move(i,d){const j=i+d;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];renderCheckpoints()}function removeCheckpoint(id){order=order.filter(x=>x!==id);renderCheckpoints()}document.addEventListener('change',e=>{if(e.target.id==='addCheckpoint'&&e.target.value){order.push(Number(e.target.value));renderCheckpoints()}});
async function loadRoutes(){savedRoutes=await json('/api/patrol-routes?tenant_id='+tenant);$('routes').innerHTML=savedRoutes.length?savedRoutes.map(r=>'<div class="route"><h3>'+esc(r.name)+'</h3><div class="muted">'+esc(r.site_name)+' · '+r.checkpoints.length+' checkpoints · '+(r.strict_order?'Ordered':'Any order')+(r.estimated_minutes?' · '+r.estimated_minutes+' min':'')+'</div><ol>'+r.checkpoints.map(c=>'<li>'+esc(c.name)+'</li>').join('')+'</ol><button onclick="editRoute('+r.id+')">Edit</button> <button class="danger" onclick="deleteRoute('+r.id+')">Delete</button></div>').join(''):'<p class="muted">No route templates yet.</p>'}
async function saveRoute(){if(!$('site').value||!$('name').value.trim()||!order.length)return show('Site, name, and at least one checkpoint are required.',false);const id=$('routeId').value,payload={tenant_id:Number(tenant),site_id:Number($('site').value),name:$('name').value.trim(),description:$('description').value.trim(),estimated_minutes:$('minutes').value?Number($('minutes').value):null,strict_order:$('strict').checked,checkpoint_ids:order};try{await json(id?'/api/patrol-routes/'+id:'/api/patrol-routes',{method:id?'PUT':'POST',body:JSON.stringify(payload)});show(id?'Route updated.':'Route created.',true);reset();loadRoutes()}catch(e){show(e.message,false)}}
async function editRoute(id){const r=savedRoutes.find(x=>x.id===id);$('routeId').value=id;$('site').value=r.site_id;await loadCheckpoints();order=r.checkpoints.map(x=>x.checkpoint_id);$('name').value=r.name;$('description').value=r.description||'';$('minutes').value=r.estimated_minutes||'';$('strict').checked=r.strict_order;$('formTitle').textContent='Edit Route';$('cancel').style.display='inline-block';renderCheckpoints();scrollTo({top:0,behavior:'smooth'})}
async function deleteRoute(id){if(!confirm('Delete this route template?'))return;try{await json('/api/patrol-routes/'+id+'?tenant_id='+tenant,{method:'DELETE'});loadRoutes()}catch(e){show(e.message,false)}}
function reset(){$('routeId').value='';$('name').value='';$('description').value='';$('minutes').value='';$('strict').checked=true;$('formTitle').textContent='Create Route';$('cancel').style.display='none';loadCheckpoints()}function show(t,ok){$('message').textContent=t;$('message').className='status '+(ok?'success':'error')}
$('site').onchange=loadCheckpoints;$('save').onclick=saveRoute;$('cancel').onclick=reset;Promise.all([loadSites(),loadRoutes()]).catch(e=>show(e.message,false));
</script></body></html>
