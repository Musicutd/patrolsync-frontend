<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatrolSync Platform Console</title><style>body{font-family:Arial;max-width:430px;margin:70px auto;padding:20px;background:#0f172a;color:#e2e8f0}.card{background:#fff;color:#0f172a;border-radius:12px;padding:24px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:6px;border:1px solid #cbd5e1}button{background:#0f766e;color:#fff;border:0;font-weight:bold;cursor:pointer}.secondary{background:#64748b}.error{color:#dc2626}.ok{color:#15803d}.muted{color:#94a3b8;font-size:13px;text-align:center}</style></head><body><h2>PatrolSync Platform Console</h2><p class="muted">Private access for PatrolSync platform operators. Subscriber administrators must use the normal login.</p><div class="card"><div id="passwordStep"><input id="email" type="email" placeholder="Platform administrator email"><input id="password" type="password" placeholder="Password"><button onclick="startLogin()">Continue</button></div><div id="codeStep" style="display:none"><p id="codeMessage"></p><input id="code" maxlength="11" autocomplete="one-time-code" placeholder="6-digit code or recovery code"><button onclick="verifyCode()">Verify & Open Console</button><button class="secondary" onclick="cancelCode()">Cancel</button></div><p id="status"></p></div><script>const API='https://patrolsync-backend.onrender.com';let challenge=null;async function startLogin(){show('Checking credentials…');try{const r=await fetch(API+'/api/platform/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');challenge=d.challenge_token;document.getElementById('passwordStep').style.display='none';document.getElementById('codeStep').style.display='block';document.getElementById('codeMessage').textContent='Enter the code sent to '+d.masked_email+' or a saved recovery code.';document.getElementById('code').focus();show('Verification code sent.')}catch(e){show(e.message,true)}}async function verifyCode(){try{const r=await fetch(API+'/api/platform/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge_token:challenge,code:document.getElementById('code').value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.error||'Verification failed');localStorage.setItem('platform_token',d.token);localStorage.setItem('platform_admin_email',d.admin.email);location.href='platform_dashboard.html'}catch(e){show(e.message,true)}}function cancelCode(){challenge=null;document.getElementById('codeStep').style.display='none';document.getElementById('passwordStep').style.display='block';document.getElementById('code').value=''}function show(m,error=false){const s=document.getElementById('status');s.textContent=m;s.className=error?'error':'ok'}document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')startLogin()});document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')verifyCode()});</script></body></html>
