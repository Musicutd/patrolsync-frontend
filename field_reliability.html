<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Reliability | PatrolSync</title>
<link rel="stylesheet" href="patrolsync-module.css"><script>document.documentElement.dataset.theme=localStorage.getItem('patrolsync_theme')||'dark';</script><script src="patrolsync-module.js" defer></script>
<style>.fr-shell{max-width:1180px;margin:auto;padding:30px}.fr-top,.fr-hero,.fr-result{display:flex;align-items:center;justify-content:space-between;gap:16px}.fr-back{color:#2dd4bf;text-decoration:none;font-weight:800}.fr-theme,.fr-run{border:1px solid var(--ps-line,#2a3948);border-radius:9px;padding:11px 15px;font-weight:850;cursor:pointer}.fr-theme{background:var(--ps-panel,#111a24);color:var(--ps-text,#e8eef5)}.fr-run{background:#22c7b7;color:#052e2a;border:0}.fr-hero{margin:26px 0 12px}.fr-hero h1{font-size:32px;letter-spacing:-.04em;margin:0 0 5px}.fr-hero p,.fr-status,.fr-check p,.fr-result small{color:var(--ps-muted,#91a2b3)}.fr-status{min-height:24px}.fr-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.fr-card,.fr-panel{background:var(--ps-panel,#111a24);border:1px solid var(--ps-line,#2a3948);border-radius:14px}.fr-card{padding:18px}.fr-card span{display:block;color:var(--ps-muted,#91a2b3);font-size:13px}.fr-card strong{display:block;font-size:29px;margin-top:5px}.fr-panel{padding:20px}.fr-gate{font-size:21px;font-weight:900}.stage_2_ready,.pass{color:#21c58b}.action_required,.fail{color:#ff6369}.fr-checks{display:grid;gap:10px;margin-top:18px}.fr-check{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px;background:var(--ps-soft,#16222e);border:1px solid var(--ps-line,#2a3948);border-radius:10px}.fr-badge{text-transform:uppercase;font-size:11px;font-weight:900}.fr-check b{display:block;margin-bottom:4px}.fr-check p{margin:0;font-size:13px}.fr-empty{text-align:center;padding:34px;color:var(--ps-muted,#91a2b3)}@media(max-width:750px){.fr-shell{padding:16px}.fr-hero,.fr-result{align-items:flex-start;flex-direction:column}.fr-run{width:100%}.fr-metrics{grid-template-columns:repeat(2,1fr)}.fr-check{grid-template-columns:1fr}}</style></head>
<body class="ps-module-shell"><main class="fr-shell"><div class="fr-top"><a class="fr-back" href="dashboard.html">← Operations workspace</a><button id="themeButton" class="fr-theme" type="button" onclick="changeTheme()">☀ Light</button></div>
<section class="fr-hero"><div><h1>Field Reliability</h1><p>Validate NFC, QR, offline capture, retry safety, photo evidence, and tenant protection.</p></div><button class="fr-run" onclick="runGate()">Run Stage 2 gate</button></section><div id="status" class="fr-status"></div>
<section class="fr-metrics"><article class="fr-card"><span>Passed</span><strong id="passed">—</strong></article><article class="fr-card"><span>Failures</span><strong id="failures">—</strong></article><article class="fr-card"><span>Patrol scans</span><strong id="scans">—</strong></article><article class="fr-card"><span>Offline incidents</span><strong id="incidents">—</strong></article></section>
<section class="fr-panel"><div class="fr-result"><div><div id="gate" class="fr-gate">Not run</div><small id="generated">Run the validation after deploying the Stage 2 backend.</small></div><span id="duration"></span></div><div id="checks" class="fr-checks"><div class="fr-empty">No result yet.</div></div></section></main>
<script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');
function themeLabel(){$('themeButton').textContent=document.documentElement.dataset.theme==='dark'?'☀ Light':'☾ Dark'}function changeTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('patrolsync_theme',next);themeLabel()}
async function runGate(){$('status').textContent='Running field reliability checks…';try{const r=await fetch(API+'/api/field-reliability/readiness',{headers:{Authorization:'Bearer '+token}}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:await r.text()};if(!r.ok)throw Error(d.error||'Readiness check failed');render(d);$('status').textContent='Stage 2 checks completed.'}catch(e){$('status').textContent=e.message;$('status').className='fr-status fail'}}
function render(d){$('passed').textContent=d.summary.passed;$('failures').textContent=d.summary.failures;$('scans').textContent=d.activity.patrol_scans.total;$('incidents').textContent=d.activity.offline_incidents.total;const labels={stage_2_ready:'STAGE 2 READY',action_required:'ACTION REQUIRED'};$('gate').textContent=labels[d.status]||d.status;$('gate').className='fr-gate '+d.status;$('generated').textContent='Completed '+new Date(d.generated_at).toLocaleString();$('duration').textContent=d.duration_ms+' ms';$('checks').innerHTML=d.checks.map(c=>`<div class="fr-check"><span class="fr-badge ${c.status}">${c.status}</span><div><b>${esc(c.label)}</b><p>${esc(c.message)}</p></div></div>`).join('')}themeLabel();</script></body></html>
