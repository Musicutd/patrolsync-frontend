<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TrustProof Evidence Integrity</title>
  <style>
    :root{--bg:#f1f5f7;--card:#fff;--text:#15212c;--muted:#687683;--line:#d9e1e7;--teal:#13b8a6;--teal2:#087e73;--red:#dc3b45;--amber:#d98b12;--soft:#eef4f6}html[data-theme=dark]{color-scheme:dark;--bg:#090e13;--card:#10171e;--text:#e7edf2;--muted:#8d99a5;--line:#28333e;--soft:#151e26}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1320px;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.back{color:var(--teal2);text-decoration:none;font-weight:700}.theme{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.hero h1{font-size:30px;margin:0 0 4px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted)}.seal-actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:10px 14px;background:var(--teal);color:#062925;font-weight:800;cursor:pointer}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px}.metric{padding:17px}.metric small{color:var(--muted);display:block}.metric strong{font-size:28px;display:block;margin:7px 0}.bar{height:7px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.panel{padding:18px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}select,input{background:var(--card);border:1px solid var(--line);color:var(--text);padding:9px;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px;font-size:13px}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.sealed,.verified{background:#d9f8f3;color:#07796f}.tampered{background:#fee2e2;color:#b91c1c}.hash{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:30px}.status{min-height:22px;margin:10px 0;color:var(--muted)}.status.error{color:var(--red)}.status.ok{color:var(--teal2)}@media(max-width:800px){.shell{padding:16px}.hero{display:block}.seal-actions{margin-top:15px}.cards{grid-template-columns:1fr}.table-wrap{overflow:auto}.hero h1{font-size:25px}}
  </style>
  <script>const saved=localStorage.getItem('patrolsync_theme');document.documentElement.dataset.theme=saved||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');</script>
  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head>
<body class="ps-module-shell"><div class="shell">
  <div class="top"><a class="back" href="dashboard.html">← Operations workspace</a><button class="theme" onclick="toggleTheme()" id="themeBtn">Change theme</button></div>
  <div class="hero"><div><h1>TrustProof Evidence Integrity</h1><p>Seal operational evidence, verify original records, and detect changes after capture.</p></div><div class="seal-actions"><button onclick="sealBatch('patrol_scan')">Seal next 20 patrol scans</button><button onclick="sealBatch('incident_photo')">Seal next 20 incident photos</button><button class="secondary" onclick="refreshAll()">Refresh</button></div></div>
  <div id="status" class="status"></div>
  <div class="cards">
    <div class="metric"><small>Patrol scans sealed</small><strong id="patrolMetric">—</strong><div class="bar"><i id="patrolBar" style="width:0"></i></div></div>
    <div class="metric"><small>Incident photos sealed</small><strong id="photoMetric">—</strong><div class="bar"><i id="photoBar" style="width:0"></i></div></div>
    <div class="metric"><small>Ledger records</small><strong id="ledgerMetric">—</strong><small>Append-only integrity chain</small></div>
  </div>
  <div class="panel"><div class="filters"><select id="typeFilter"><option value="">All evidence</option><option value="patrol_scan">Patrol scans</option><option value="incident_photo">Incident photos</option></select><input id="search" placeholder="Search evidence ID or hash"><button class="secondary" onclick="render()">Filter</button></div><div class="table-wrap"><table><thead><tr><th>Sealed</th><th>Evidence</th><th>Source hash</th><th>Chain hash</th><th>Sealed by</th><th>Integrity</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id');let records=[];if(!token||!tenant)location.replace('login.html');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),short=v=>v?String(v).slice(0,12)+'…':'—';
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:await r.text()};if(!r.ok)throw Error(d.error||'Request failed');return d}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('patrolsync_theme',next);themeLabel()}
function themeLabel(){$('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀ Light':'☾ Dark'}
function metric(id,bar,data){const total=Number(data?.total||0),sealed=Number(data?.sealed||0);$(id).textContent=sealed+' / '+total;$(bar).style.width=(total?Math.round(sealed/total*100):100)+'%'}
async function refreshAll(quiet=false){if(!quiet)setStatus('Refreshing evidence ledger…');try{const [summary,list]=await Promise.all([api('/api/trustproof/summary/status?tenant_id='+tenant),api('/api/trustproof?tenant_id='+tenant)]);records=list;metric('patrolMetric','patrolBar',summary.patrol_scans);metric('photoMetric','photoBar',summary.incident_photos);$('ledgerMetric').textContent=list.length;render();if(!quiet)setStatus('Evidence ledger updated.','ok');return summary}catch(e){setStatus(e.message,'error');throw e}}
function render(){const type=$('typeFilter').value,q=$('search').value.trim().toLowerCase(),filtered=records.filter(r=>(!type||r.evidence_type===type)&&(!q||String(r.evidence_id).includes(q)||r.source_hash.toLowerCase().includes(q)||r.chain_hash.toLowerCase().includes(q)));$('rows').innerHTML=filtered.length?filtered.map(r=>`<tr><td>${esc(new Date(r.sealed_at).toLocaleString())}</td><td><b>${r.evidence_type==='patrol_scan'?'Patrol scan':'Incident photo'}</b><br>#${esc(r.evidence_id)}</td><td class="hash" title="${esc(r.source_hash)}">${short(r.source_hash)}</td><td class="hash" title="${esc(r.chain_hash)}">${short(r.chain_hash)}</td><td>${esc(r.sealed_by_email||'System')}</td><td><button class="secondary" onclick="verify(${Number(r.id)},this)">Verify now</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No sealed evidence found.</td></tr>'}
async function sealBatch(type){if(!confirm('Seal the next available 20 '+(type==='patrol_scan'?'patrol scans':'incident photos')+'? Sealed records become integrity baselines.'))return;setStatus('Creating TrustProof records…');try{const d=await api('/api/trustproof/seal-batch',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),evidence_type:type,limit:20})});await refreshAll(true);if(d.failed?.length){const examples=d.failed.slice(0,3).map(x=>'#'+x.id+': '+x.error).join(' | ');setStatus(`${d.sealed} sealed · ${d.failed.length} failed — ${examples}`,'error')}else setStatus(`${d.sealed} record(s) sealed and added to the integrity ledger.`,'ok')}catch(e){setStatus(e.message,'error')}}
async function verify(id,button){button.disabled=true;button.textContent='Checking…';try{const d=await api('/api/trustproof/'+id+'/verify',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant)})});button.className='badge '+d.status;button.textContent=d.status==='verified'?'✓ Verified':'⚠ Tampered';button.disabled=false;if(d.status!=='verified')setStatus('Integrity failure detected. Preserve the record and investigate before exporting it.','error')}catch(e){button.disabled=false;button.textContent='Retry';setStatus(e.message,'error')}}
function setStatus(message,kind=''){$('status').textContent=message;$('status').className='status '+kind}
$('typeFilter').onchange=render;$('search').oninput=render;themeLabel();refreshAll();
</script></body></html>
