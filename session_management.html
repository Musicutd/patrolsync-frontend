<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatrolSync Sessions</title><style>body{font-family:Arial;max-width:900px;margin:30px auto;padding:0 16px;background:#f8fafc;color:#0f172a}.card{background:#fff;border:1px solid #dbe3ee;border-radius:9px;padding:16px;margin:12px 0}.active{border-left:5px solid #16a34a}.current{background:#eff6ff}.muted{color:#64748b;font-size:13px}.badge{display:inline-block;padding:3px 9px;border-radius:12px;background:#e2e8f0;font-size:12px;font-weight:bold}button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}.danger{background:#dc2626}.error{color:#dc2626}.ok{color:#15803d}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Active Sessions & Devices</h2><p>Review where your administrator account is signed in and revoke anything you do not recognize.</p><button onclick="loadSessions()">Refresh</button> <button class="danger" onclick="revokeOthers()">Sign Out All Other Sessions</button><p id="status"></p><div id="sessions"></div><script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});function device(ua){if(!ua)return'Unknown device';let browser=/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Browser';let os=/Windows/.test(ua)?'Windows':/Android/.test(ua)?'Android':/iPhone|iPad/.test(ua)?'iOS':/Mac OS/.test(ua)?'macOS':/Linux/.test(ua)?'Linux':'Unknown OS';return browser+' on '+os}async function loadSessions(){try{const r=await fetch(API+'/api/security/sessions',{headers:headers()}),d=await r.json();if(r.status===401){localStorage.removeItem('token');location.replace('login.html');return}if(!r.ok)throw Error(d.error||'Could not load sessions');document.getElementById('sessions').innerHTML=d.sessions.length?d.sessions.map(s=>`<div class="card ${s.status==='active'?'active':''} ${s.current?'current':''}"><b>${esc(device(s.user_agent))}</b> ${s.current?'<span class="badge">This device</span>':''}<p>Status: ${esc(s.status)}<br>IP: ${esc(s.ip_address||'Unknown')}<br>Signed in: ${new Date(s.created_at).toLocaleString()}<br>Last activity: ${new Date(s.last_seen_at).toLocaleString()}<br>Expires: ${new Date(s.expires_at).toLocaleString()}</p>${s.status==='active'?`<button class="danger" onclick="revoke('${s.id}',${s.current})">${s.current?'Sign Out This Device':'Revoke Session'}</button>`:''}</div>`).join(''):'<div class="card">No tracked sessions yet. Sign out and log in again to create one.</div>'}catch(e){show(e.message,true)}}async function revoke(id,current){if(!confirm(current?'Sign out this device now?':'Revoke this session?'))return;try{const r=await fetch(API+'/api/security/sessions/'+id,{method:'DELETE',headers:headers()}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not revoke');if(current){localStorage.clear();location.replace('login.html');return}show('Session revoked.');loadSessions()}catch(e){show(e.message,true)}}async function revokeOthers(){if(!confirm('Sign out every other tracked administrator session?'))return;try{const r=await fetch(API+'/api/security/sessions/revoke-others',{method:'POST',headers:headers(),body:'{}'}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not revoke sessions');show(d.revoked_count+' other session(s) signed out.');loadSessions()}catch(e){show(e.message,true)}}function show(m,error=false){const s=document.getElementById('status');s.textContent=m;s.className=error?'error':'ok'}loadSessions();</script></body></html>
