<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Training</title><style>body{font-family:Arial;max-width:800px;margin:20px auto;padding:0 14px;background:#f8fafc}.item{background:#fff;border:1px solid #ddd;border-radius:9px;padding:16px;margin:12px 0}.content{white-space:pre-wrap;background:#f8fafc;padding:12px;max-height:320px;overflow:auto}.badge{padding:3px 8px;border-radius:10px;background:#e2e8f0}.done{border-left:6px solid #16a34a}.overdue{border-left:6px solid #dc2626}button{padding:11px;background:#2563eb;color:#fff;border:0;border-radius:5px}.error{color:red}</style>  <link rel="stylesheet" href="patrolsync-guard.css">
  <script src="patrolsync-guard-ui.js" defer></script>
</head><body class="ps-guard-page"><p><a href="guard.html">← Guard Dashboard</a></p><h2>My Training & Policies</h2><p id="error" class="error"></p><div id="list"></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];if(!token||!tenant)location.replace('guard.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function complete(id){const x=rows.find(a=>a.id==id),qs=x.questions||[],answers=[];for(const q of qs){const text=q.options.map((o,i)=>`${i+1}. ${o}`).join('\n'),v=prompt(q.question+'\n'+text);if(v===null)return;answers.push(Number(v)-1)}if(!confirm('I confirm that I have read and understood this material and accept this version.'))return;try{const r=await api('/api/training/assignments/'+id+'/complete',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),acknowledged:true,answers})});alert(r.status==='completed'?`Completed. Score: ${r.score}%`:`Not passed. Score: ${r.score}%. Please review and try again.`);load()}catch(e){alert(e.message)}}async function load(){try{rows=await api('/api/training/assignments?tenant_id='+tenant);$('list').innerHTML=rows.map(x=>`<div class="item ${x.status==='completed'?'done':x.due_at&&new Date(x.due_at)<Date.now()?'overdue':''}"><h3>${esc(x.title)} <span class="badge">${esc(x.material_type)} v${esc(x.version)}</span></h3><p>Status: <b>${esc(x.status)}</b>${x.score!=null?' · Score: '+x.score+'%':''}${x.due_at?' · Due: '+new Date(x.due_at).toLocaleString():''}</p><div class="content">${esc(x.content)}</div>${x.status!=='completed'?`<p><button onclick="complete(${x.id})">Acknowledge${(x.questions||[]).length?' & Take Quiz':''}</button></p>`:`<p>✓ Acknowledged ${new Date(x.acknowledged_at).toLocaleString()}</p>`}</div>`).join('')||'<p>No training or policies assigned.</p>';$('error').textContent=''}catch(e){$('error').textContent=e.message}}load();
</script></body></html>
