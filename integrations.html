<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integration Hub</title><style>body{font-family:Arial;max-width:1150px;margin:20px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,button{width:100%;padding:9px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;border-radius:5px}.row{padding:10px;border-bottom:1px solid #ddd}.secret{background:#111827;color:#fff;padding:12px;overflow:auto}.badge{padding:3px 8px;border-radius:10px;background:#e2e8f0}.error{color:red}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>API Keys & Webhooks</h2><div class="card"><h3>Create API Key</h3><div class="grid"><input id="keyName" placeholder="Key name, e.g. Payroll integration"><button id="createKey">Generate API Key</button></div><div id="newKey"></div><div id="keys"></div></div><div class="card"><h3>Add Webhook</h3><div class="grid"><input id="hookName" placeholder="Webhook name"><input id="hookUrl" type="url" placeholder="https://example.com/patrolsync"><select id="filter"><option value="*">All events</option><option value="POST /api/attendance">Attendance changes</option><option value="POST /api/dispatch">Dispatch events</option><option value="POST /api/incident">Incidents</option><option value="POST /api/patrol">Patrol events</option></select><button id="createHook">Add Webhook</button></div><div id="newSecret"></div><div id="hooks"></div></div><div class="card"><h3>Delivery History</h3><button onclick="load()">Refresh</button><div id="deliveries"></div></div><p id="status" class="error"></p><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function createKey(){try{const d=await api('/api/integrations/api-keys',{method:'POST',body:JSON.stringify({tenant_id:+tenant,name:$('keyName').value})});$('newKey').innerHTML=`<div class="secret"><b>Copy this API key now — it cannot be shown again:</b><br>${esc(d.api_key)}</div>`;load()}catch(e){$('status').textContent=e.message}}async function revoke(id){if(!confirm('Revoke this API key?'))return;await api('/api/integrations/api-keys/'+id+'/revoke',{method:'PATCH',body:JSON.stringify({tenant_id:+tenant})});load()}async function createHook(){try{const d=await api('/api/integrations/webhooks',{method:'POST',body:JSON.stringify({tenant_id:+tenant,name:$('hookName').value,url:$('hookUrl').value,event_filter:$('filter').value})});$('newSecret').innerHTML=`<div class="secret"><b>Copy this signing secret now:</b><br>${esc(d.signing_secret)}</div>`;load()}catch(e){$('status').textContent=e.message}}async function toggle(id,active){await api('/api/integrations/webhooks/'+id+'/toggle',{method:'PATCH',body:JSON.stringify({tenant_id:+tenant,active})});load()}async function test(id){await api('/api/integrations/webhooks/'+id+'/test',{method:'POST',body:JSON.stringify({tenant_id:+tenant})});alert('Test delivery queued.');setTimeout(load,2000)}async function load(){try{const d=await api('/api/integrations?tenant_id='+tenant);$('keys').innerHTML=d.api_keys.map(x=>`<div class="row"><b>${esc(x.name)}</b> · ${esc(x.key_prefix)}… <span class="badge">${x.active?'active':'revoked'}</span> · last used ${x.last_used_at?new Date(x.last_used_at).toLocaleString():'never'} ${x.active?`<button onclick="revoke(${x.id})">Revoke</button>`:''}</div>`).join('')||'<p>No API keys.</p>';$('hooks').innerHTML=d.webhooks.map(x=>`<div class="row"><b>${esc(x.name)}</b> · ${esc(x.url)} · filter ${esc(x.event_filter)} <span class="badge">${x.active?'active':'disabled'}</span><button onclick="test(${x.id})">Send Test</button><button onclick="toggle(${x.id},${!x.active})">${x.active?'Disable':'Enable'}</button></div>`).join('')||'<p>No webhooks.</p>';$('deliveries').innerHTML=d.deliveries.map(x=>`<div class="row"><b>${esc(x.event_type)}</b> → ${esc(x.webhook_name)} <span class="badge">${esc(x.status)}</span> · attempts ${x.attempts} · ${x.response_status||x.last_error||'queued'} · ${new Date(x.created_at).toLocaleString()}</div>`).join('')||'<p>No deliveries.</p>';$('status').textContent=''}catch(e){$('status').textContent=e.message}}$('createKey').onclick=createKey;$('createHook').onclick=createHook;load();
</script></body></html>
