<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatrolSync - My Timesheets</title><style>
body{font-family:Arial,sans-serif;max-width:760px;margin:25px auto;padding:0 16px;background:#f8fafc;color:#172033}a{color:#2563eb;text-decoration:none}.card{background:white;border:1px solid #dbe2ea;border-radius:10px;padding:17px;margin:15px 0}.row{display:flex;gap:10px}.row>div{flex:1}label{display:block;font-size:12px;font-weight:bold;margin:5px 0}input{width:100%;padding:9px;box-sizing:border-box}button{padding:10px 15px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer;margin-top:10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{background:#eff6ff;padding:12px;border-radius:8px}.metric strong{display:block;font-size:22px}.session{border-bottom:1px solid #e5e7eb;padding:10px 0;font-size:13px}.status{font-weight:bold;margin-top:10px}.error{color:#dc2626}.success{color:#16a34a}.badge{display:inline-block;padding:4px 9px;border-radius:12px;font-size:11px;font-weight:bold}.submitted{background:#dbeafe;color:#1e40af}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.history{border-bottom:1px solid #e5e7eb;padding:12px 0}.hint{color:#64748b;font-size:13px}@media(max-width:550px){.row{display:block}.summary{grid-template-columns:1fr}}
</style>  <link rel="stylesheet" href="patrolsync-guard.css">
  <script src="patrolsync-guard-ui.js" defer></script>
</head><body class="ps-guard-page"><p><a href="guard.html">← Back to Guard App</a></p><h2>My Timesheets</h2>
<div class="card"><h3>Review & Submit</h3><div class="row"><div><label>Period Start</label><input type="date" id="periodStart"></div><div><label>Period End</label><input type="date" id="periodEnd"></div></div><button onclick="previewTimesheet()">Review Hours</button><div id="previewStatus" class="status"></div><div id="previewArea"></div></div>
<div class="card"><h3>Submission History</h3><div id="history"></div></div>
<script>
const API_BASE='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenantId=localStorage.getItem('guard_tenant_id');if(!token||!tenantId)location.replace('guard.html');const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});const duration=s=>{s=Number(s)||0;return Math.floor(s/3600)+'h '+String(Math.floor((s%3600)/60)).padStart(2,'0')+'m'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setDefaultWeek(){const today=new Date(),day=(today.getDay()+6)%7,monday=new Date(today);monday.setDate(today.getDate()-day);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);periodStart.value=monday.toISOString().slice(0,10);periodEnd.value=sunday.toISOString().slice(0,10)}
async function previewTimesheet(){const status=document.getElementById('previewStatus'),area=document.getElementById('previewArea');status.textContent='';area.innerHTML='Loading…';try{const response=await fetch(API_BASE+'/api/timesheets/preview?tenant_id='+tenantId+'&period_start='+periodStart.value+'&period_end='+periodEnd.value,{headers:headers()});const data=await response.json();if(!response.ok)throw new Error(data.error||'Failed to review timesheet');area.innerHTML='<div class="summary"><div class="metric">Sessions<strong>'+data.session_count+'</strong></div><div class="metric">Breaks<strong>'+duration(data.break_seconds)+'</strong></div><div class="metric">Worked<strong>'+duration(data.worked_seconds)+'</strong></div></div><div>'+data.sessions.map(s=>'<div class="session"><strong>'+esc(s.site_name)+'</strong><br>'+new Date(s.clocked_in_at).toLocaleString()+' → '+new Date(s.clocked_out_at).toLocaleString()+' · '+duration(s.worked_seconds)+'</div>').join('')+'</div>'+(data.session_count?'<button onclick="submitTimesheet()">Submit for Approval</button>':'<p class="hint">No completed sessions in this period.</p>')}catch(err){area.innerHTML='';status.textContent=err.message;status.className='status error'}}
async function submitTimesheet(){if(!confirm('Submit this timesheet for approval?'))return;const status=document.getElementById('previewStatus');try{const response=await fetch(API_BASE+'/api/timesheets/submit',{method:'POST',headers:headers(),body:JSON.stringify({tenant_id:Number(tenantId),period_start:periodStart.value,period_end:periodEnd.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Submission failed');status.textContent='Timesheet submitted for approval.';status.className='status success';loadHistory()}catch(err){status.textContent=err.message;status.className='status error'}}
async function loadHistory(){const box=document.getElementById('history');try{const response=await fetch(API_BASE+'/api/timesheets?tenant_id='+tenantId,{headers:headers()});const rows=await response.json();if(!response.ok)throw new Error(rows.error||'Failed to load history');box.innerHTML=rows.length?rows.map(t=>'<div class="history"><span class="badge '+t.status+'">'+t.status.toUpperCase()+'</span> <strong>'+t.period_start.slice(0,10)+' to '+t.period_end.slice(0,10)+'</strong><br>'+t.session_count+' sessions · '+duration(t.worked_seconds)+' worked · '+duration(t.break_seconds)+' breaks'+(t.review_notes?'<p class="hint">Admin note: '+esc(t.review_notes)+'</p>':'')+'</div>').join(''):'<p class="hint">No submitted timesheets yet.</p>'}catch(err){box.innerHTML='<p class="error">'+esc(err.message)+'</p>'}}
setDefaultWeek();loadHistory();
</script></body></html>
