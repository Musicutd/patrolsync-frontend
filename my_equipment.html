<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Equipment</title><style>body{font-family:Arial;max-width:750px;margin:20px auto;padding:0 14px;background:#f8fafc}.item{background:#fff;border:1px solid #ddd;border-radius:9px;padding:15px;margin:12px 0}.badge{padding:3px 8px;border-radius:10px;background:#e2e8f0}button{padding:10px;background:#2563eb;color:#fff;border:0;border-radius:5px;margin:4px}.warn{background:#d97706}.danger{background:#dc2626}.error{color:red}</style></head><body><p><a href="guard.html">← Guard Dashboard</a></p><h2>My Equipment & Keys</h2><p id="error" class="error"></p><div id="list"></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('guard.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function act(id,action){let note='';if(action!=='acknowledge')note=prompt('Add details:')||'';try{await api('/api/asset-custody/'+id+'/guard-action',{method:'PATCH',body:JSON.stringify({tenant_id:+tenant,action,note})});load()}catch(e){alert(e.message)}}async function load(){try{const rows=await api('/api/asset-custody?tenant_id='+tenant+'&active=true');$('list').innerHTML=rows.map(x=>`<div class="item"><h3>${esc(x.asset_code)} — ${esc(x.asset_name)}</h3><p><span class="badge">${esc(x.asset_type)}</span> <span class="badge">${esc(x.status)}</span></p><p>Condition when issued: ${esc(x.condition)} · Site: ${esc(x.site_name||'Not specified')}</p>${x.status==='issued'?`<button onclick="act(${x.id},'acknowledge')">Acknowledge Receipt</button>`:''}${!['return_requested','reported_lost','reported_damaged'].includes(x.status)?`<button onclick="act(${x.id},'request_return')">Request Return</button><button class="warn" onclick="act(${x.id},'report_damaged')">Report Damaged</button><button class="danger" onclick="act(${x.id},'report_lost')">Report Lost</button>`:''}</div>`).join('')||'<p>No equipment or keys are currently assigned to you.</p>';$('error').textContent=''}catch(e){$('error').textContent=e.message}}load();
</script></body></html>
