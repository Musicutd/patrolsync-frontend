<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shift Handovers</title><style>body{font-family:Arial;max-width:1150px;margin:24px auto;padding:0 15px;background:#f8fafc}.card{background:white;border:1px solid #dbe2ea;border-radius:9px;padding:15px}select,button{padding:9px}button{background:#2563eb;color:white;border:0;border-radius:5px}.resolve{background:#16a34a}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px;background:#dbeafe}.fault,.attention{color:#b91c1c;font-weight:bold}@media(max-width:800px){table{display:block;overflow:auto}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Shift Handover Monitor</h2><div class="card"><select id="site"><option value="">All sites</option></select><select id="status"><option value="all">All statuses</option><option value="pending" selected>Pending</option><option value="acknowledged">Acknowledged</option><option value="resolved">Resolved</option></select><button id="refresh">Refresh</button><div id="summary"></div><table><thead><tr><th>Created</th><th>Site</th><th>Outgoing guard</th><th>Summary</th><th>Outstanding actions</th><th>Equipment</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),$=x=>document.getElementById(x);if(!token||!tenant)location.replace('login.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){const r=await fetch(API+u,{...o,headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function init(){const sites=await api('/api/sites?tenant_id='+tenant);$('site').innerHTML='<option value="">All sites</option>'+sites.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');load()}async function load(){let q='?tenant_id='+tenant+'&status='+$('status').value;if($('site').value)q+='&site_id='+$('site').value;try{const rows=await api('/api/handovers'+q);$('summary').textContent=rows.length+' handover(s) shown';$('body').innerHTML=rows.length?rows.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString())+'</td><td>'+esc(x.site_name)+'</td><td>'+esc(x.from_email)+'</td><td>'+esc(x.summary)+'</td><td>'+esc(x.outstanding_actions||'—')+'</td><td class="'+esc(x.equipment_status)+'">'+esc(x.equipment_status)+'</td><td><span class="badge">'+esc(x.status)+'</span><br><small>'+(x.acknowledged_email?'by '+esc(x.acknowledged_email):'')+'</small></td><td>'+(x.status!=='resolved'?'<button class="resolve" onclick="resolveHandover('+x.id+')">Resolve</button>':esc(x.resolution_notes||'Resolved'))+'</td></tr>').join(''):'<tr><td colspan="8">No matching handovers.</td></tr>'}catch(e){$('summary').textContent=e.message}}async function resolveHandover(id){const notes=prompt('Supervisor resolution notes:');if(!notes||!notes.trim())return;try{await api('/api/handovers/'+id+'/resolve',{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),resolution_notes:notes.trim()})});load()}catch(e){alert(e.message)}}$('refresh').onclick=load;$('site').onchange=load;$('status').onchange=load;init().catch(e=>$('summary').textContent=e.message);
</script></body></html>
