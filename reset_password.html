<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose New Password</title><style>body{font-family:Arial;max-width:440px;margin:70px auto;padding:20px}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#2563eb;color:white;border:0;border-radius:6px}.status{margin-top:12px}.error{color:red}.success{color:green}</style></head><body><h2>Choose a new password</h2><p>Use at least 10 characters with uppercase, lowercase and a number.</p><input id="password" type="password" placeholder="New password"><input id="confirm" type="password" placeholder="Confirm password"><button onclick="resetPassword()">Change Password</button><div id="status" class="status"></div><script>const API='https://patrolsync-backend.onrender.com',token=new URLSearchParams(location.search).get('token');async function resetPassword(){const s=document.getElementById('status'),p=document.getElementById('password').value;if(!token){s.textContent='Reset token is missing.';s.className='status error';return}if(p!==document.getElementById('confirm').value){s.textContent='Passwords do not match.';s.className='status error';return}s.textContent='Updating…';try{const r=await fetch(API+'/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})}),d=await r.json();if(!r.ok)throw Error(d.error||'Reset failed');s.innerHTML=d.message+' <a href="login.html">Log in</a>';s.className='status success'}catch(e){s.textContent=e.message;s.className='status error'}}</script></body></html>
