<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Service Tickets</title><style>body{font-family:Arial;max-width:1250px;margin:24px auto;padding:0 15px;background:#f8fafc;color:#172033}.card{background:#fff;border:1px solid #dbe2ea;border-radius:9px;padding:16px;margin:12px 0}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}select,input,textarea,button{padding:9px;box-sizing:border-box}button{border:0;border-radius:5px;background:#2563eb;color:white;cursor:pointer}.ticket{border-left:5px solid #64748b}.urgent{border-color:#dc2626}.high{border-color:#f97316}.meta{color:#64748b;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.comments{background:#f8fafc;padding:10px;border-radius:7px;margin-top:10px}.comment{border-bottom:1px solid #e2e8f0;padding:8px}.internal{background:#fff7ed}.error{color:#dc2626}@media(max-width:800px){.filters{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Client Requests & Service Tickets</h2><div class="card filters"><select id="status"><option value="all">All statuses</option><option>open</option><option>in_progress</option><option>waiting_client</option><option>resolved</option><option>closed</option></select><select id="priority"><option value="all">All priorities</option><option>urgent</option><option>high</option><option>normal</option><option>low</option></select><select id="site"><option value="">All sites</option></select><button id="refresh">Refresh Queue</button></div><p id="message" class="error"></p><div id="tickets"></div>
<script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'}),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');let users=[];async function api(path,o={}){const r=await fetch(API+path,{...o,headers:H()}),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():{error:`HTTP ${r.status}`};if(!r.ok)throw Error(d.error||'Request failed');return d}async function init(){const [sites,allUsers]=await Promise.all([api('/api/sites?tenant_id='+tenant),api('/api/users?tenant_id='+tenant)]);$('site').innerHTML='<option value="">All sites</option>'+sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');users=allUsers.filter(u=>u.role==='admin');load()}
async function load(){try{const q=`tenant_id=${tenant}&status=${$('status').value}&priority=${$('priority').value}${$('site').value?'&site_id='+$('site').value:''}`,rows=await api('/api/service-tickets?'+q);$('tickets').innerHTML=rows.length?rows.map(ticket).join(''):'<div class="card">No matching service tickets.</div>';$('message').textContent=''}catch(e){$('message').textContent=e.message}}
function ticket(t){const assigns='<option value="">Unassigned</option>'+users.map(u=>`<option value="${u.id}" ${Number(t.assigned_to)===Number(u.id)?'selected':''}>${esc(u.email)}</option>`).join('');return`<div class="card ticket ${esc(t.priority)}"><h3>${esc(t.reference_code)} — ${esc(t.subject)}</h3><p class="meta">${esc(t.client_email||'Client')} · ${esc(t.site_name)} · ${new Date(t.created_at).toLocaleString()} · ${esc(t.request_type)}</p><p>${esc(t.description)}</p><div class="row"><select id="priority-${t.id}">${['low','normal','high','urgent'].map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select><select id="status-${t.id}">${['open','in_progress','waiting_client','resolved','closed'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select><select id="assign-${t.id}">${assigns}</select><button onclick="update(${t.id})">Save Workflow</button><button onclick="comments(${t.id})">Conversation (${t.comment_count})</button></div><input id="resolution-${t.id}" value="${esc(t.resolution||'')}" placeholder="Resolution notes" style="width:100%;margin-top:8px"><div id="comments-${t.id}" class="comments" hidden></div></div>`}
async function update(id){try{await api('/api/service-tickets/'+id,{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant),priority:$('priority-'+id).value,status:$('status-'+id).value,assigned_to:$('assign-'+id).value?Number($('assign-'+id).value):null,resolution:$('resolution-'+id).value})});load()}catch(e){alert(e.message)}}async function comments(id){const box=$('comments-'+id);if(!box.hidden){box.hidden=true;return}try{const rows=await api('/api/service-tickets/'+id+'/comments');box.innerHTML=rows.map(c=>`<div class="comment ${c.internal?'internal':''}"><b>${esc(c.admin_email||c.client_email||c.author_type)}</b> ${c.internal?'(internal)':''}<br>${esc(c.comment)}<br><small>${new Date(c.created_at).toLocaleString()}</small></div>`).join('')+`<textarea id="comment-${id}" placeholder="Reply to client" style="width:100%;margin-top:8px"></textarea><label><input id="internal-${id}" type="checkbox"> Internal note (hidden from client)</label> <button onclick="reply(${id})">Add Comment</button>`;box.hidden=false}catch(e){alert(e.message)}}async function reply(id){try{await api('/api/service-tickets/'+id+'/comments',{method:'POST',body:JSON.stringify({comment:$('comment-'+id).value,internal:$('internal-'+id).checked})});comments(id);comments(id)}catch(e){alert(e.message)}}$('refresh').onclick=load;$('status').onchange=load;$('priority').onchange=load;$('site').onchange=load;init().catch(e=>$('message').textContent=e.message);</script></body></html>
