<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log</title>
<style>body{font-family:Arial,sans-serif;max-width:1200px;margin:24px auto;padding:0 16px;background:#f8fafc;color:#0f172a}.card{background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:16px;margin-top:16px}.filters{display:grid;grid-template-columns:1fr 150px 145px 145px auto;gap:8px}.filters input,.filters select,.filters button{padding:9px;border:1px solid #94a3b8;border-radius:5px}.filters button{background:#2563eb;color:white;border:0}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0;font-size:13px}.badge{font-weight:bold;padding:3px 7px;border-radius:10px;background:#dbeafe}.empty,.error{padding:20px;text-align:center}.error{color:#dc2626}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}table{display:block;overflow:auto}}</style></head>
<body><p><a href="dashboard.html">← Back to Dashboard</a></p><h2>Audit Log</h2><p>Trace successful changes made by administrators and guards.</p>
<div class="card"><div class="filters"><input id="search" placeholder="Search user, route, or details"><select id="action"><option value="">All actions</option><option>POST</option><option>PATCH</option><option>PUT</option><option>DELETE</option></select><input id="fromDate" type="date" title="From date"><input id="toDate" type="date" title="To date"><button id="refreshBtn">Search</button></div><div id="message"></div>
<table><thead><tr><th>Date & time</th><th>User</th><th>Role</th><th>Action</th><th>Resource</th><th>Record</th><th>Details</th><th>IP</th></tr></thead><tbody id="logBody"></tbody></table></div>
<script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id');
if(!token||!tenant)location.replace('login.html');
const H=()=>({'Authorization':'Bearer '+token});
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadLogs(){message.textContent='Loading…';const q=new URLSearchParams({tenant_id:tenant});if(search.value.trim())q.set('search',search.value.trim());if(action.value)q.set('action',action.value);if(fromDate.value)q.set('from_date',fromDate.value);if(toDate.value)q.set('to_date',toDate.value);try{const r=await fetch(API+'/api/audit-logs?'+q,{headers:H()}),rows=await r.json();if(!r.ok)throw Error(rows.error||'Failed to load audit log');logBody.innerHTML=rows.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString())+'</td><td>'+esc(x.user_email||('User #'+x.user_id))+'</td><td>'+esc(x.user_role)+'</td><td><span class="badge">'+esc(x.action)+'</span></td><td>'+esc(x.resource)+'</td><td>'+esc(x.entity_id||'—')+'</td><td title="'+esc(JSON.stringify(x.details))+'">'+esc(JSON.stringify(x.details).slice(0,100))+'</td><td>'+esc(x.ip_address||'—')+'</td></tr>').join('');if(!rows.length)logBody.innerHTML='<tr><td colspan="8" class="empty">No matching activity.</td></tr>';message.textContent=rows.length+' record(s) shown';message.className='';}catch(e){message.textContent=e.message;message.className='error';logBody.innerHTML=''}}
refreshBtn.onclick=loadLogs;[search,action,fromDate,toDate].forEach(el=>el.addEventListener('change',loadLogs));loadLogs();
</script></body></html>
