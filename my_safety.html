<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Safety Check</title><style>body{font-family:Arial;max-width:600px;margin:30px auto;padding:15px;background:#f8fafc;text-align:center}.card{background:#fff;border:1px solid #dbe2ea;border-radius:12px;padding:24px}.timer{font-size:38px;font-weight:bold;margin:18px}.danger{color:#dc2626}.safe{color:#15803d}.check{font-size:20px;padding:18px;width:100%;background:#16a34a;color:#fff;border:0;border-radius:8px}textarea{width:100%;padding:10px;box-sizing:border-box;margin:12px 0}.error{color:#dc2626}</style></head><body><p><a href="guard.html">← Guard Dashboard</a></p><div class="card"><h2>Lone-Worker Safety</h2><div id="state">Loading…</div><div id="timer" class="timer">--:--</div><p id="instructions"></p><textarea id="note" rows="2" placeholder="Optional welfare note"></textarea><button id="check" class="check">✓ I’m Safe — Check In</button><p id="status"></p></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id'),$=x=>document.getElementById(x);let current=null;if(!token||!tenant)location.replace('guard.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{current=await api('/api/lone-worker/current?tenant_id='+tenant);if(!current.active){$('state').textContent='No active safety check. Clock in at a configured site first.';$('timer').textContent='--:--';$('check').disabled=true;return}$('check').disabled=false;$('instructions').textContent=current.setting.instructions||'Check in before the timer expires.';render();$('status').textContent=''}catch(e){$('status').textContent=e.message;$('status').className='error'}}function render(){if(!current||!current.active)return;const left=new Date(current.escalates_at).getTime()-Date.now(),seconds=Math.max(0,Math.floor(left/1000)),m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');$('timer').textContent=m+':'+s;$('timer').className='timer '+(left<=0?'danger':'safe');$('state').textContent=left<=0?'Welfare check overdue — check in now':'Time remaining before escalation'}function loc(){return new Promise(resolve=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}),()=>resolve({}),{timeout:8000,maximumAge:30000}):resolve({}))}async function check(){try{$('status').textContent='Checking in…';const position=await loc();await api('/api/lone-worker/check-in',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),note:$('note').value,...position})});$('note').value='';$('status').textContent='Safety check recorded successfully.';$('status').className='safe';await load()}catch(e){$('status').textContent=e.message;$('status').className='error'}}$('check').onclick=check;load();setInterval(render,1000);setInterval(load,30000);
</script></body></html>
