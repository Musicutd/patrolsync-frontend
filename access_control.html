<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Access</title><style>body{font-family:Arial;max-width:1050px;margin:20px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,button{width:100%;padding:9px;box-sizing:border-box}.permissions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.permissions label{padding:8px;background:#f1f5f9}.permissions input{width:auto}button{background:#2563eb;color:#fff;border:0;border-radius:5px}.row{padding:12px;border-bottom:1px solid #ddd}.error{color:red}@media(max-width:700px){.grid,.permissions{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
  <style>
    body.ps-module-shell .grid{gap:10px}
    body.ps-module-shell .permissions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 16px}
    body.ps-module-shell .permissions label{display:flex;align-items:center;gap:9px;min-height:46px;padding:10px 12px!important;background:var(--pm-soft)!important;color:var(--pm-text)!important;border:1px solid var(--pm-border);border-radius:8px;text-transform:capitalize;cursor:pointer}
    body.ps-module-shell .permissions label:hover{border-color:var(--pm-teal-bright);background:color-mix(in srgb,var(--pm-teal) 8%,var(--pm-surface))!important}
    body.ps-module-shell .permissions input[type="checkbox"],
    body.ps-module-shell input[type="checkbox"]{flex:0 0 auto;width:17px!important;height:17px!important;min-height:0!important;margin:0;accent-color:var(--pm-teal)}
    body.ps-module-shell .row{padding:18px 0;border-bottom:1px solid var(--pm-border)!important;color:var(--pm-text)}
    body.ps-module-shell .row:last-child{border-bottom:0!important}
    body.ps-module-shell .row>b{display:block;margin-bottom:10px;font-size:15px}
    body.ps-module-shell .row>.job{margin-bottom:10px}
    body.ps-module-shell .row>label:not(.permissions label){display:flex;align-items:center;gap:8px;margin:11px 0}
    body.ps-module-shell #status{min-height:20px;color:var(--pm-green);font-weight:700}
    body.ps-module-shell #status.error{color:var(--pm-red)}
    @media(max-width:800px){body.ps-module-shell .permissions{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:520px){body.ps-module-shell .grid,body.ps-module-shell .permissions{grid-template-columns:1fr}}
  </style>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Staff Roles & Permissions</h2><div class="card"><h3>Create Staff Account</h3><div class="grid"><input id="email" type="email" placeholder="Staff email"><input id="password" type="password" placeholder="Temporary password (8+ characters)"><input id="job" placeholder="Job title, e.g. Dispatcher"></div><h4>Allowed modules</h4><div id="permissions" class="permissions"></div><button id="create">Create Staff Account</button><p id="status"></p></div><div class="card"><h3>Staff Accounts</h3><div id="list"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=x=>document.getElementById(x),keys=['scheduling','attendance','patrols','incidents','dispatch','safety','communications','training','assets','quality','clients','finance','analytics'],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('login.html');$('permissions').innerHTML=keys.map(k=>`<label><input type="checkbox" value="${k}"> ${k}</label>`).join('');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}function selected(root=document){return[...root.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value)}async function create(){try{await api('/api/staff-users',{method:'POST',body:JSON.stringify({tenant_id:+tenant,email:$('email').value,password:$('password').value,job_title:$('job').value,permissions:selected($('permissions'))})});$('status').textContent='Staff account created.';load()}catch(e){$('status').textContent=e.message;$('status').className='error'}}async function save(id){const row=document.querySelector(`[data-id="${id}"]`);try{await api('/api/staff-users/'+id,{method:'PATCH',body:JSON.stringify({tenant_id:+tenant,job_title:row.querySelector('.job').value,permissions:selected(row),account_active:row.querySelector('.active').checked})});load()}catch(e){alert(e.message)}}async function load(){try{const rows=await api('/api/staff-users?tenant_id='+tenant);$('list').innerHTML=rows.map(x=>`<div class="row" data-id="${x.id}"><b>${esc(x.email)}</b><input class="job" value="${esc(x.job_title||'')}"><div class="permissions">${keys.map(k=>`<label><input type="checkbox" value="${k}" ${(x.permissions||[]).includes(k)?'checked':''}> ${k}</label>`).join('')}</div><label><input class="active" type="checkbox" ${x.account_active?'checked':''} style="width:auto"> Account active</label><button onclick="save(${x.id})">Save Permissions</button></div>`).join('')||'<p>No staff accounts.</p>'}catch(e){$('status').textContent=e.message}}$('create').onclick=create;load();
function selected(root=document){return[...root.querySelectorAll('input[type=checkbox][value]:checked')].map(x=>x.value)}</script></body></html>
