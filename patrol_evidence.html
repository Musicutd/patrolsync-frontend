<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrol Scan Evidence</title><style>body{font-family:Arial;max-width:1250px;margin:24px auto;padding:0 15px;background:#f8fafc}.card{background:white;border:1px solid #dbe2ea;border-radius:9px;padding:16px}.filters{display:grid;grid-template-columns:1fr 170px 145px 145px auto;gap:8px}input,select,button{padding:9px;box-sizing:border-box}button{border:0;border-radius:5px;background:#2563eb;color:white}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.badge{padding:3px 8px;border-radius:10px;font-weight:bold}.inside{background:#dcfce7;color:#166534}.outside{background:#fee2e2;color:#991b1b}.unavailable{background:#fef3c7;color:#92400e}.recorded{background:#dbeafe;color:#1e40af}.summary{font-weight:bold;margin:12px 0}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}table{display:block;overflow:auto}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Patrol Scan Evidence</h2><p>Review where and when each checkpoint scan was recorded.</p><div class="card"><div class="filters"><select id="site"><option value="">All sites</option></select><select id="status"><option value="">All location results</option><option value="inside">Inside geofence</option><option value="outside">Outside geofence</option><option value="recorded">GPS recorded</option><option value="unavailable">GPS unavailable</option></select><input id="from" type="date"><input id="to" type="date"><button id="refresh">Refresh</button></div><div id="summary" class="summary"></div><table><thead><tr><th>Scan time</th><th>Guard</th><th>Site / checkpoint</th><th>Route run</th><th>GPS result</th><th>Accuracy</th><th>Server delay</th><th>Map</th></tr></thead><tbody id="body"></tbody></table></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),H=()=>({'Authorization':'Bearer '+token}),$=x=>document.getElementById(x);if(!token||!tenant)location.replace('login.html');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u){const r=await fetch(API+u,{headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){const sites=await api('/api/sites?tenant_id='+tenant);$('site').innerHTML='<option value="">All sites</option>'+sites.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');load()}
async function load(){let q='?tenant_id='+tenant;if($('site').value)q+='&site_id='+$('site').value;if($('status').value)q+='&location_status='+$('status').value;if($('from').value)q+='&from_date='+$('from').value;if($('to').value)q+='&to_date='+$('to').value;try{const rows=await api('/api/patrol-evidence'+q),flags=rows.filter(x=>x.location_status==='outside'||x.location_status==='unavailable').length;$('summary').textContent=rows.length+' scans · '+flags+' requiring review';$('body').innerHTML=rows.length?rows.map(x=>{const delay=x.received_at&&x.device_scanned_at?Math.max(0,Math.round((new Date(x.received_at)-new Date(x.device_scanned_at))/60000))+' min':'—',map=x.latitude&&x.longitude?'<a target="_blank" href="https://www.google.com/maps?q='+x.latitude+','+x.longitude+'">View map</a>':'—';return '<tr><td>'+esc(new Date(x.scanned_at).toLocaleString())+'</td><td>'+esc(x.guard_email)+'</td><td>'+esc(x.site_name)+'<br><small>'+esc(x.checkpoint_name)+'</small></td><td>'+(x.patrol_run_id?'#'+x.patrol_run_id+' '+esc(x.route_name||''):'Unscheduled')+'</td><td><span class="badge '+esc(x.location_status)+'">'+esc(x.location_status)+'</span>'+(x.distance_m!==null?'<br>'+Math.round(x.distance_m)+'m from site':'')+'</td><td>'+(x.accuracy_m!==null?Math.round(x.accuracy_m)+'m':'—')+'</td><td>'+delay+'</td><td>'+map+'</td></tr>'}).join(''):'<tr><td colspan="8">No scan evidence found.</td></tr>'}catch(e){$('summary').textContent=e.message}}
$('refresh').onclick=load;[$('site'),$('status'),$('from'),$('to')].forEach(x=>x.onchange=load);init().catch(e=>$('summary').textContent=e.message);
</script></body></html>
