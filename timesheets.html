<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatrolSync - Timesheet Approvals</title><style>
body{font-family:Arial,sans-serif;max-width:1100px;margin:28px auto;padding:0 18px;background:#f8fafc;color:#172033}a{color:#2563eb;text-decoration:none}.card{background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:18px;margin:15px 0}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filters>div{flex:1;min-width:180px}label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}select{width:100%;padding:9px}button{padding:9px 13px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}.approve{background:#16a34a}.reject{background:#dc2626}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #e5e7eb;font-size:13px}.badge{display:inline-block;padding:4px 9px;border-radius:12px;font-size:11px;font-weight:bold}.submitted{background:#dbeafe;color:#1e40af}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.error{color:#dc2626;font-weight:bold}.hint{color:#64748b}@media(max-width:700px){table{display:block;overflow:auto}}
</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Back to Dashboard</a></p><h2>Timesheet Approvals</h2><div class="card filters"><div><label>Guard</label><select id="guardFilter"><option value="">All guards</option></select></div><div><label>Status</label><select id="statusFilter"><option value="">All statuses</option><option value="submitted">Awaiting approval</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div><button onclick="loadTimesheets()">Refresh</button></div><div class="card"><div id="pageStatus"></div><table><thead><tr><th>Guard</th><th>Period</th><th>Sessions</th><th>Break</th><th>Worked</th><th>Status</th><th>Review</th></tr></thead><tbody id="body"></tbody></table></div>
<script>
const API_BASE='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenantId=localStorage.getItem('tenant_id');if(!token||!tenantId)location.replace('login.html');const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});const duration=s=>{s=Number(s)||0;return Math.floor(s/3600)+'h '+String(Math.floor((s%3600)/60)).padStart(2,'0')+'m'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadGuards(){const response=await fetch(API_BASE+'/api/users?tenant_id='+tenantId+'&role=guard',{headers:headers()}),guards=await response.json();guards.forEach(g=>guardFilter.add(new Option(g.email,g.id)))}
async function loadTimesheets(){let url=API_BASE+'/api/timesheets?tenant_id='+tenantId;if(guardFilter.value)url+='&user_id='+guardFilter.value;if(statusFilter.value)url+='&status='+statusFilter.value;const tbody=document.getElementById('body'),status=document.getElementById('pageStatus');tbody.innerHTML='<tr><td colspan="7">Loading…</td></tr>';status.textContent='';try{const response=await fetch(url,{headers:headers()}),rows=await response.json();if(!response.ok)throw new Error(rows.error||'Failed to load timesheets');tbody.innerHTML=rows.length?'':'<tr><td colspan="7" class="hint">No timesheets found.</td></tr>';rows.forEach(t=>{const actions=t.status==='submitted'?'<button class="approve">Approve</button> <button class="reject">Reject</button>':esc(t.review_notes||'—');const tr=document.createElement('tr');tr.innerHTML='<td>'+esc(t.guard_email)+'</td><td>'+t.period_start.slice(0,10)+'<br>to '+t.period_end.slice(0,10)+'</td><td>'+t.session_count+'</td><td>'+duration(t.break_seconds)+'</td><td><strong>'+duration(t.worked_seconds)+'</strong></td><td><span class="badge '+t.status+'">'+t.status.toUpperCase()+'</span></td><td>'+actions+'</td>';if(t.status==='submitted'){const buttons=tr.querySelectorAll('button');buttons[0].onclick=()=>review(t.id,'approved');buttons[1].onclick=()=>review(t.id,'rejected')}tbody.appendChild(tr)})}catch(err){tbody.innerHTML='';status.textContent=err.message;status.className='error'}}
async function review(id,status){let notes='';if(status==='rejected'){notes=prompt('Reason for rejection:')||'';if(!notes.trim())return}else notes=prompt('Approval note (optional):')||'';try{const response=await fetch(API_BASE+'/api/timesheets/'+id+'/review',{method:'PATCH',headers:headers(),body:JSON.stringify({tenant_id:Number(tenantId),status,review_notes:notes})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Review failed');loadTimesheets()}catch(err){pageStatus.textContent=err.message;pageStatus.className='error'}}
loadGuards().then(loadTimesheets);
</script></body></html>
