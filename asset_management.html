<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Management</title><style>body{font-family:Arial;max-width:1200px;margin:20px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea,button{width:100%;padding:9px;box-sizing:border-box}button{background:#2563eb;color:white;border:0;border-radius:5px}.row{padding:11px;border-bottom:1px solid #ddd}.badge{padding:3px 8px;border-radius:10px;background:#e2e8f0}.error{color:red}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Equipment, Keys & Vehicles</h2><div class="card"><h3>Add Asset</h3><div class="grid"><input id="name" placeholder="Asset name"><input id="code" placeholder="Unique code / registration"><select id="type"><option>equipment</option><option>key</option><option>vehicle</option><option>uniform</option><option>device</option><option>other</option></select><select id="condition"><option>good</option><option>fair</option><option>new</option><option>damaged</option></select><select id="site"><option value="">No fixed site</option></select></div><textarea id="notes" placeholder="Notes"></textarea><button id="add">Add Asset</button><p id="status"></p></div><div class="card"><h3>Issue Asset</h3><div class="grid"><select id="asset"><option value="">Available asset</option></select><select id="guard"><option value="">Guard</option></select></div><input id="issueNote" placeholder="Issue note (optional)"><button id="issue">Issue to Guard</button></div><div class="card"><h3>Asset Register</h3><div id="assets"></div></div><div class="card"><h3>Custody & Return Requests</h3><div id="custody"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];if(!token||!tenant)location.replace('login.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}function show(m,c='error'){$('status').textContent=m;$('status').className=c}async function setup(){const[u,s]=await Promise.all([api('/api/users?tenant_id='+tenant),api('/api/sites?tenant_id='+tenant)]),guards=(Array.isArray(u)?u:u.users||[]).filter(x=>x.role==='guard'),sites=Array.isArray(s)?s:s.sites||[];$('guard').innerHTML='<option value="">Guard</option>'+guards.map(x=>`<option value="${x.id}">${esc(x.email)}</option>`).join('');$('site').innerHTML='<option value="">No fixed site</option>'+sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}async function add(){try{await api('/api/assets',{method:'POST',body:JSON.stringify({tenant_id:+tenant,name:$('name').value,asset_code:$('code').value,asset_type:$('type').value,condition:$('condition').value,site_id:$('site').value?+$('site').value:null,notes:$('notes').value})});show('Asset added.','');load()}catch(e){show(e.message)}}async function issue(){try{await api('/api/asset-custody/issue',{method:'POST',body:JSON.stringify({tenant_id:+tenant,asset_id:+$('asset').value,user_id:+$('guard').value,admin_note:$('issueNote').value})});show('Asset issued and guard notified.','');load()}catch(e){show(e.message)}}async function returned(id){const condition=prompt('Return condition: good, fair or damaged','good');if(!condition)return;try{await api('/api/asset-custody/'+id+'/confirm-return',{method:'PATCH',body:JSON.stringify({tenant_id:+tenant,return_condition:condition})});load()}catch(e){alert(e.message)}}async function load(){try{const[a,c]=await Promise.all([api('/api/assets?tenant_id='+tenant),api('/api/asset-custody?tenant_id='+tenant)]);all=a;$('asset').innerHTML='<option value="">Available asset</option>'+a.filter(x=>x.status==='available').map(x=>`<option value="${x.id}">${esc(x.asset_code+' — '+x.name)}</option>`).join('');$('assets').innerHTML=a.map(x=>`<div class="row"><b>${esc(x.asset_code)} — ${esc(x.name)}</b> <span class="badge">${esc(x.asset_type)}</span> <span class="badge">${esc(x.status)}</span> · condition ${esc(x.condition)} · ${esc(x.site_name||'No fixed site')}</div>`).join('')||'<p>No assets.</p>';$('custody').innerHTML=c.map(x=>`<div class="row"><b>${esc(x.asset_name)}</b> → ${esc(x.guard_email)} <span class="badge">${esc(x.status)}</span> · issued ${new Date(x.issued_at).toLocaleString()}${x.guard_note?'<p>Guard: '+esc(x.guard_note)+'</p>':''}${x.status!=='returned'?`<button onclick="returned(${x.id})">Confirm Return</button>`:''}</div>`).join('')||'<p>No custody records.</p>'}catch(e){show(e.message)}}$('add').onclick=add;$('issue').onclick=issue;setup().then(load).catch(e=>show(e.message));
</script></body></html>
