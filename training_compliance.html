<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Compliance</title><style>body{font-family:Arial;max-width:1200px;margin:20px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea,button{width:100%;padding:9px;box-sizing:border-box;margin:4px 0}button{background:#2563eb;color:#fff;border:0;border-radius:5px}.item{padding:12px;border-bottom:1px solid #ddd}.quiz{border:1px solid #cbd5e1;border-radius:7px;padding:12px;margin:8px 0;background:#f8fafc}.badge{padding:3px 7px;border-radius:10px;background:#e2e8f0;font-size:12px}.error{color:red}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head><body class="ps-module-shell"><p><a href="dashboard.html">← Dashboard</a></p><h2>Training & Policy Compliance</h2><div class="card"><h3>Create Material</h3><div class="grid"><label>Title<input id="title"></label><label>Type<select id="type"><option value="training">Training</option><option value="policy">Policy</option><option value="post_order">Post order</option></select></label><label>Version<input id="version" value="1.0"></label><label>Passing score<input id="score" type="number" value="80" min="0" max="100"></label><label>Applicable site<select id="materialSite"><option value="">All sites</option></select></label></div><label><b>Content guards must read</b><textarea id="content" rows="7" placeholder="Write the full training, policy or post order"></textarea></label><h4>Quiz Questions (optional)</h4><div id="quizBuilder"></div><button type="button" id="addQuestion" style="background:#64748b">+ Add Question</button><button id="create">Create Material</button><p id="status"></p></div><div class="card"><h3>Materials & Assignments</h3><div class="grid"><select id="audience"><option value="all_guards">All guards</option><option value="site">Guards at site</option><option value="specific_guard">Specific guard</option></select><select id="target"><option value="">Select target when required</option></select><label>Deadline<input id="due" type="datetime-local"></label><label><input id="mandatory" type="checkbox" checked style="width:auto"> Mandatory</label></div><div id="materials"></div></div><div class="card"><h3>Compliance Monitor</h3><button id="refresh">Refresh</button><div id="assignments"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let guards=[],sites=[];if(!token||!tenant)location.replace('login.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}function show(m,c='error'){$('status').textContent=m;$('status').className=c}function addQuestion(){const b=document.createElement('div');b.className='quiz';b.innerHTML=`<label><b>Question</b><input class="qtext" placeholder="Type the question"></label><div class="grid"><label>Answer 1<input class="qopt"></label><label>Answer 2<input class="qopt"></label><label>Answer 3 (optional)<input class="qopt"></label><label>Answer 4 (optional)<input class="qopt"></label></div><label>Correct answer<select class="qcorrect"><option value="0">Answer 1</option><option value="1">Answer 2</option><option value="2">Answer 3</option><option value="3">Answer 4</option></select></label><button type="button" style="background:#dc2626" onclick="this.parentElement.remove()">Remove</button>`;$('quizBuilder').appendChild(b)}function questions(){return[...document.querySelectorAll('.quiz')].map(b=>{const question=b.querySelector('.qtext').value.trim(),raw=[...b.querySelectorAll('.qopt')].map(x=>x.value.trim()),selected=Number(b.querySelector('.qcorrect').value),options=raw.filter(Boolean);if(!question)throw Error('Enter text for every question.');if(options.length<2)throw Error('Each question needs at least two answers.');if(!raw[selected])throw Error('The selected correct answer is empty.');return{question,options,correct_index:raw.slice(0,selected).filter(Boolean).length}})}async function options(){const[u,s]=await Promise.all([api('/api/users?tenant_id='+tenant),api('/api/sites?tenant_id='+tenant)]);guards=(Array.isArray(u)?u:u.users||[]).filter(x=>x.role==='guard');sites=Array.isArray(s)?s:s.sites||[];$('materialSite').innerHTML='<option value="">All sites</option>'+sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');target()}function target(){const a=$('audience').value;$('target').innerHTML='<option value="">Select target when required</option>'+(a==='site'?sites:guards).map(x=>`<option value="${x.id}">${esc(x.name||x.email)}</option>`).join('');$('target').disabled=a==='all_guards'}async function create(){try{await api('/api/training/materials',{method:'POST',body:JSON.stringify({tenant_id:+tenant,title:$('title').value,material_type:$('type').value,version:$('version').value,content:$('content').value,site_id:$('materialSite').value?+$('materialSite').value:null,questions:questions(),passing_score:+$('score').value})});show('Material created.','');$('title').value='';$('content').value='';$('quizBuilder').innerHTML='';load()}catch(e){show(e.message)}}async function assign(id){try{const a=$('audience').value,v=+$('target').value,d=await api('/api/training/materials/'+id+'/assign',{method:'POST',body:JSON.stringify({tenant_id:+tenant,audience:a,user_id:a==='specific_guard'?v:null,site_id:a==='site'?v:null,due_at:$('due').value||null,mandatory:$('mandatory').checked})});show(`Assigned to ${d.assigned} guard(s).`,'');load()}catch(e){show(e.message)}}async function load(){try{const[m,a]=await Promise.all([api('/api/training/materials?tenant_id='+tenant),api('/api/training/assignments?tenant_id='+tenant)]);$('materials').innerHTML=m.map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="badge">${esc(x.material_type)} v${esc(x.version)}</span><p>${x.assigned_count} assigned · ${x.completed_count} completed · ${(x.questions||[]).length} questions</p><button onclick="assign(${x.id})">Assign Using Options Above</button></div>`).join('')||'<p>No materials.</p>';$('assignments').innerHTML=a.map(x=>`<div class="item"><b>${esc(x.guard_email)}</b> — ${esc(x.title)} <span class="badge">${esc(x.status)}</span> · score ${x.score??'—'} · due ${x.due_at?new Date(x.due_at).toLocaleString():'none'}</div>`).join('')||'<p>No assignments.</p>'}catch(e){show(e.message)}}$('addQuestion').onclick=addQuestion;$('create').onclick=create;$('refresh').onclick=load;$('audience').onchange=target;options().then(load).catch(e=>show(e.message));
</script></body></html>
