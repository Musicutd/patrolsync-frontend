<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Compliance</title><style>body{font-family:Arial;max-width:1200px;margin:20px auto;padding:0 14px;background:#f8fafc}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea,button{width:100%;padding:9px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;border-radius:5px}.item{padding:12px;border-bottom:1px solid #ddd}.badge{padding:3px 7px;border-radius:10px;background:#e2e8f0;font-size:12px}.error{color:red}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><p><a href="dashboard.html">← Dashboard</a></p><h2>Training & Policy Compliance</h2><div class="card"><h3>Create Material</h3><div class="grid"><input id="title" placeholder="Title"><select id="type"><option value="training">Training</option><option value="policy">Policy</option><option value="post_order">Post order</option></select><input id="version" value="1.0" placeholder="Version"><input id="score" type="number" value="80" min="0" max="100" placeholder="Passing score"><select id="materialSite"><option value="">All sites</option></select></div><textarea id="content" rows="7" placeholder="Full training, policy, or post-order content"></textarea><textarea id="questions" rows="4" placeholder='Optional quiz JSON: [{"question":"What is the emergency number?","options":["112","999"],"correct_index":0}]'></textarea><button id="create">Create Material</button><p id="status"></p></div><div class="card"><h3>Materials & Assignments</h3><div class="grid"><select id="audience"><option value="all_guards">All guards</option><option value="site">Guards at site</option><option value="specific_guard">Specific guard</option></select><select id="target"><option value="">Select target when required</option></select><input id="due" type="datetime-local"><label><input id="mandatory" type="checkbox" checked style="width:auto"> Mandatory</label></div><div id="materials"></div></div><div class="card"><h3>Compliance Monitor</h3><button id="refresh">Refresh</button><div id="assignments"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('token'),tenant=localStorage.getItem('tenant_id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let guards=[],sites=[];if(!token||!tenant)location.replace('login.html');async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}function show(m,c='error'){$('status').textContent=m;$('status').className=c}async function options(){const [u,s]=await Promise.all([api('/api/users?tenant_id='+tenant),api('/api/sites?tenant_id='+tenant)]);guards=(Array.isArray(u)?u:u.users||[]).filter(x=>x.role==='guard');sites=Array.isArray(s)?s:s.sites||[];$('materialSite').innerHTML='<option value="">All sites</option>'+sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');target()}function target(){const a=$('audience').value;$('target').innerHTML='<option value="">Select target when required</option>'+(a==='site'?sites:guards).map(x=>`<option value="${x.id}">${esc(x.name||x.email)}</option>`).join('');$('target').disabled=a==='all_guards'}async function create(){try{let q=[];if($('questions').value.trim())q=JSON.parse($('questions').value);await api('/api/training/materials',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),title:$('title').value,material_type:$('type').value,version:$('version').value,content:$('content').value,site_id:$('materialSite').value?Number($('materialSite').value):null,questions:q,passing_score:Number($('score').value)})});show('Material created.','');load()}catch(e){show(e.message)}}async function assign(id){try{const a=$('audience').value,v=Number($('target').value);const d=await api('/api/training/materials/'+id+'/assign',{method:'POST',body:JSON.stringify({tenant_id:Number(tenant),audience:a,user_id:a==='specific_guard'?v:null,site_id:a==='site'?v:null,due_at:$('due').value||null,mandatory:$('mandatory').checked})});show(`Assigned to ${d.assigned} guard(s).`,'');load()}catch(e){show(e.message)}}async function load(){try{const [m,a]=await Promise.all([api('/api/training/materials?tenant_id='+tenant),api('/api/training/assignments?tenant_id='+tenant)]);$('materials').innerHTML=m.map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="badge">${esc(x.material_type)} v${esc(x.version)}</span><p>${x.assigned_count} assigned · ${x.completed_count} completed</p><button onclick="assign(${x.id})">Assign Using Options Above</button></div>`).join('')||'<p>No materials.</p>';$('assignments').innerHTML=a.map(x=>`<div class="item"><b>${esc(x.guard_email)}</b> — ${esc(x.title)} <span class="badge">${esc(x.status)}</span> · score ${x.score??'—'} · due ${x.due_at?new Date(x.due_at).toLocaleString():'none'}</div>`).join('')||'<p>No assignments.</p>'}catch(e){show(e.message)}}$('create').onclick=create;$('refresh').onclick=load;$('audience').onchange=target;options().then(load).catch(e=>show(e.message));
</script></body></html>
