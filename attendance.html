<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatrolSync - Attendance</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1180px;margin:30px auto;padding:0 18px;background:#f8fafc;color:#172033}a{color:#2563eb;text-decoration:none}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.trustproof-link{display:inline-flex;align-items:center;padding:10px 14px;background:#0f9b8e;color:#fff;border-radius:7px;font-weight:bold;box-shadow:0 4px 12px #0f9b8e33}.card{background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:18px;margin:16px 0}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filters>div{flex:1;min-width:170px}label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}input,select{width:100%;padding:9px;box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#eff6ff;border-radius:8px;padding:14px}.metric strong{display:block;font-size:24px;margin-top:5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #e5e7eb;font-size:13px}.badge{display:inline-block;padding:4px 9px;border-radius:12px;font-size:11px;font-weight:bold}.live{background:#dcfce7;color:#166534}.break{background:#fef3c7;color:#92400e}.done{background:#e2e8f0;color:#475569}.error{color:#dc2626;font-weight:bold}.empty{color:#64748b;padding:15px 0}@media(max-width:700px){.summary{grid-template-columns:1fr}table{display:block;overflow:auto}.page-head{align-items:flex-start;flex-direction:column}.trustproof-link{width:100%;justify-content:center}}
  </style>
  <link rel="stylesheet" href="patrolsync-module.css">
  <script src="patrolsync-module.js" defer></script>
</head>
<body class="ps-module-shell">
  <p><a href="dashboard.html">← Back to Dashboard</a></p>
  <div class="page-head"><h2>Attendance & Time Clock</h2><a class="trustproof-link" href="trustproof.html">◇ Open TrustProof Evidence</a></div>
  <div class="card filters">
    <div><label>Date</label><input type="date" id="dateFilter"></div>
    <div><label>Guard</label><select id="guardFilter"><option value="">All guards</option></select></div>
    <div><label>Site</label><select id="siteFilter"><option value="">All sites</option></select></div>
    <button onclick="loadAttendance()">Refresh</button>
  </div>
  <div class="summary">
    <div class="metric">Currently clocked in<strong id="activeCount">0</strong></div>
    <div class="metric">Currently on break<strong id="breakCount">0</strong></div>
    <div class="metric">Worked hours shown<strong id="workedTotal">0.00</strong></div>
  </div>
  <div class="card">
    <div id="status"></div>
    <table><thead><tr><th>Guard</th><th>Site</th><th>Clock In</th><th>Clock Out</th><th>Break</th><th>Worked</th><th>Location</th><th>Status</th></tr></thead><tbody id="attendanceBody"></tbody></table>
  </div>
  <script>
    const API_BASE='https://patrolsync-backend.onrender.com';
    const token=localStorage.getItem('token'); const tenantId=localStorage.getItem('tenant_id');
    if(!token||!tenantId) window.location.replace('login.html');
    function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}
    function duration(seconds){seconds=Math.max(0,Number(seconds)||0);const h=Math.floor(seconds/3600);const m=Math.floor((seconds%3600)/60);return h+'h '+String(m).padStart(2,'0')+'m'}
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    async function loadFilters(){
      const [guardsResponse,sitesResponse]=await Promise.all([fetch(API_BASE+'/api/users?tenant_id='+tenantId+'&role=guard',{headers:headers()}),fetch(API_BASE+'/api/sites?tenant_id='+tenantId,{headers:headers()})]);
      const guards=await guardsResponse.json(),sites=await sitesResponse.json();
      guards.forEach(g=>guardFilter.add(new Option(g.email,g.id))); sites.forEach(s=>siteFilter.add(new Option(s.name,s.id)));
    }
    async function loadAttendance(){
      const status=document.getElementById('status'),body=document.getElementById('attendanceBody');status.textContent='';body.innerHTML='<tr><td colspan="8">Loading...</td></tr>';
      let url=API_BASE+'/api/attendance?tenant_id='+tenantId;if(dateFilter.value)url+='&date='+dateFilter.value;if(guardFilter.value)url+='&user_id='+guardFilter.value;if(siteFilter.value)url+='&site_id='+siteFilter.value;
      try{const response=await fetch(url,{headers:headers()});const rows=await response.json();if(!response.ok)throw new Error(rows.error||'Failed to load attendance');
        body.innerHTML='';let active=0,onBreak=0,total=0;rows.forEach(row=>{if(!row.clocked_out_at)active++;if(row.on_break)onBreak++;total+=Number(row.worked_seconds||0);
          const isActive=!row.clocked_out_at;const tr=document.createElement('tr');const badge=row.on_break?'<span class="badge break">On Break</span>':(isActive?'<span class="badge live">Clocked In</span>':'<span class="badge done">Completed</span>');
          const locationProof=row.clock_in_geofence_verified===true?'<span class="badge live">Verified · '+Math.round(Number(row.clock_in_distance_m||0))+'m</span>':(row.clock_in_latitude!=null?'GPS recorded':'Not required');
          tr.innerHTML='<td>'+esc(row.guard_email)+'</td><td>'+esc(row.site_name)+'</td><td>'+new Date(row.clocked_in_at).toLocaleString()+'</td><td>'+(row.clocked_out_at?new Date(row.clocked_out_at).toLocaleString():'—')+'</td><td>'+duration(row.break_seconds)+'</td><td>'+duration(row.worked_seconds)+'</td><td>'+locationProof+'</td><td>'+badge+'</td>';body.appendChild(tr)});
        if(!rows.length)body.innerHTML='<tr><td colspan="8" class="empty">No attendance records found.</td></tr>';activeCount.textContent=active;breakCount.textContent=onBreak;workedTotal.textContent=(total/3600).toFixed(2);
      }catch(err){body.innerHTML='';status.textContent=err.message;status.className='error'}
    }
    dateFilter.value=new Date().toISOString().slice(0,10);loadFilters().then(loadAttendance);setInterval(loadAttendance,30000);
  </script>
</body>
</html>
