name: Vision UI scaffold checks

on:
  pull_request:
  push:
    branches: [feature/vision-v01-scaffold]

jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/vision-ui.test.js
