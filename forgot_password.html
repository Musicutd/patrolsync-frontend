<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><style>body{font-family:Arial;max-width:440px;margin:70px auto;padding:20px}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#2563eb;color:white;border:0;border-radius:6px}.status{margin-top:12px}.error{color:red}.success{color:green}</style></head><body><p><a href="login.html">← Login</a></p><h2>Reset your password</h2><p>Enter the email used for your PatrolSync account. If it exists, we will email a secure 30-minute reset link.</p><input id="email" type="email" placeholder="Email address"><button onclick="send()">Send Reset Link</button><div id="status" class="status"></div><script>const API='https://patrolsync-backend.onrender.com';async function send(){const s=document.getElementById('status');s.textContent='Sending…';s.className='status';try{const r=await fetch(API+'/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');s.textContent=d.message;s.className='status success'}catch(e){s.textContent=e.message;s.className='status error'}}</script></body></html>
