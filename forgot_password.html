<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><style>body{font-family:Arial;max-width:440px;margin:70px auto;padding:20px}input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;font-size:15px}button{background:#2563eb;color:white;border:0;border-radius:6px}.status{margin-top:12px}.error{color:red}.success{color:green}</style></head><body><p><a id="back" href="login.html">← Login</a></p><h2>Reset your password</h2><p>Select the correct account type. This matters when the same email is used for both an administrator and a guard.</p><select id="accountType"><option value="admin">Administrator or office staff</option><option value="guard">Security guard</option></select><input id="email" type="email" placeholder="Email address"><button onclick="send()">Send Reset Link</button><div id="status" class="status"></div><script>const API='https://patrolsync-backend.onrender.com',requestedRole=new URLSearchParams(location.search).get('role');if(requestedRole==='guard'){document.getElementById('accountType').value='guard';document.getElementById('back').href='guard.html'}async function send(){const s=document.getElementById('status');s.textContent='Sending…';s.className='status';try{const r=await fetch(API+'/api/auth/forgot-password-by-role',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),account_type:document.getElementById('accountType').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');s.textContent=d.message;s.className='status success'}catch(e){s.textContent=e.message;s.className='status error'}}</script></body></html>
