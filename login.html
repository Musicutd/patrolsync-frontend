<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatrolSync - Log In</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 20px; }
    h2 { color: #222; text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 14px; }
    .status { font-weight: bold; margin-top: 10px; text-align: center; }
    .success { color: green; }
    .error { color: red; }
    .links-row { text-align: center; margin-top: 20px; font-size: 14px; display: flex; justify-content: center; gap: 16px; }
    .links-row a { color: #2563eb; }
    .role-link { display: block; text-align: center; margin-top: 10px; }
    .role-link a { color: #7c3aed; font-weight: bold; font-size: 14px; }
    .client-link a { color: #047857; }
  </style>
</head>
<body>
  <h2>PatrolSync — Admin Log In</h2>

  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">

  <button onclick="doLogin()">Log In</button>
  <div id="mfaStep" style="display:none;border:1px solid #dbe3ee;border-radius:8px;padding:12px;margin-top:12px">
    <p id="mfaMessage">Enter the six-digit code sent to your email.</p>
    <input type="text" id="mfaCode" inputmode="numeric" maxlength="6" placeholder="6-digit verification code">
    <button onclick="verifyMfa()">Verify & Log In</button>
    <button onclick="cancelMfa()" style="background:#64748b">Cancel</button>
  </div>
  <div id="loginStatus" class="status"></div>

  <div class="links-row">
    <a href="signup.html">Create a company account</a>
    <a href="forgot_password.html">Forgot password?</a>
  </div>

  <div class="role-link">
    <a href="guard.html">Are you a guard? Log in here →</a>
  </div>

  <div class="role-link client-link">
    <a href="client_portal.html">Are you a client? Log in here →</a>
  </div>

  <script>
    const API_BASE = 'https://patrolsync-backend.onrender.com';
    let mfaChallenge = null;

    function clearAllSessions() {
      localStorage.removeItem('token');
      localStorage.removeItem('tenant_id');
      localStorage.removeItem('user_email');
      localStorage.removeItem('guard_token');
      localStorage.removeItem('guard_tenant_id');
      localStorage.removeItem('guard_user_id');
      localStorage.removeItem('guard_email');
      localStorage.removeItem('client_token');
      localStorage.removeItem('clientToken');
      localStorage.removeItem('client_tenant_id');
      localStorage.removeItem('client_site_id');
      localStorage.removeItem('client_site_name');
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const statusDiv = document.getElementById('loginStatus');

      if (!email || !password) {
        statusDiv.textContent = 'Email and password are required';
        statusDiv.className = 'status error';
        return;
      }

      statusDiv.textContent = 'Logging in...';
      statusDiv.className = 'status';

      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          await res.text();
          throw new Error('Backend returned non-JSON response. Check that the PatrolSync backend is running and the URL is correct.');
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        if (data.mfa_required) {
          mfaChallenge = data.challenge_token;
          document.getElementById('mfaStep').style.display = 'block';
          document.getElementById('mfaMessage').textContent = 'Enter the six-digit code sent to ' + data.masked_email + '.';
          document.getElementById('mfaCode').focus();
          statusDiv.textContent = 'Verification code sent.';
          statusDiv.className = 'status success';
          return;
        }

        if (!['admin', 'staff'].includes(data.user.role)) {
          statusDiv.textContent = 'This account must use the guard or client login page.';
          statusDiv.className = 'status error';
          return;
        }

        clearAllSessions();
        localStorage.setItem('token', data.token);
        localStorage.setItem('tenant_id', data.tenant_id);
        localStorage.setItem('user_email', data.user.email);
        localStorage.setItem('user_role', data.user.role);

        statusDiv.textContent = 'Welcome back! Redirecting...';
        statusDiv.className = 'status success';
        setTimeout(() => { window.location.href = data.user.role === 'staff' ? 'staff_dashboard.html' : 'dashboard.html'; }, 600);
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.className = 'status error';
      }
    }

    async function verifyMfa() {
      const code = document.getElementById('mfaCode').value.trim(), statusDiv = document.getElementById('loginStatus');
      if (!mfaChallenge || !/^\d{6}$/.test(code)) { statusDiv.textContent='Enter the six-digit code'; statusDiv.className='status error'; return; }
      try {
        const res=await fetch(API_BASE+'/api/auth/mfa/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge_token:mfaChallenge,code})});
        const data=await res.json(); if(!res.ok)throw Error(data.error||'Verification failed');
        clearAllSessions();localStorage.setItem('token',data.token);localStorage.setItem('tenant_id',data.tenant_id);localStorage.setItem('user_email',data.user.email);localStorage.setItem('user_role',data.user.role);
        statusDiv.textContent='Verified! Redirecting...';statusDiv.className='status success';setTimeout(()=>{location.href=data.user.role==='staff'?'staff_dashboard.html':'dashboard.html'},500);
      } catch(e) { statusDiv.textContent=e.message;statusDiv.className='status error'; }
    }
    function cancelMfa(){mfaChallenge=null;document.getElementById('mfaStep').style.display='none';document.getElementById('mfaCode').value='';}

    document.getElementById('loginPassword').addEventListener('keydown', event => {
      if (event.key === 'Enter') doLogin();
    });
    document.getElementById('mfaCode').addEventListener('keydown', event => { if(event.key==='Enter')verifyMfa(); });
  </script>
</body>
</html>
