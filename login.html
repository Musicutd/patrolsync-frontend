<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PatrolSync - Log In</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 20px; }
    h2 { color: #222; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; font-size: 14px; }
    button { background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #999; }
    #status { margin-top: 10px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
    .link-row { text-align: center; margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Log In to PatrolSync</h2>
  <form id="loginForm">
    <label>Tenant ID</label>
    <input type="number" id="tenant_id" required placeholder="e.g. 8">

    <label>Email</label>
    <input type="email" id="email" required placeholder="you@company.com">

    <label>Password</label>
    <input type="password" id="password" required>

    <button type="submit" id="submitBtn">Log In</button>
  </form>
  <div id="status"></div>
  <div class="link-row">Don't have an account? <a href="signup.html">Sign up</a></div>

  <script>
    const API_URL = 'https://patrolsync-backend.onrender.com/api/auth/login';
    const form = document.getElementById('loginForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = 'Logging in...';
      statusDiv.className = '';

      const payload = {
        tenant_id: Number(document.getElementById('tenant_id').value),
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('token', data.token);
        localStorage.setItem('tenant_id', data.tenant_id);
        localStorage.setItem('user_email', data.user.email);

        statusDiv.textContent = 'Login successful! Redirecting...';
        statusDiv.className = 'success';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.className = 'error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
