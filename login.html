<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatrolSync - Log In</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 20px; }
    h2 { color: #222; text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 14px; }
    .status { font-weight: bold; margin-top: 10px; text-align: center; }
    .success { color: green; }
    .error { color: red; }
    .links-row { text-align: center; margin-top: 20px; font-size: 14px; display: flex; justify-content: center; gap: 16px; }
    .links-row a { color: #2563eb; }
    .guard-link { display: block; text-align: center; margin-top: 10px; }
    .guard-link a { color: #7c3aed; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <h2>PatrolSync — Admin Log In</h2>

  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">

  <button onclick="doLogin()">Log In</button>
  <div id="loginStatus" class="status"></div>

  <div class="links-row">
    <a href="signup.html">Create a company account</a>
  </div>

  <div class="guard-link">
    <a href="guard.html">Are you a guard? Log in here →</a>
  </div>

  <script>
    const API_BASE = 'https://patrolsync-backend.onrender.com';

    function clearAllSessions() {
      localStorage.removeItem('token');
      localStorage.removeItem('tenant_id');
      localStorage.removeItem('user_email');
      localStorage.removeItem('guard_token');
      localStorage.removeItem('guard_tenant_id');
      localStorage.removeItem('guard_user_id');
      localStorage.removeItem('guard_email');
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const statusDiv = document.getElementById('loginStatus');

      if (!email || !password) {
        statusDiv.textContent = 'Email and password are required';
        statusDiv.className = 'status error';
        return;
      }

      statusDiv.textContent = 'Logging in...';
      statusDiv.className = 'status';

      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        if (data.user.role !== 'admin') {
          statusDiv.textContent = 'This account is a guard account. Please use the guard login page.';
          statusDiv.className = 'status error';
          return;
        }

        clearAllSessions();
        localStorage.setItem('token', data.token);
        localStorage.setItem('tenant_id', data.tenant_id);
        localStorage.setItem('user_email', data.user.email);

        statusDiv.textContent = 'Welcome back! Redirecting...';
        statusDiv.className = 'status success';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.className = 'status error';
      }
    }
  </script>
</body>
</html>
