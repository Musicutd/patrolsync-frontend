<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Notifications</title>
<style>body{font-family:Arial;max-width:720px;margin:20px auto;padding:0 14px;background:#f8fafc;color:#172033}.note{background:#fff;border:1px solid #dbe2ea;border-left:6px solid #94a3b8;border-radius:8px;padding:14px;margin:11px 0}.note.unread{box-shadow:0 0 0 2px #bfdbfe}.note.high{border-left-color:#f59e0b}.note.critical{border-left-color:#dc2626;background:#fff1f2}.badge{padding:3px 8px;border-radius:12px;background:#e2e8f0;font-size:12px}button{padding:9px 13px;border:0;border-radius:5px;background:#2563eb;color:#fff;margin-right:6px;cursor:pointer}.ack{background:#16a34a}.meta{font-size:12px;color:#64748b}.error{color:#dc2626}</style></head>
<body><p><a href="guard.html">← Guard Dashboard</a></p><h2>My Notifications</h2><p id="summary">Loading…</p><select id="filter"><option value="active">All active</option><option value="unread">Unread</option><option value="ack_required">Acknowledgement required</option></select> <button id="refresh">Refresh</button><p id="error" class="error"></p><div id="list"></div>
<script>const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token||!tenant)location.replace('guard.html');async function api(path,o={}){const r=await fetch(API+path,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await api(`/api/communication-notifications?tenant_id=${tenant}&status=${$('filter').value}`);$('summary').innerHTML=`<b>${d.unread_count}</b> unread · <b>${d.acknowledgement_count}</b> require acknowledgement`;$('list').innerHTML=d.notifications.length?d.notifications.map(n=>`<div class="note ${esc(n.priority)} ${n.read_at?'':'unread'}"><b>${esc(n.title)}</b> <span class="badge">${esc(n.priority)}</span><p>${esc(n.message)}</p><p class="meta">${esc(n.category)} · ${new Date(n.created_at).toLocaleString()}</p>${n.action_url?`<p><a href="${esc(n.action_url)}">Open details →</a></p>`:''}${n.read_at?'':`<button onclick="mark(${n.id},'read')">Mark Read</button>`}${n.requires_acknowledgement&&!n.acknowledged_at?`<button class="ack" onclick="mark(${n.id},'acknowledge')">Acknowledge</button>`:n.acknowledged_at?'<span class="badge">Acknowledged</span>':''}</div>`).join(''):'<p>No notifications.</p>';$('error').textContent=''}catch(e){$('error').textContent=e.message}}async function mark(id,action){try{await api(`/api/communication-notifications/${id}/${action}`,{method:'PATCH',body:JSON.stringify({tenant_id:Number(tenant)})});load()}catch(e){alert(e.message)}}$('refresh').onclick=load;$('filter').onchange=load;load();</script></body></html>
