<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Availability & Leave</title><style>body{font-family:Arial;max-width:800px;margin:25px auto;padding:0 15px;background:#f8fafc;color:#172033}a{color:#2563eb;text-decoration:none}.card{background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:17px;margin:14px 0}.day{display:grid;grid-template-columns:130px 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}input,select,textarea{width:100%;padding:8px;box-sizing:border-box}input[type=checkbox]{width:auto}button{padding:10px 14px;background:#2563eb;color:white;border:0;border-radius:6px;margin-top:10px}.leave{padding:11px 0;border-bottom:1px solid #eee}.badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold}.pending{background:#dbeafe}.approved{background:#dcfce7}.rejected{background:#fee2e2}.status{font-weight:bold;margin-top:8px}.error{color:#dc2626}.success{color:#16a34a}.row{display:flex;gap:8px}.row>*{flex:1}@media(max-width:600px){.day{grid-template-columns:1fr}.row{display:block}}</style></head><body><p><a href="guard.html">← Guard App</a></p><h2>Availability & Leave</h2><div class="card"><h3>Weekly Availability</h3><p>Scheduling will be restricted to these days and times.</p><div id="days"></div><button onclick="saveAvailability()">Save Availability</button><div id="availabilityStatus" class="status"></div></div><div class="card"><h3>Request Leave</h3><div class="row"><input type="date" id="leaveStart"><input type="date" id="leaveEnd"></div><select id="leaveType"><option value="annual">Annual leave</option><option value="sick">Sick leave</option><option value="unpaid">Unpaid leave</option><option value="other">Other</option></select><textarea id="leaveReason" placeholder="Reason or notes"></textarea><button onclick="requestLeave()">Submit Request</button><div id="leaveStatus" class="status"></div></div><div class="card"><h3>My Requests</h3><div id="requests"></div></div><script>
const API='https://patrolsync-backend.onrender.com',token=localStorage.getItem('guard_token'),tenant=localStorage.getItem('guard_tenant_id');if(!token||!tenant)location.replace('guard.html');const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function buildDays(rows=[]){days.innerHTML='';names.forEach((name,i)=>{const r=rows.find(x=>Number(x.weekday)===i),available=r?r.is_available:true;const div=document.createElement('div');div.className='day';div.innerHTML='<label><input type="checkbox" data-enabled="'+i+'" '+(available?'checked':'')+'> '+name+'</label><input type="time" data-from="'+i+'" value="'+(r?.available_from||'00:00')+'"><input type="time" data-until="'+i+'" value="'+(r?.available_until||'23:59')+'">';days.appendChild(div)})}
async function load(){const r=await fetch(API+'/api/availability?tenant_id='+tenant,{headers:H()}),data=await r.json();buildDays(data);loadRequests()}
async function saveAvailability(){const payload=names.map((_,i)=>({weekday:i,is_available:document.querySelector('[data-enabled="'+i+'"]').checked,available_from:document.querySelector('[data-from="'+i+'"]').value,available_until:document.querySelector('[data-until="'+i+'"]').value}));try{const r=await fetch(API+'/api/availability',{method:'PUT',headers:H(),body:JSON.stringify({tenant_id:Number(tenant),days:payload})}),d=await r.json();if(!r.ok)throw Error(d.error);availabilityStatus.textContent='Availability saved.';availabilityStatus.className='status success'}catch(e){availabilityStatus.textContent=e.message;availabilityStatus.className='status error'}}
async function requestLeave(){try{const r=await fetch(API+'/api/leave-requests',{method:'POST',headers:H(),body:JSON.stringify({tenant_id:Number(tenant),start_date:leaveStart.value,end_date:leaveEnd.value,leave_type:leaveType.value,reason:leaveReason.value})}),d=await r.json();if(!r.ok)throw Error(d.error);leaveStatus.textContent='Request submitted.';leaveStatus.className='status success';loadRequests()}catch(e){leaveStatus.textContent=e.message;leaveStatus.className='status error'}}
async function loadRequests(){const r=await fetch(API+'/api/leave-requests?tenant_id='+tenant,{headers:H()}),rows=await r.json();requests.innerHTML=rows.length?rows.map(x=>'<div class="leave"><span class="badge '+x.status+'">'+x.status+'</span> <b>'+x.leave_type+'</b> · '+String(x.start_date).slice(0,10)+' to '+String(x.end_date).slice(0,10)+(x.review_notes?'<br>Admin: '+x.review_notes:'')+(x.status==='pending'?'<br><button onclick="cancelLeave('+x.id+')">Cancel</button>':'')+'</div>').join(''):'No requests yet.'}
async function cancelLeave(id){if(!confirm('Cancel this request?'))return;const r=await fetch(API+'/api/leave-requests/'+id+'?tenant_id='+tenant,{method:'DELETE',headers:H()}),d=await r.json();if(!r.ok)alert(d.error);loadRequests()}buildDays();load();
</script></body></html>
